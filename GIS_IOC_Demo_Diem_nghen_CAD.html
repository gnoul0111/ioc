return `<div class="ur"><div><div>${x.role}: <b>${x.n}</b></div><div class="mut" style="font-size:12px">${dd?'Đã chỉ đạo '+x.full:'Đề xuất '+x.full+' · điểm '+x.sc+' · cách '+x.d+' km'}</div></div>${ctl}</div>`}).join('');
}
h+='<div style="border-top:1px solid var(--bd);margin-top:6px"></div>';
h+=prev(i)+(S.tk.length?S.tk.map(t=>{const n=INC.find(x=>x.id===t.id),cl=t.p===5;return `<div class="tkt"><div class="th"><b>#${t.no} ${t.u}</b><span class="tag ${cl?'ok':''}" ${cl?'':'style="color:#f5b82e;border-color:#f5b82e"'}>${cl?'Đã đóng':'Đang xử lý'}</span></div><div class="mut" style="font-size:12px">${n.n} · ${MT[t.m]}</div>${tl(stg(t,n))}</div>`}).join(''):(prev(i)?'':'<p class="mut" style="margin:8px 0 0">Chưa có phiếu lệnh nào.</p>'));
h+=`<div class="lb" style="margin:14px 0 8px;padding-top:14px;border-top:1px solid var(--bd)">NHẬT KÝ CHỈ ĐẠO</div>${S.log.map(x=>`<div class="lgrow"><b>${x[0]}</b><span class="mut">${x[1]}</span></div>`).join('')}</div>`;
{const left=i?[0,1,2,3].filter(k=>!(S.done[i.id]||[]).includes(k)):[];const n=S.mode==='semi'&&i?left.filter(k=>S.chk[i.id][k]).length:left.length;h+=`<div class="ft" style="grid-template-columns:1fr 1fr"><button class="btn" style="background:transparent;border:1px solid var(--bd2);color:var(--tx)" data-act="cancel" ${i?'':'disabled'}>Hủy</button><button class="btn" data-act="send" ${n?'':'disabled'}>Phát phiếu lệnh (${n})</button></div>`}}
$('pnl').innerHTML=h;
document.querySelectorAll('[data-sc]').forEach(e=>{if(sc[e.dataset.sc]!=null)e.scrollTop=sc[e.dataset.sc]});
document.querySelectorAll('[data-act=nt]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===S.nt)));
let nh='';
const urg=INC.filter(i=>i.p&&st(i)<2);$('urgn').textContent=urg.length+1;
if(S.nt==='urg')nh=urg.map(i=>`<div class="ncard" style="border-color:#ff5d6c"><div class="n">${i.n}<span class="src">${i.s}</span></div><div class="s" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${priorityTag(i)}${statusTag(i)}<span>SLA 5 phút · ${i.a}</span></div><button class="btn s" data-act="go" data-id="${i.id}">Chỉ đạo</button></div>`).join('')+`<div class="ncard" style="border-color:#ff5d6c"><div class="n">${DOCS[0][0]}</div><div class="s">${DOCS[0][1]}</div><span class="tag pri">Quá hạn 1 ngày</span></div>`;
else if(S.nt==='gis')nh=INC.slice().sort((a,b)=>((b.p&&st(b)<2)?1:0)-((a.p&&st(a)<2)?1:0)||st(a)-st(b)).map(i=>`<div class="ncard"><div class="n">${i.n}<span class="src">${i.s}</span></div><div class="s">${i.s==='Camera AI'?'Camera AI':'Phản ánh'} · ${i.a}</div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:7px 0">${priorityTag(i)}${statusTag(i)}</div>${st(i)===2?'':`<button class="btn s" data-act="go" data-id="${i.id}">Chỉ đạo</button>`}</div>`).join('');
else nh=(S.nt==='doc'?DOCS:OKR).map(d=>`<div class="ncard"><div class="n">${d[0]}</div><div class="s">${d[1]}</div><span class="tag" style="${d[2]==='Quá hạn 1 ngày'?'color:#ff8b96;border-color:#ff5d6c':'border-color:var(--bd2)'}">${d[2]}</span></div>`).join('');
$('nty').innerHTML=nh}
init();
</script>
</body>
</html>
