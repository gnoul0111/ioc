<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IOC/CAD Thanh uy Ha Noi - Nguon du lieu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../theme.css" />
</head>

<body class="app-bg-grid">
    <main id="app">
        <article class="widget" id="sourcesWidget" data-widget="sources">
            <div class="widget-head">
                <div class="widget-title">Nguồn dữ liệu &amp; cập nhật gần nhất</div><button class="mini-btn"
                    onclick="toggleWidgetBody(this)">−</button>
            </div>
            <div class="widget-body">
                <div class="source-list" id="sourceList"></div>
            </div>
        </article>
    </main>

    <!-- Lop phu dung chung (customizer / overlay / drawer / modal / toast) -->
    <div id="customizer" class="widget-customizer">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
            <b>Ẩn/hiện widget dashboard</b>
            <button class="close" onclick="toggleCustomizer()">×</button>
        </div>
        <div class="muted" style="margin-top:6px;line-height:1.4">Cấu hình lưu riêng theo tài khoản đang đăng nhập.
        </div>
        <div class="custom-list" id="customList"></div>
    </div>

    <div id="overlay" class="overlay"></div>
    <aside id="drawer" class="drawer">
        <div class="drawer-head">
            <div>
                <h3 id="drawerTitle">Danh sách</h3>
                <p id="drawerSub">--</p>
            </div>
            <button class="close" onclick="closeDrawer()">×</button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <section id="modal" class="modal">
        <div class="modal-head">
            <div>
                <h3 id="modalTitle">Chi tiết</h3>
                <div class="muted" id="modalSub"></div>
            </div><button class="close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </section>

    <div id="toast" class="toast"></div>
    <script>
        window.IOC_API_BASE = 'https://administrator.lifetex.vn:324';
        window.IOC_API_KEY = 'dev-api-key-001';
        window.XA_PHUONG = 'phuong_viet_hung';
    </script>

    <script src="script.js"></script>
    <script>
        // --- WIDGET THEME (đồng bộ với dashboard: postMessage + localStorage) ---
        const WIDGET_THEME_KEY = 'px-ioc-theme';
        function applyWidgetTheme(theme) {
            const t = (theme === 'light' || theme === 'green') ? theme : 'dark';
            document.documentElement.classList.remove('theme-light', 'theme-green');
            document.body.classList.remove('theme-light', 'theme-green');
            if (t !== 'dark') {
                document.documentElement.classList.add('theme-' + t);
                document.body.classList.add('theme-' + t);
            }
        }
        function initWidgetTheme() {
            let saved = 'dark';
            try { saved = localStorage.getItem(WIDGET_THEME_KEY) || 'dark'; } catch (e) { }
            applyWidgetTheme(saved);
        }
        initWidgetTheme();
        // --- FULLSCREEN MODAL OBSERVER ---
        (function () {
            if (window.parent === window) return;

            document.documentElement.classList.add("embedded-dashboard");
            document.body.classList.add("embedded-dashboard");

            let isExpanded = false;
            let __collapseTimer = null;

            function checkExpanded() {
                const activeModals = document.querySelectorAll(".modal.show, .modal.open, .drawer.show, .drawer.open, .overlay.show");
                const shouldExpand = activeModals.length > 0;

                if (shouldExpand && !isExpanded) {
                    if (__collapseTimer) { clearTimeout(__collapseTimer); __collapseTimer = null; }
                    window.parent.postMessage({ type: "expand_iframe" }, "*");
                    document.documentElement.style.setProperty("background", "transparent", "important");
                    document.body.style.setProperty("background", "transparent", "important");
                    document.body.classList.remove("app-bg-grid");
                    isExpanded = true;
                } else if (!shouldExpand && isExpanded) {
                    if (__collapseTimer) clearTimeout(__collapseTimer);
                    __collapseTimer = setTimeout(function () {
                        __collapseTimer = null;
                        document.documentElement.style.removeProperty("background");
                        document.body.style.removeProperty("background");
                        document.body.classList.add("app-bg-grid");
                        window.parent.postMessage({ type: "collapse_iframe" }, "*");
                    }, 50);
                                        isExpanded = false;
                }
            }

            function resetAppStyles() {
                const app = document.getElementById("app") || document.querySelector("main");
                if (app) {
                    app.style.removeProperty("position");
                    app.style.removeProperty("top");
                    app.style.removeProperty("left");
                    app.style.removeProperty("width");
                    app.style.removeProperty("height");
                    app.style.removeProperty("opacity");
                    app.style.removeProperty("overflow");
                    app.style.removeProperty("z-index");
                }
            }

            window.addEventListener("message", function (e) {
                if (!e.data) return;
                if (e.data.type === "set_widget_rect") {
                    const app = document.getElementById("app") || document.querySelector("main");
                    if (app) {
                        app.style.position = "absolute";
                        app.style.top = e.data.top + "px";
                        app.style.left = e.data.left + "px";
                        app.style.width = e.data.width + "px";
                        app.style.height = e.data.height + "px";
                        app.style.overflow = "hidden";
                        app.style.opacity = "1";
                    }
                } else if (e.data.type === "reset_widget_rect") {
                    resetAppStyles();
                } else if (e.data.type === "set_theme") {
                    applyWidgetTheme(e.data.theme);
                }
            });

            const observer = new MutationObserver(checkExpanded);
            observer.observe(document.body, { attributes: true, subtree: true, attributeFilter: ["class", "style"] });
            observer.observe(document.documentElement, { attributes: true, attributeFilter: ["class", "style"] });
        })();
    </script>
</body>

</html>
