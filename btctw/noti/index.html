<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IOC/CAD xã Phú Xuyên · Dashboard xử lý (Stacked bar)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../theme.css" />
</head>

<body class="app-bg-grid">
    <main id="app" class="dashboard-grid">
        <article class="widget" id="notificationsWidget" data-widget="notifications">
            <div class="widget-head">
                <div class="widget-title">Notify IOC/CAD cần xử lý</div><button class="mini-btn"
                    onclick="toggleWidgetBody(this)">−</button>
            </div>
            <div class="widget-body">
                <!-- Toolbar + dải tab gộp chung 1 khối .cad-toolbar (sticky) — tách rời thì phần tab cuộn đi còn
                     toolbar dính đè lên, chồng chữ khi cuộn. background:var(--panel) ghi đè nền gradient mờ gốc. -->
                <div class="cad-toolbar" style="background:var(--panel)">
                    <div style="display:flex;gap:6px;align-items:center">
                        <input id="notiPanelSearch" type="search" class="notify-toolbar-ctl"
                            placeholder="🔍 Tìm kiếm thông báo..." oninput="onNotiPanelSearch()"
                            style="flex:1;min-width:0" />
                        <div id="cadToolbar" style="flex:0 0 auto"></div>
                        <!-- .ms-wrap để tái dùng cơ chế đóng-khi-bấm-ra-ngoài có sẵn của mọi .ms-dropdown -->
                        <div class="ms-wrap noti-filter-wrap">
                            <button id="notiFilterBtn" class="ghost notify-icon-btn"
                                onclick="toggleUnitDropdown_noti('notiStatusFilterDropdown')" title="Lọc trạng thái"
                                style="width:40px;height:40px"><svg width="17" height="17" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polygon points="3 4 21 4 14 12.5 14 19 10 21 10 12.5 3 4"></polygon>
                                </svg></button>
                            <div id="notiStatusFilterDropdown" class="ms-dropdown hidden noti-filter-dropdown"></div>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;margin-top:8px">
                        <button class="ghost notify-icon-btn" onclick="notiScrollTabs(-1)" title="Tab trước"
                            style="width:26px;height:26px;border-radius:6px"><svg width="13" height="13"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                                stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg></button>
                        <div id="notiTabsBox"></div>
                        <button class="ghost notify-icon-btn" onclick="notiScrollTabs(1)" title="Tab tiếp"
                            style="width:26px;height:26px;border-radius:6px"><svg width="13" height="13"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                                stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg></button>
                    </div>
                </div>
                <!-- Panel notify cũ (thống kê theo API notify-statistic) giữ trong DOM nhưng ẩn — renderNotifications()
                     vẫn ghi vào #notifyList, không xóa code. -->
                <div style="display:none"><div class="notify-list" id="notifyList"></div></div>
                <div class="notify-list" id="notiPanelList"></div>
            </div>
        </article>
    </main>

    <!-- Lớp phủ dùng chung (drawer cấp 1 / modal cấp 2 / toast / customizer) -->
    <div id="customizer" class="widget-customizer">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
            <b>Ẩn/hiện widget dashboard</b>
            <button class="close" onclick="toggleCustomizer()">×</button>
        </div>
        <div class="muted" style="margin-top:6px;line-height:1.4">Cấu hình lưu riêng theo tài khoản đang đăng nhập.
        </div>
        <div class="custom-list" id="customList"></div>
    </div>

    <div id="overlay_notify" class="overlay" onclick="closePanelsNotify()"></div>
    <aside id="drawer_notify" class="drawer">
        <div class="drawer-head">
            <div>
                <h3 id="drawerTitleNotify">Danh sách</h3>
                <p id="drawerSubNotify">--</p>
            </div>
            <button class="close" onclick="closeDrawerNoti()">×</button>
        </div>
        <div class="drawer-body" id="drawerBodyNotify"></div>
    </aside>

    <section id="modal_notify" class="modal">
        <div class="modal-head">
            <div>
                <h3 id="modalTitleNotify">Chi tiết</h3>
                <div class="muted" id="modalSubNotify"></div>
            </div><button class="close" onclick="closeModalNoti()">×</button>
        </div>
        <div class="modal-body" id="modalBodyNotify"></div>
    </section>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
    <script>
        // --- FULLSCREEN MODAL OBSERVER ---
        (function () {
            if (window.parent === window) return;

            document.documentElement.classList.add("embedded-dashboard");
            document.body.classList.add("embedded-dashboard");

            let isExpanded = false;
            let __collapseTimer = null;

            function resetAppStyles() {
                const app = document.getElementById("app");
                if (!app) return;
                ["position", "top", "left", "width", "height", "opacity", "overflow", "z-index"]
                    .forEach(p => app.style.removeProperty(p));
            }

            function checkExpanded() {
                const shouldExpand = document.querySelectorAll(".modal.open, .drawer.open, .overlay.show").length > 0;
                if (shouldExpand === isExpanded) return;

                if (shouldExpand) {
                    if (__collapseTimer) { clearTimeout(__collapseTimer); __collapseTimer = null; }
                    window.parent.postMessage({ type: "expand_iframe" }, "*");
                    document.documentElement.style.setProperty("background", "transparent", "important");
                    document.body.style.setProperty("background", "transparent", "important");
                    document.body.classList.remove("app-bg-grid");
                } else {
                    if (__collapseTimer) clearTimeout(__collapseTimer);
                    __collapseTimer = setTimeout(function () {
                        __collapseTimer = null;
                        document.documentElement.style.removeProperty("background");
                        document.body.style.removeProperty("background");
                        document.body.classList.add("app-bg-grid");
                        window.parent.postMessage({ type: "collapse_iframe" }, "*");
                    }, 50);
                                    }
                isExpanded = shouldExpand;
            }

            window.addEventListener("message", function (e) {
                if (!e.data) return;
                if (e.data.type === "set_widget_rect") {
                    const app = document.getElementById("app") || document.querySelector("main");
                    if (!app) return;
                    app.style.position = "absolute";
                    app.style.top = e.data.top + "px";
                    app.style.left = e.data.left + "px";
                    app.style.width = e.data.width + "px";
                    app.style.height = e.data.height + "px";
                    app.style.overflow = "hidden";
                    app.style.opacity = "1";
                } else if (e.data.type === "reset_widget_rect") {
                    resetAppStyles();
                }
            });

            new MutationObserver(checkExpanded).observe(document.body, {
                attributes: true, subtree: true, attributeFilter: ["class"]
            });
        })();
    </script>
</body>

</html>
