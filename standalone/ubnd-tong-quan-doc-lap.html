  const prevI = STC_INDICATORS[(at - 1 + STC_INDICATORS.length) % STC_INDICATORS.length], nextI = STC_INDICATORS[(at + 1) % STC_INDICATORS.length];
  let h = stcHeader(res, o);
  h += '<div style="display:grid;gap:16px;min-width:0">';

  /* 1. Sơ đồ thẻ số */
  h += '<div class="stc-card"><div class="stc-crumbs"><span>Sở Tài chính › ' + stcE(grp ? grp.label : '') + ' › ' + stcE(ind.label) + '</span></div>' +
    '<div class="stc-ch" style="margin-bottom:6px"><div><h3 class="stc-ct" style="font-size:17px">' + stcE(ind.label) + '</h3><div class="stc-cs">' + stcE(ind.unit + ' · ' + stcQ(res.year, res.period)) + '</div></div>' +
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end"><span class="stc-hint">' + (at + 1) + ' / ' + STC_INDICATORS.length + '</span><button type="button" class="stc-btn" onclick="stcStep(-1)" aria-label="Chỉ tiêu trước" style="height:32px;padding:0 12px;font-size:12.5px">‹ Trước</button><button type="button" class="stc-btn" onclick="stcStep(1)" aria-label="Chỉ tiêu sau" style="height:32px;padding:0 12px;font-size:12.5px">Sau ›</button>' + stcWarnBadge(ind) + (STC_SHOW_TECH ? '<span class="stc-bd">' + stcE(ind.apis.join(' · ')) + '</span>' : '') + '</div></div>';
  if (ind.state === 'ok') h += '<div class="stc-hint" style="margin-bottom:6px">Bấm một thẻ để chọn, bấm lại để bỏ chọn. Chỉ tiêu 3 cấp mọc thêm hàng thẻ ngay dưới thẻ cha.</div>' + stcOcDiagram(ind);
  else if (ind.state === 'nodata') h += stcNodataNote(res) + '<div class="stc-blank" style="margin-top:12px">' + stcOcDiagram(stcBlank(ind)) + '</div>';
  else h += stcStateBody(ind, res);
  if (ind.state === 'ok' && ind.warns.length) h += '<div class="stc-warnbox stc-note" style="color:var(--warn)">' + STC_ICON_WARN + '<div><b>Cần đối soát:</b> ' + ind.warns.map((w) => stcE(stcWarnTxt(w))).join('; ') + '</div></div>';
  h += '</div>';

  const live = ind.state === 'ok';
  if (ind.state !== 'missing') {
    /* 2. Cầu nối */
    const wf = live ? stcWaterfall(ind, node, res) : { ok: false, sub: node.label, msg: 'Chưa có số liệu nên chưa vẽ được cầu nối tăng giảm. Khi có số cho cả hai kỳ, cầu nối sẽ hiện ở đây.' };
    h += '<div class="stc-card"><div class="stc-ch" style="margin-bottom:10px"><div><h3 class="stc-ct">Cầu nối tăng giảm</h3><div class="stc-cs">' + stcE(wf.sub) + '</div></div></div>';
    h += wf.ok ? '<div class="stc-wf">' + wf.grid + wf.bars + '</div><div class="stc-wfl">' + wf.labels + '</div><div class="stc-hint" style="margin-top:12px">' + stcE(wf.note) + '</div>' : stcEmptyBox('Chưa vẽ được cầu nối', wf.msg);
    h += '</div>';
    /* 3. Xu hướng | Số liệu gốc */
    const tr = live ? stcTrend(node, res) : null;
    h += '<div class="stc-g2"><div class="stc-card"><div class="stc-ch" style="margin-bottom:8px"><div><h3 class="stc-ct">Xu hướng theo quý</h3><div class="stc-cs">' + stcE(node.label) + '</div></div></div>' +
      (tr ? tr.svg + '<div class="stc-hint" style="margin-top:6px">Chỉ vẽ điểm khi bản chụp có số của quý đó. Quý chưa có để trống và <b>không nội suy</b>; nét đứt chỉ nối các điểm cách nhau. Nạp thêm kỳ thì điểm tự vẽ thêm.</div>' : stcEmptyBox('Chưa vẽ được xu hướng', live ? 'Cần ít nhất hai kỳ có số. Mục này chưa có giá trị cùng kỳ năm trước hoặc chưa có bản chụp của các quý khác.' : 'Chưa có số liệu để vẽ xu hướng. Khi có số, các quý có bản chụp sẽ hiện thành điểm.')) + '</div>';
  } else h += '<div>';
  const rows = stcCollectRows(node);
  h += '<div class="stc-card"><div class="stc-ch" style="margin-bottom:10px"><div><h3 class="stc-ct">' + (STC_SHOW_TECH ? 'Số liệu gốc từ API' : 'Số liệu thành phần') + '</h3><div class="stc-cs">' + stcE(node.label) + '</div></div></div><div class="stc-rawh">' + (STC_SHOW_TECH ? '<span>chiTieu</span><span>loai</span><span>giaTri</span><span>quy</span>' : '<span>Thành phần</span><span>Kỳ</span><span>Giá trị</span><span>Quý</span>') + '</div>';
  h += rows.length ? rows.map((r) => '<div class="stc-rawrow"><span>' + stcE(r.chiTieu) + '</span><span>' + stcE(r.loai) + '</span><span>' + stcE(stcFmt(r.giaTri, Math.round(r.giaTri) === r.giaTri ? 0 : 1)) + '</span><span>' + stcE(r.quy) + '</span></div>').join('') : '<div class="stc-hint" style="padding:10px 6px">' + (STC_SHOW_TECH ? 'Mục này không có dòng API riêng: form cộng từ các mục bên dưới.' : 'Mục này không có số riêng: cộng từ các mục bên dưới.') + '</div>';
  h += '<div class="stc-hint" style="margin-top:12px">' + (STC_SHOW_TECH ? 'Đúng như API trả về trong bản chụp (' : 'Đúng như số liệu Sở Tài chính cung cấp (bản chụp ') + stcE(stcStampText(res.importedAt)) + ').</div></div></div>';

  /* 4. Cách tính */
  /* Khối Cách tính ẨN theo cờ chung SHOW_FORMULA_BOX (dashboard-vhtt.js): cách tính để trong tài liệu mô tả, không hiện trên giao diện.
     Không có cờ (trang độc lập không nạp dashboard-vhtt.js) cũng ẩn — chỉ hiện khi SHOW_FORMULA_BOX = true */
  if (typeof SHOW_FORMULA_BOX !== 'undefined' && SHOW_FORMULA_BOX) h += '<div class="stc-card"><div class="stc-ch" style="margin-bottom:10px"><div><h3 class="stc-ct">Cách tính · ' + stcE(node.label) + '</h3><div class="stc-cs">Công thức tính từ số API, không có số nào tự đặt</div></div></div><div class="stc-fl">' +
    (live ? stcFormulas(ind, node, res) : ['Nguồn: API ' + ind.apis.join(' + ') + '.', 'API trả toàn bộ giá trị bằng 0 nên chưa tính được tổng, mức tăng giảm, tỷ trọng và đóng góp. Công thức sẽ hiện ở đây khi có số.']).map((t) => '<div class="stc-note" style="padding:9px 12px;font-size:12.5px">' + stcE(t) + '</div>').join('') + '</div></div>';
  h += '</div>';
  h += '<div class="stc-pn"><button type="button" class="stc-btn" onclick="stcStep(-1)"><span>‹</span><span>' + stcE(prevI.label) + '</span></button><button type="button" class="stc-btn" onclick="stcStep(1)"><span>' + stcE(nextI.label) + '</span><span>›</span></button></div>';
  return h + stcFoot(res);
}

/* ---------- Dựng màn hình + điều khiển ---------- */
/* Khung chờ khi đang nạp nguồn số liệu */
function stcSkeleton() {
  const card = '<div class="stc-card"><div class="stc-skel" style="width:38%;height:16px"></div><div class="stc-skel" style="width:22%;height:30px;margin-top:14px"></div><div class="stc-skel" style="width:70%;height:10px;margin-top:14px"></div><div class="stc-skel" style="width:100%;height:10px;margin-top:22px"></div><div class="stc-skel" style="width:100%;height:10px;margin-top:10px"></div><div class="stc-skel" style="width:86%;height:10px;margin-top:10px"></div></div>';
  return '<div role="status" aria-live="polite" aria-label="Đang tải số liệu">' + '<div class="stc-toolbar"><div class="stc-tl"><div class="stc-chips"><span class="stc-chip"><i></i>Đang tải số liệu…</span></div></div></div>' + '<div class="stc-g2">' + card + card + '</div></div>';
}
/* Không nạp được nguồn số liệu (không tải được tệp bản chụp) */
function stcErrorScreen() {
  return '<div class="stc-toolbar"><div class="stc-tl"><div class="stc-chips"><span class="stc-chip demo"><i></i>Không tải được số liệu</span></div></div></div>' +
    '<div class="stc-card"><div class="stc-empty stc-err" style="min-height:260px">' + STC_ICON_WARN + '<b>Không tải được số liệu của Sở Tài chính</b><span style="font-size:12px;max-width:420px">Tệp bản chụp số liệu (' + (STC_DEMO_ON ? 'js/features/stc-demo-data.js' : 'js/data/stc-snapshot.js') + ') không tải được. Kiểm tra kết nối mạng hoặc tệp đã được đưa lên máy chủ, rồi thử lại. Form không hiển thị số nào khi chưa tải được dữ liệu.</span><button type="button" class="stc-btn primary" style="margin-top:10px" onclick="stcReload()">' + STC_ICON_REFRESH + 'Thử lại</button></div></div>';
}
function stcScreenHtml() {
  if (STC_UI.loading) return stcSkeleton();
  if (STC_UI.error) return stcErrorScreen();
  const res = stcRes();
  if (STC_UI.screen === 'group') return stcScreenGroup(res);
  if (STC_UI.screen === 'detail') return stcScreenDetail(res);
  return stcScreenHome(res);
}
/* Tiêu đề popup (đặt vào phần đầu của #modal của IOC) */
function stcScreenMeta() {
  if (STC_UI.screen === 'group') {
    const gi = STC_GROUPS.findIndex((g) => g.id === STC_UI.group), g = STC_GROUPS[gi < 0 ? 0 : gi];
    return { title: 'Sở Tài chính — ' + g.label, sub: 'Nhóm ' + (gi + 1) + '/' + STC_GROUPS.length + ' · ' + g.inds.length + ' chỉ tiêu' };
  }
  if (STC_UI.screen === 'detail') {
    const it = STC_INDICATORS.find((i) => i.id === STC_UI.ind);
    return { title: 'Sở Tài chính — Chi tiết chỉ tiêu', sub: it ? it.label : '' };
  }
  return { title: 'Sở Tài chính — Bộ chỉ tiêu kinh tế – tài chính Thủ đô', sub: '' + stcT('Số liệu tổng hợp cấp Thành phố từ API của Sở Tài chính Hà Nội', 'Số liệu tổng hợp cấp Thành phố của Sở Tài chính Hà Nội') + '' };
}
/* Form dùng đúng popup chuẩn của IOC (#modal): cùng khung, nền, nút đóng ×, nền mờ, cách cuộn và giao diện sáng/tối/xanh. */
/* Khối "Nhiệm vụ đã giao" dùng chung của IOC (giống các lĩnh vực khác), gắn với lĩnh vực Sở Tài chính; nằm dưới các chỉ tiêu. */
function stcTasksHtml() {
  if (typeof fieldScenarioSummary !== 'function' || STC_UI.loading || STC_UI.error) return '';
  try { return '<div class="stc-tasks" style="margin-top:18px">' + fieldScenarioSummary('cat::' + (STC_UI.role || (typeof currentRole !== 'undefined' ? currentRole : 'UBND')) + '::ubnd-taichinh') + '</div>'; } catch (e) { return ''; }
}
function stcRerender(resetScroll) {
  const body = document.getElementById('modalBody'), title = document.getElementById('modalTitle'), sub = document.getElementById('modalSub');
  if (!body || !STC_UI.open) return;
  const top = body.scrollTop, meta = stcScreenMeta();
  if (title) title.textContent = meta.title;
  if (sub) sub.textContent = (STC_DEMO_ON ? 'DỮ LIỆU MẪU · ' : '') + meta.sub;
  body.innerHTML = '<div class="stc-root stc-wrap">' + stcScreenHtml() + '</div>' + stcTasksHtml();
  if (typeof lcFit === 'function') lcFit(body);
  body.scrollTop = resetScroll ? 0 : top;
  if (resetScroll && STC_UI.focus && STC_UI.screen === 'group') {
    const el = body.querySelector('#stc-ind-' + STC_UI.focus);
    if (el) body.scrollTop = Math.max(0, el.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 12);
  }
  stcApplyZoom(body);
}
/* Phóng to 1 thẻ biểu đồ ra toàn màn hình: tách hẳn thẻ đó ra khỏi #modalBody (chỗ nào khỏi bị #modal/#modalBody
   cắt bớt do có transform/overflow riêng) và đặt vào 1 lớp phủ cố định phủ kín popup; đóng lại thì render bình
   thường sẽ tự đặt thẻ về đúng chỗ cũ trong lưới. Lớp phủ mang class "stc-root" để thừa hưởng đúng theme đang chọn. */
function stcToggleZoom(id) { STC_UI.zoom = STC_UI.zoom === id ? null : id; stcRerender(false); }
function stcZoomLayer() {
  let el = document.getElementById('stcZoomLayer');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'stcZoomLayer';
  el.className = 'stc-zoom-layer stc-root';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.addEventListener('click', (e) => { if (e.target === el) { STC_UI.zoom = null; stcRerender(false); } });
  document.body.appendChild(el);
  return el;
}
function stcRemoveZoomLayer() {
  const el = document.getElementById('stcZoomLayer');
  if (el && el.parentNode) el.parentNode.removeChild(el);
}
function stcApplyZoom(body) {
  if (!STC_UI.zoom) { stcRemoveZoomLayer(); return; }
  const card = body.querySelector('#stc-ind-' + STC_UI.zoom);
  if (!card) { STC_UI.zoom = null; stcRemoveZoomLayer(); return; }        // chỉ tiêu này không có ở màn hiện tại (vd. vừa đổi kỳ/nhóm)
  const layer = stcZoomLayer();
  layer.innerHTML = '';
  card.style.removeProperty('--stc-zoom');                                // đo ở tỉ lệ 1x trước, tính độ phóng sau
  layer.appendChild(card);
  /* Lấp vừa khung, không chừa khoảng trống thừa phía dưới: đo chiều cao nội dung thật ở tỉ lệ 1x rồi phóng theo
     chiều cao cho khít khung sẵn có (không tràn ngang); nội dung sẵn cao hơn khung thì giữ nguyên 1x, tự cuộn. */
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(() => {
      if (STC_UI.zoom == null || !layer.contains(card)) return;           // đã đóng/đổi thẻ trong lúc chờ đo
      const availW = layer.clientWidth - 32, availH = layer.clientHeight - 32;
      const natW = card.scrollWidth, natH = card.scrollHeight;
      if (natW > 0 && natH > 0 && availW > 0 && availH > 0) {
        const scale = Math.max(1, Math.min(availH / natH, availW / natW, 2.6));
        card.style.setProperty('--stc-zoom', scale.toFixed(3));
      }
    });
  }
}
function stcOpenForm(itemIndex, role) {
  if (role) STC_UI.role = role;
  /* itemIndex tra theo STC_ITEMS (thẻ 0 = Tổng quan, thẻ 1–4 = 4 nhóm), không dùng chỉ số thô để không lệch khi đổi thứ tự thẻ.
     Không chỉ định thẻ nào (vd. quay về từ luồng giao nhiệm vụ) → giữ nhóm đang xem gần nhất, không phải Tổng quan. */
  const it = typeof itemIndex === 'number' ? STC_ITEMS[itemIndex] : null;
  STC_UI.focus = null; STC_UI.dd = null; STC_UI.zoom = null;
  if (it && it.stcKey === 'home') {
    STC_UI.screen = 'home'; STC_UI.pick = null;
  } else {
    const key = it ? it.stcKey : STC_UI.group;
    const g = STC_GROUPS.find((x) => x.id === key) || STC_GROUPS[0];
    STC_UI.screen = 'group'; STC_UI.group = g.id; STC_UI.pick = null;
  }
  if (typeof SGD_UI !== 'undefined') SGD_UI.open = false;          // popup đang thuộc về form Sở Tài chính
  if (typeof HCC_UI !== 'undefined') HCC_UI.open = false;
  STC_UI.open = true; STC_UI.loading = true; STC_UI.error = false;
  stcRerender(true);                                  // mở popup ngay với khung chờ
  if (typeof openModal === 'function') openModal();
  /* lần dựng đầu popup còn ẩn: vẽ lại biểu đồ đường khi popup đã hiện */
  if (typeof lcFit === 'function') lcFit(document.getElementById('modalBody'));
  stcEnsureReady().then(() => { stcSettleSource(true); });
}
/* Sau khi nạp nguồn xong: bỏ khung chờ, báo lỗi nếu không có dữ liệu, chọn lại kỳ hợp lệ rồi vẽ. */
function stcSettleSource(resetScroll) {
  STC_UI.loading = false;
  STC_UI.error = !!STC_LOAD_ERR || !stcSnapshotObj();
  if (!STC_UI.error) {
    const latest = stcDefaultPeriod();
    if (!STC_UI.year || !stcHasPeriod(STC_UI.year, STC_UI.period)) { STC_UI.year = latest ? latest.year : new Date().getFullYear(); STC_UI.period = latest ? latest.period : 1; }
  }
  stcRerender(resetScroll);
  try { if (typeof renderIndicators === 'function') renderIndicators(); } catch (e) { /* lưới chỉ tiêu vẽ lại khi mở lần sau */ }
}
/* Nút "Tải lại" / "Thử lại": nạp lại tệp số liệu; giữ khung chờ tối thiểu 400 ms để không nhấp nháy. */
function stcReload() {
  if (STC_UI.loading) return;
  STC_UI.loading = true; STC_UI.error = false; STC_UI.dd = null;
  stcRerender(false);
  Promise.all([stcReloadSource(), new Promise((r) => setTimeout(r, 400))]).then(() => { stcSettleSource(false); });
}/* Nút "Xem dữ liệu mẫu": chuyển giữa số thật (bản chụp API) và số mẫu tự đặt; kỳ tự chọn lại theo nguồn. */
function stcToggleDemo() {
  stcSetDemo(!STC_DEMO_ON).then(() => {
    const list = stcPeriods();
    const pick = STC_DEMO_ON ? list.slice().reverse()[0] : list[0];
    if (pick) { STC_UI.year = pick.year; STC_UI.period = pick.period; }
    STC_UI.pick = null;
    stcRerender(false);
    try { if (typeof renderIndicators === 'function') renderIndicators(); } catch (e) { /* lưới chỉ tiêu vẽ lại khi mở lần sau */ }
  });
}
function stcClose() {
  STC_UI.open = false;
  STC_UI.zoom = null;
  stcRemoveZoomLayer();
  if (typeof closeModal === 'function') closeModal();
}
/* Esc đóng popup (IOC chưa có sẵn) — chỉ khi popup đang chứa form STC */
if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !STC_UI.open) return;
    const m = document.getElementById('modal');
    if (!(m && m.classList.contains('open') && m.querySelector('.stc-root'))) return;
    if (STC_UI.zoom) { STC_UI.zoom = null; stcRerender(false); return; }   // Esc đầu tiên chỉ thu nhỏ thẻ đang phóng to
    if (STC_UI.dd) { STC_UI.dd = null; stcRerender(false); return; }       // rồi mới đến đóng danh sách đang sổ
    stcClose();
  });
  /* bấm ra ngoài hộp chọn thì thu danh sách lại */
  document.addEventListener('click', (e) => {
    if (!STC_UI.dd || !STC_UI.open) return;
    if (e.target && e.target.closest && e.target.closest('.stc-dd')) return;
    STC_UI.dd = null;
    stcRerender(false);
  });
}function stcGo(screen, arg) {
  STC_UI.focus = null; STC_UI.dd = null; STC_UI.zoom = null;
  STC_UI.screen = screen;
  if (screen === 'group' && arg) STC_UI.group = arg;
  STC_UI.pick = null;
  stcRerender(true);
}
function stcDetail(indId) { STC_UI.focus = null; STC_UI.dd = null; STC_UI.zoom = null; STC_UI.screen = 'detail'; if (indId) STC_UI.ind = (stcRes() && stcRes().rootOf[indId] ? stcRes().rootOf[indId].id : indId); STC_UI.pick = null; stcRerender(true); }
function stcPick(id) { STC_UI.pick = STC_UI.pick === id ? null : id; stcRerender(false); }
function stcStep(d) {
  const at = STC_INDICATORS.findIndex((i) => i.id === STC_UI.ind);
  STC_UI.ind = STC_INDICATORS[(at + d + STC_INDICATORS.length) % STC_INDICATORS.length].id;
  STC_UI.pick = null;
  stcRerender(true);
}
function stcSetYear(v) {
  STC_UI.dd = null;
  STC_UI.year = Number(v);
  const same = stcHasPeriod(STC_UI.year, STC_UI.period);
  if (!same) { const p = [1, 2, 3, 4].filter((q) => stcHasPeriod(STC_UI.year, q)).pop(); if (p) STC_UI.period = p; }
  STC_UI.pick = null;
  stcRerender(false);
}
function stcSetPeriod(v) { STC_UI.dd = null; STC_UI.period = Number(v); STC_UI.pick = null; stcRerender(false); }

/* ---------- Xuất Excel ---------- */
async function stcExport() {
  const res = stcRes();
  if (!res) { if (typeof toast === 'function') toast('Chưa có bản chụp cho kỳ này để xuất.'); return; }
  if (typeof ExcelJS === 'undefined') { if (typeof toast === 'function') toast('Thư viện xuất Excel chưa tải xong, thử lại sau giây lát.'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Chỉ tiêu');
  const note = 'Sở Tài chính Hà Nội · ' + stcQ(res.year, res.period) + ' · số liệu chụp lúc ' + stcStampText(res.importedAt) + (res.demo ? ' · DỮ LIỆU MẪU, KHÔNG PHẢI SỐ LIỆU THẬT' : '');
  ws.addRow([note]).font = { italic: true };
  ws.addRow([STC_ASSUME.unitNote]).font = { italic: true };
  ws.addRow([]);
  const pq = stcPrevQ(res.year, res.period);
  ws.addRow(['Nhóm', 'Chỉ tiêu', 'Thành phần', 'Kỳ này (' + stcQ(res.year, res.period) + ')', 'Kỳ trước (' + stcQ(pq.year, pq.period) + ')', 'So kỳ trước', 'Cùng kỳ năm trước (' + stcQ(res.year - 1, res.period) + ')', 'So cùng kỳ', 'Đơn vị', 'Trạng thái', 'Mã API']).font = { bold: true };
  const num = (v) => (v == null ? null : v);
  /* Mức thay đổi ghi kèm đơn vị: "%" hoặc "điểm %" / "điểm" để không nhầm */
  const dv = (n, which) => { const v = which === 'kq' ? stcDeltaKq(n) : stcDeltaCq(n); if (v == null) return null; const u = stcDeltaUnit(n, which); return stcSgn(v, 1) + (u === '%' ? '%' : ' ' + u); };
  const row = (g, ind, label, n, st, api) => {
    const ok = ind.state === 'ok';
    ws.addRow([g.label, ind.label, label, ok ? num(n.now) : null, ok ? num(n.kq) : null, ok ? dv(n, 'kq') : null, ok && n.kind !== 'idx' ? num(stcPrev(n)) : null, ok ? dv(n, 'cq') : null, ind.unit, st, api]);
  };
  res.groups.forEach((g) => g.inds.forEach((ind) => {
    const st = ind.state === 'ok' ? 'Có số' : ind.state === 'nodata' ? 'Chưa có số liệu' : 'Không nhận diện được';
    row(g, ind, '(tổng)', ind, st, ind.apis.join(' + '));
    const add = (n, depth) => (n.kids || []).forEach((k) => {
      row(g, ind, '   '.repeat(depth) + k.label, k, st, k.api || ind.apis[0]);
      add(k, depth + 1);
    });
    add(ind, 1);
  }));
  ws.columns = [{ width: 26 }, { width: 46 }, { width: 46 }, { width: 16 }, { width: 16 }, { width: 14 }, { width: 22 }, { width: 14 }, { width: 14 }, { width: 22 }, { width: 30 }];
  const raw = wb.addWorksheet('Số liệu gốc API');
  raw.addRow(['Mã API', 'chiTieu', 'loai', 'giaTri', 'quy']).font = { bold: true };
  const snap = stcSnapshotObj().periods[res.year + '-' + res.period].data;
  Object.keys(snap).forEach((code) => snap[code].forEach((r) => raw.addRow([code, r.chiTieu, r.loai, r.giaTri, r.quy])));
  raw.columns = [{ width: 28 }, { width: 60 }, { width: 44 }, { width: 14 }, { width: 12 }];
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'so-tai-chinh-Q' + res.period + '-' + res.year + (res.demo ? '-DU-LIEU-MAU' : '') + '.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- Thẻ xem trước ở lưới chỉ tiêu (indicators.js gọi qua catItemPreviewBody) ----------
   Mỗi thẻ = một NHÓM (một popup): liệt kê gọn các chỉ tiêu của nhóm với số chính và mức tăng giảm. */
function stcDefaultPeriod() { return STC_DEMO_ON ? stcPeriods().slice().reverse()[0] : stcLatestPeriod(); }
/* Biểu đồ nhỏ dưới mỗi dòng ở thẻ xem trước (thẻ nằm ngoài .stc-root nên dùng màu trực tiếp, không dùng biến CSS). */
const STC_MINI_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181'];
const STC_MINI_TRACK = 'rgba(127,150,180,.30)';
function stcMiniViz(ind) {
  if (ind.state !== 'ok') return '';
  const h = 'height:4px;border-radius:3px;margin:3px 0 1px;';
  const seg = (w, c, gap) => '<i style="display:block;flex:' + Math.max(w, 0.5) + ' 1 0;background:' + c + ';border-radius:3px;' + (gap ? 'margin-left:2px' : '') + '"></i>';
  if (ind.id === 'da') {   // mỗi nhóm dự án một thanh nhỏ, độ đầy = % hoàn thành của chính nhóm đó (không tính trung bình)
    return '<div style="display:flex;gap:3px;margin:3px 0 1px">' + ind.kids.map((k) => '<span style="flex:1 1 0;height:4px;border-radius:3px;background:' + STC_MINI_TRACK + ';overflow:hidden"><i style="display:block;height:100%;width:' + Math.max(0, Math.min(100, k.now || 0)) + '%;background:#3987e5"></i></span>').join('') + '</div>';
  }
  if (ind.id === 'xnk') {
    const x = ind.kids[0].now, n = ind.kids[1].now, m = Math.max(x, n, 1);
    const bar = (v, c) => '<span style="display:block;height:3px;border-radius:3px;background:' + STC_MINI_TRACK + ';margin:2px 0"><i style="display:block;height:100%;width:' + (v / m * 100) + '%;background:' + c + ';border-radius:3px"></i></span>';
    return '<div style="margin:3px 0 1px">' + bar(x, '#3987e5') + bar(n, '#d95926') + '</div>';
  }
  if (ind.kind === 'idx' || ind.id === 'gia') {   // thang 0–200, vạch mốc 100
    const v = ind.id === 'gia' ? ind.kids[0].now : ind.now;
    if (v == null) return '';
    const p = Math.max(0, Math.min(100, v / 200 * 100));
    return '<div style="position:relative;' + h + 'background:' + STC_MINI_TRACK + '"><i style="position:absolute;left:50%;top:-2px;width:1px;height:8px;background:rgba(127,150,180,.9)"></i><i style="position:absolute;left:calc(' + p + '% - 4px);top:-2px;width:8px;height:8px;border-radius:50%;background:#3987e5"></i></div>';
  }
  const kids = ind.kids.filter((k) => k.now > 0);
  if (kids.length >= 2) return '<div style="display:flex;' + h + '">' + kids.map((k, i) => seg(k.now, STC_MINI_COLORS[i % 5], i)).join('') + '</div>';
  return '';
}
function stcPreviewLine(ind) {
  const nm = STC_SHORT[ind.id] || ind.label;
  let val = '—', dl = '';
  if (ind.state === 'ok') {
    if (ind.id === 'da') val = ind.kids.length + ' nhóm';
    else if (ind.id === 'xnk') { const b = ind.kids[0].now - ind.kids[1].now; val = stcSgn(b, 0) + ' <span style="opacity:.7;font-weight:500;font-size:10.5px">triệu USD</span>'; }
    else if (ind.id === 'gia') val = stcFmt(ind.kids[0].now, 1) + ' <span style="opacity:.7;font-weight:500;font-size:10.5px">%</span>';
    else val = stcVal(ind) + ' <span style="opacity:.7;font-weight:500;font-size:10.5px">' + stcE(ind.kind === 'idx' ? '%' : ind.unit) + '</span>';
    /* Hai dòng nhỏ: so kỳ trước, so cùng kỳ (có chú thích khi rê chuột) */
    const one = (which, ref) => {
      const y = which === 'kq' ? stcDeltaKq(ind) : stcDeltaCq(ind), u = stcDeltaUnit(ind, which);
      const t = y == null ? '—' : (y > 0.0499 ? '▲ ' : y < -0.0499 ? '▼ ' : '') + stcFmt(Math.abs(y), 1) + (u === '%' ? '%' : ' ' + u);
      return '<span style="display:block;cursor:help" title="' + stcE(stcDlTip(ind, which, y)) + '">' + t + ' <span style="opacity:.65;font-size:10px">' + ref + '</span></span>';
    };
    if (['da', 'xnk', 'gia'].indexOf(ind.id) < 0 && (stcDeltaKq(ind) != null || stcDeltaCq(ind) != null)) dl = one('kq', 'kỳ trước') + one('cq', 'cùng kỳ');
  }
  return '<div style="font-size:12px;padding:4px 0 3px;border-top:1px solid rgba(87,178,255,.14)"><div style="display:grid;grid-template-columns:minmax(0,1fr) auto 104px;gap:8px;align-items:baseline"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9">' + stcE(nm) + '</span><b style="font-variant-numeric:tabular-nums;white-space:nowrap">' + val + '</b><span style="text-align:right;opacity:.85;font-size:11px;white-space:nowrap">' + dl + '</span></div>' + stcMiniViz(ind) + '</div>';
}

/* ===== js/features/sgd-data.js ===== */
/* ============================== SỞ GD&ĐT — LỚP DỮ LIỆU (SỐ GIẢ LẬP) ==============================
   API Sở GD&ĐT (api/API_SGDDT) mới có schema, chưa có bản ghi thật, nên lớp này SINH SỐ GIẢ LẬP có cấu trúc đúng như
   API sẽ trả: số theo từng phường/xã (MA_XA) cho 2 năm học, và theo từng trường khi mở hồ sơ một phường/xã.
   - Tổng Thành phố lấy từ SGD_TARGETS (sgd-config.js), chia cho 126 phường/xã theo quy mô của file "SỐ LIỆU TRƯỜNG
     HỌC" 07/2026 (gdUnitData, dashboard-education.js) có cộng nhiễu ngẫu nhiên CỐ ĐỊNH (seed) → lần nào mở cũng ra
     cùng số. Số con không vượt số cha (trường đạt chuẩn ≤ số trường, học sinh cận thị ≤ học sinh...).
   - Mọi con số ở cấp Thành phố đều là TỔNG CỘNG DỒN từ 126 phường/xã (giống khi có API thật) nên luôn khớp nhau.
   Khi có API thật: thay sgdBuild() bằng hàm gộp bản ghi API theo MA_XA, giữ nguyên cấu trúc {name,isXa,v:{năm:{trường}}}. */

const SGD_FIELDS = Object.keys(SGD_TARGETS);

function sgdRng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Chia tổng theo trọng số (phần dư lớn nhất), có trần cho từng phần tử và mức tối thiểu. Tổng luôn giữ đúng. */
function sgdAlloc(total, w, cap, min) {
  const n = w.length;
  const sw = w.reduce((a, b) => a + b, 0) || 1;
  const raw = w.map((x) => (x / sw) * total);
  const out = raw.map((x) => Math.floor(x));
  const rem = total - out.reduce((a, b) => a + b, 0);
  const ord = raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]);
  for (let k = 0; k < rem; k++) out[ord[k % n][1]]++;
  if (min) {
    for (let i = 0; i < n; i++) {
      while (out[i] < min) {
        let mx = 0;
        for (let j = 1; j < n; j++) if (out[j] > out[mx]) mx = j;
        if (out[mx] <= min) break;
        out[mx]--; out[i]++;
      }
    }
  }
  if (cap) {
    let ex = 0;
    for (let i = 0; i < n; i++) if (out[i] > cap[i]) { ex += out[i] - cap[i]; out[i] = cap[i]; }
    let guard = 0;
    while (ex > 0 && guard < 100000) {
      let best = -1, bv = -1;
      for (let i = 0; i < n; i++) {
        if (cap[i] - out[i] > 0) { const s = w[i] / (out[i] + 1); if (s > bv) { bv = s; best = i; } }
      }
      if (best < 0) break;
      const add = Math.min(ex, cap[best] - out[best], Math.max(1, Math.floor(ex / 8)));
      out[best] += add; ex -= add; guard++;
    }
  }
  return out;
}

let SGD_CACHE = null;
/* Danh sách đơn vị + trọng số quy mô. Dùng gdUnitData (126 phường/xã, file txt 07/2026) nếu có. */
function sgdBaseUnits() {
  if (typeof gdUnitData !== 'undefined' && Array.isArray(gdUnitData) && gdUnitData.length) return gdUnitData;
  const out = [];
  for (let i = 0; i < 126; i++) out.push(['Đơn vị ' + (i + 1), 20, 12, 12000, 320, 280, 1200, 60, 900, 4000, 3000, 150]);
  return out;
}
function sgdBuild() {
  if (SGD_CACHE) return SGD_CACHE;
  const U = sgdBaseUnits();
  const [Y0, Y1] = SGD_YEARS;                // năm học hiện tại, năm học trước
  const g = sgdRng(20260926);
  const R = U.map((u, i) => ({ name: u[0], isXa: /^Xã/.test(u[0]), u: u, rg: sgdRng(i * 7919 + 13), v: { [Y0]: {}, [Y1]: {} } }));
  const nz = (r, a, b) => (a == null ? 0.75 : a) + (b == null ? 0.5 : b) * r.rg();
  const gen = (key, wf, capf, min) => {
    const t = SGD_TARGETS[key];
    const w = R.map((r) => Math.max(wf(r), 0.0001));
    sgdAlloc(t[0], w, capf ? R.map((r) => capf(r.v[Y0])) : null, min).forEach((v, i) => { R[i].v[Y0][key] = v; });
    if (t[1] == null) { R.forEach((r) => { r.v[Y1][key] = null; }); return; }
    const w2 = w.map((x) => x * (0.95 + 0.1 * g()));
    sgdAlloc(t[1], w2, capf ? R.map((r) => capf(r.v[Y1])) : null, min).forEach((v, i) => { R[i].v[Y1][key] = v; });
  };
  /* Chia một trường "cha" của từng đơn vị ra nhiều khối, giữ đúng tổng cha của từng đơn vị VÀ tổng Thành phố của từng khối */
  const split = (parent, keys) => {
    [Y0, Y1].forEach((y, yi) => {
      const left = R.map((r) => r.v[y][parent]);
      keys.forEach((k, ki) => {
        if (ki === keys.length - 1) { R.forEach((r, i) => { r.v[y][k] = left[i]; }); return; }
        const vals = sgdAlloc(SGD_TARGETS[k][yi], R.map((r, i) => left[i] * (0.9 + 0.2 * r.rg()) + 0.001), left.slice());
        vals.forEach((v, i) => { R[i].v[y][k] = v; left[i] -= v; });
      });
    });
  };
  const nowOf = (r, k) => r.v[Y0][k];
  const trOf = (o) => o.tr_mn + o.tr_th + o.tr_cs + o.tr_pt + o.tr_tx;
  const hsOf = (o) => o.hs_th + o.hs_cs;
  const lopOf = (r) => nowOf(r, 'lop_th') + nowOf(r, 'lop_cs');
  const cqRate = (r) => 0.35 + 0.5 * Math.min(1, Math.max(0.15, r.u[2] / r.u[1]));

  gen('tr_mn', (r) => r.u[1] * 0.4 * nz(r), null, 1);
  gen('tr_th', (r) => r.u[1] * 0.28 * nz(r), null, 1);
  gen('tr_cs', (r) => r.u[1] * 0.22 * nz(r), null, 1);
  gen('tr_pt', (r) => r.u[1] * (r.isXa ? 0.07 : 0.1) * nz(r, 0.3, 1.2));
  gen('tr_tx', (r) => r.u[1] * 0.03 * (r.rg() < 0.45 ? 0.15 : 1));
  ['mn', 'th', 'cs', 'pt', 'tx'].forEach((c) => gen('cq_' + c, (r) => nowOf(r, 'tr_' + c) * cqRate(r) * nz(r), (o) => o['tr_' + c]));
  gen('ncl', (r) => trOf(r.v[Y0]) * (r.isXa ? 0.25 : 0.55) * nz(r), trOf);
  gen('qt', (r) => nowOf(r, 'ncl') * (r.isXa ? 0.2 : 1.4) * Math.pow(r.rg(), 2), (o) => o.ncl);

/* ---------- Tiện ích ---------- */
function sgdE(s) { return typeof esc === 'function' ? esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function sgdFmt(n, d) {
  if (n == null || !isFinite(n)) return '—';
  d = d || 0;
  const p = Math.abs(n).toFixed(d).split('.');
  return (n < 0 && Math.abs(n) >= Math.pow(10, -d) / 2 ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : '');
}
function sgdSgn(n, d) { return n == null ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '') + sgdFmt(Math.abs(n), d); }
function sgdDiv(a, b, m) { return a == null || b == null || !b ? null : (a / b) * (m == null ? 100 : m); }
function sgdLnk(label, act) { return '<button type="button" class="stc-lnk" onclick="' + act + '">' + sgdE(label) + '</button>'; }
function sgdNote(html) { return '<div class="stc-note">' + SGD_ICON_INFO + '<div>' + html + '</div></div>'; }
function sgdEmpty(title, text) { return '<div class="stc-empty">' + SGD_ICON_DB + '<b>' + sgdE(title) + '</b><span style="font-size:12px;max-width:420px">' + sgdE(text) + '</span></div>'; }
let SGD_CITY = {};
function sgdCityY(y) { if (y == null) return null; if (!SGD_CITY[y]) SGD_CITY[y] = sgdCity(y); return SGD_CITY[y]; }
function sgdNP() { const y = SGD_UI.year, py = sgdPrevYear(y); return { y: y, py: py, C: sgdCityY(y), P: py != null ? sgdCityY(py) : null }; }

/* Chú thích khi rê chuột vào mũi tên tăng/giảm (thuộc tính title). kind: 'rate' = điểm %, 'abs' = chênh lệch số thường,
   'rel' = % so với chính nó. better: 'high' tăng là tốt, 'low' giảm là tốt, 'none' trung tính. now/prev/d (tuỳ chọn): ghi kèm ví dụ số. */
function sgdDlTip(kind, better, now, prev, d, cmpTP) {
  const L = [];
  const fm = (x) => (kind === 'rate' ? sgdFmt(x, 1) + '%' : sgdFmt(x, kind === 'abs' ? d : Number.isInteger(x) ? 0 : 1));
  const was = cmpTP ? 'Mức Thành phố' : 'Năm học trước', is = cmpTP ? 'đơn vị này' : 'năm nay';
  if (kind === 'rate') L.push('Đơn vị "điểm %" (điểm phần trăm): lấy tỷ lệ ' + is + ' TRỪ thẳng ' + (cmpTP ? 'tỷ lệ của Thành phố' : 'tỷ lệ năm học trước') + '.');
  else if (kind === 'abs') L.push('Chênh lệch trực tiếp: số ' + is + ' trừ ' + (cmpTP ? 'mức Thành phố' : 'số năm học trước') + '.');
  else L.push('Tăng/giảm bao nhiêu % so với chính nó năm học trước: (năm nay ÷ năm trước − 1) × 100.');
  if (now != null && prev != null) {
    const v = kind === 'rel' ? (prev ? (now / prev - 1) * 100 : null) : now - prev;
    if (v != null) {
      const dd = kind === 'abs' ? d : 1, unit = kind === 'rate' ? ' điểm %' : kind === 'rel' ? '%' : '';
      const r = Math.round(v * Math.pow(10, dd)) / Math.pow(10, dd);
      L.push(was + ' ' + fm(prev) + ' → ' + is + ' ' + fm(now) + ': ' + (r === 0 ? 'không đổi' : (r > 0 ? (cmpTP ? 'cao hơn ' : 'tăng ') : (cmpTP ? 'thấp hơn ' : 'giảm ')) + sgdFmt(Math.abs(v), dd) + unit) + '.');
    }
  }
  if (kind === 'rate') L.push('Ví dụ: 24,1% lên 24,9% là tăng 0,8 điểm %, không phải tăng 0,8%.');
  if (!cmpTP) L.push(better === 'low' ? 'Chỉ tiêu này giảm là tốt: tăng tô đỏ, giảm tô xanh.' : better === 'none' ? 'Tăng hay giảm không tự thân tốt/xấu nên tô màu trung tính.' : 'Chỉ tiêu này tăng là tốt: tăng tô xanh, giảm tô đỏ.');
  return L.join('\n');
}
/* Mũi tên tăng/giảm. o.rate: chênh lệch tuyệt đối (điểm %), o.abs: chênh lệch số thường (không ghi "điểm"),
   o.inv: giảm là tốt, o.neutral: tăng/giảm không tự thân tốt/xấu (màu trung tính). */
function sgdDl(now, prev, o) {
  o = o || {};
  if (now == null || prev == null) return '';
  const v = o.rate || o.abs ? now - prev : (prev ? (now / prev - 1) * 100 : null);
  if (v == null) return '';
  const d = o.d != null ? o.d : 1;
  const r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d);
  let cls = r > 0 ? 'up' : r < 0 ? 'down' : 'flat';
  if (cls !== 'flat') { if (o.inv) cls += r > 0 ? ' bad' : ' good'; else if (o.neutral) cls += ' n'; }
  const txt = cls === 'flat' ? 'Không đổi' : sgdFmt(Math.abs(v), d) + (o.abs ? '' : o.rate ? ' điểm %' : '%');
  const tip = sgdDlTip(o.rate ? 'rate' : o.abs ? 'abs' : 'rel', o.inv ? 'low' : o.neutral ? 'none' : 'high', now, prev, d);
  return '<span class="stc-dl ' + cls + '" title="' + sgdE(tip) + '" style="cursor:help">' + txt + (o.ref ? ' <span class="stc-ref">' + sgdE(o.ref) + '</span>' : '') + '</span>';
}
function sgdLegend(y, py) {
  return '<div class="stc-lg"><span><i style="background:var(--s1)"></i>' + sgdYearLabel(y) + '</span>' + (py != null ? '<span><i style="background:var(--prev)"></i>' + sgdYearLabel(py) + '</span>' : '') + '</div>';
}
function sgdBig(v, unit, dl) { return '<div class="stc-bigrow"><div class="stc-big">' + v + (unit ? '<small>' + sgdE(unit) + '</small>' : '') + '</div>' + (dl || '') + '</div>'; }
function sgdCmp(label, now, prev, mx, dl, first) {
  const w = (v) => (v > 0 ? Math.max(0.2, (v / (mx || 1)) * 100) : 0);
  return '<div class="stc-cmp"' + (first ? ' style="margin-top:8px"' : '') + '><div class="stc-nm">' + sgdE(label) + '</div><div class="stc-bars">' +
    '<div class="stc-br"><div class="stc-tr"><div class="stc-b" style="width:' + w(now).toFixed(2) + '%"></div></div><div class="stc-val">' + sgdFmt(now) + '</div></div>' +
    (prev != null ? '<div class="stc-br"><div class="stc-tr"><div class="stc-b p" style="width:' + w(prev).toFixed(2) + '%"></div></div><div class="stc-val p">' + sgdFmt(prev) + '</div></div>' : '') +
    '</div>' + (dl || '<span class="stc-dl flat">—</span>') + '</div>';
}
function sgdPg(label, small, pct, mark, color) {
  const w = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return '<div class="stc-pg"><div class="stc-row"><span class="stc-nm">' + sgdE(label) + (small ? '<small>' + sgdE(small) + '</small>' : '') + '</span><span class="stc-pv">' + (pct == null ? '—' : sgdFmt(pct, 1) + '%') + '</span></div><div class="stc-trk"><div class="stc-fill" style="width:' + w.toFixed(2) + '%' + (color ? ';background:' + color : '') + '"></div>' + (mark != null ? '<i class="sgd-mark" style="left:' + Math.max(0, Math.min(100, mark)).toFixed(2) + '%"></i>' : '') + '</div></div>';
}
function sgdDonut(items, total, center, unit, label) {
  const C = 2 * Math.PI * 54;
  let cum = 0, segs = '';
  items.forEach((it) => {
    if (!(it.v > 0) || !(total > 0)) return;
    const len = (it.v / total) * C;
    segs += '<circle class="stc-seg" cx="80" cy="80" r="54" stroke="' + it.c + '" stroke-dasharray="' + Math.max(0.6, len - 2.5).toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="' + (-cum).toFixed(1) + '"/>';
    cum += len;
  });
  const fs = center.length > 8 ? 14 : center.length > 6 ? 17 : 21;
  return '<svg viewBox="0 0 160 160" role="img" aria-label="' + sgdE(label) + '"><circle class="stc-trk" cx="80" cy="80" r="54"/><g transform="rotate(-90 80 80)">' + segs + '</g><text class="stc-tv" x="80" y="80" text-anchor="middle" style="font-size:' + fs + 'px">' + sgdE(center) + '</text><text class="stc-tu" x="80" y="96" text-anchor="middle">' + sgdE(unit) + '</text></svg>';
}

/* ---------- Khung chung: đầu màn, thẻ, chân màn ---------- */
function sgdDd(id, label, cur, opts, handler) {
  const open = SGD_UI.dd === id;
  const cv = opts.find((o) => String(o.v) === String(cur));
  const list = open ? '<div class="stc-ddl" role="listbox" aria-label="' + sgdE(label) + '">' + opts.map((o) => {
    const on = String(o.v) === String(cur);
    return '<button type="button" role="option" aria-selected="' + on + '" class="stc-ddo' + (on ? ' on' : '') + '" onclick="' + handler + '(' + o.v + ')"><span>' + sgdE(o.text) + '</span>' + (on ? '<i>✓</i>' : '') + '</button>';
  }).join('') + '</div>' : '';
  return '<div class="stc-dd' + (open ? ' open' : '') + '"><button type="button" class="stc-ddb" aria-haspopup="listbox" aria-expanded="' + open + '" onclick="sgdDdToggle(\'' + id + '\')"><small>' + sgdE(label) + '</small><b>' + sgdE(cv ? cv.text : '—') + '</b><span class="stc-ddc"></span></button>' + list + '</div>';
}
function sgdHeader(back) {

/* ---------- Dựng màn + điều khiển ---------- */
function sgdScreenHtml() {
  if (SGD_UI.screen === 'group') return sgdScreenGroup();
  if (SGD_UI.screen === 'detail') return sgdScreenDetail();
  if (SGD_UI.screen === 'xa') return sgdScreenXa();
  if (SGD_UI.screen === 'src') return sgdScreenSrc();
  return sgdScreenHome();
}
function sgdScreenMeta() {
  const base = 'Sở Giáo dục và Đào tạo';
  if (SGD_UI.screen === 'group') { const gi = Math.max(0, SGD_GROUPS.findIndex((g) => g.id === SGD_UI.group)); return { title: base + ' — ' + SGD_GROUPS[gi].label, sub: 'Nhóm ' + (gi + 1) + '/' + SGD_GROUPS.length + ' · năm học ' + sgdYearLabel(SGD_UI.year) }; }
  if (SGD_UI.screen === 'detail') { const t = SGD_TREE.find((x) => x.id === SGD_UI.tree); return { title: base + ' — Chi tiết chỉ tiêu', sub: t ? t.label : '' }; }
  if (SGD_UI.screen === 'xa') { const t = SGD_XA_INDS.find((x) => x.id === SGD_UI.xa.ind); return { title: base + ' — Chỉ tiêu theo 126 phường/xã', sub: (t ? t.label + ' · ' : '') + 'năm học ' + sgdYearLabel(SGD_UI.year) }; }
  if (SGD_UI.screen === 'src') return { title: base + ' — Nguồn dữ liệu và giả định', sub: '18 API Sở GD&ĐT (hiện chỉ có schema)' };
  return { title: base + ' — Bộ chỉ tiêu giáo dục Thủ đô', sub: 'Tổng hợp từ dữ liệu từng trường, cộng dồn lên 126 phường/xã và toàn Thành phố' };
}
function sgdTasksHtml() {
  if (typeof fieldScenarioSummary !== 'function') return '';
  try { return '<div class="stc-tasks" style="margin-top:18px">' + fieldScenarioSummary('cat::' + (SGD_UI.role || (typeof currentRole !== 'undefined' ? currentRole : 'UBND')) + '::ubnd-gddt') + '</div>'; } catch (e) { return ''; }
}
function sgdRerender(resetScroll) {
  const body = document.getElementById('modalBody'), title = document.getElementById('modalTitle'), sub = document.getElementById('modalSub');
  if (!body || !SGD_UI.open) return;
  const top = body.scrollTop, meta = sgdScreenMeta();
  if (title) title.textContent = meta.title;
  if (sub) sub.textContent = 'DỮ LIỆU GIẢ LẬP · ' + meta.sub;
  let html;
  try { html = sgdScreenHtml(); } catch (e) { console.error(e); html = sgdEmpty('Không dựng được màn hình', 'Có lỗi khi tính số liệu giả lập: ' + (e && e.message ? e.message : e)); }
  body.innerHTML = '<div class="stc-root sgd-root stc-wrap">' + html + '</div>' + sgdTasksHtml();
  if (typeof lcFit === 'function') lcFit(body);
  body.scrollTop = resetScroll ? 0 : top;
  if (SGD_UI.focusQ) {
    const inp = body.querySelector('#sgdQ');
    if (inp) { inp.focus(); const L = inp.value.length; try { inp.setSelectionRange(L, L); } catch (e) { /* bỏ qua */ } }
    SGD_UI.focusQ = false;
  }
}
function sgdOpenForm(itemIndex, role) {
  if (role) SGD_UI.role = role;
  const it = typeof itemIndex === 'number' ? SGD_ITEMS[itemIndex] : null;
  const key = it ? it.sgdKey : 'home';
  SGD_UI.dd = null; SGD_UI.pick = null; SGD_UI.xa.sel = null;
  if (key === 'xa') SGD_UI.screen = 'xa';
  else if (SGD_GROUPS.some((g) => g.id === key)) { SGD_UI.screen = 'group'; SGD_UI.group = key; }
  else SGD_UI.screen = 'home';
  if (typeof STC_UI !== 'undefined') STC_UI.open = false;          // popup đang thuộc về form Sở GD&ĐT
  if (typeof HCC_UI !== 'undefined') HCC_UI.open = false;
  SGD_UI.open = true;
  sgdRerender(true);
  if (typeof openModal === 'function') openModal();
  /* lần dựng đầu popup còn ẩn: vẽ lại biểu đồ đường khi popup đã hiện */
  if (typeof lcFit === 'function') lcFit(document.getElementById('modalBody'));
}
function sgdClose() { SGD_UI.open = false; if (typeof closeModal === 'function') closeModal(); }
function sgdGo(screen, arg) { SGD_UI.dd = null; SGD_UI.pick = null; SGD_UI.screen = screen; if (screen === 'group' && arg) SGD_UI.group = arg; sgdRerender(true); }
function sgdDetail(id) { SGD_UI.dd = null; SGD_UI.pick = null; SGD_UI.screen = 'detail'; if (id) SGD_UI.tree = id; sgdRerender(true); }
function sgdPick(id) { SGD_UI.pick = SGD_UI.pick === id ? null : id; sgdRerender(false); }
function sgdStep(d) { const at = SGD_TREE.findIndex((t) => t.id === SGD_UI.tree); SGD_UI.tree = SGD_TREE[(at + d + SGD_TREE.length) % SGD_TREE.length].id; SGD_UI.pick = null; sgdRerender(true); }
function sgdXa(ind) { SGD_UI.dd = null; SGD_UI.screen = 'xa'; SGD_UI.xa.sel = null; if (ind) sgdXaSetInd(ind); sgdRerender(true); }
function sgdXaSetInd(ind) { const x = SGD_XA_INDS.find((i) => i.id === ind); if (!x) return; SGD_UI.xa.ind = ind; SGD_UI.xa.sk = 'v'; SGD_UI.xa.sd = x.better === 'low' ? 1 : -1; }
function sgdXaInd(ind) { sgdXaSetInd(ind); sgdRerender(false); }
function sgdXaF(f) { SGD_UI.xa.f = f; sgdRerender(false); }
function sgdXaQ(v) { SGD_UI.xa.q = v; SGD_UI.focusQ = true; sgdRerender(false); }
function sgdXaSel(name) { const X = SGD_UI.xa; X.anim = !!name && !X.sel; X.sel = name || null; sgdRerender(false); }
function sgdXaStep(d) { const X = SGD_UI.xa, at = X.order.indexOf(X.sel); if (at < 0 || !X.order[at + d]) return; X.sel = X.order[at + d]; sgdRerender(false); }
function sgdXaSort(k) { const X = SGD_UI.xa; X.sd = X.sk === k ? -X.sd : (k === 'name' ? 1 : -1); X.sk = k; sgdRerender(false); }
function sgdDdToggle(id) { SGD_UI.dd = SGD_UI.dd === id ? null : id; sgdRerender(false); }
function sgdSetYear(y) { SGD_UI.dd = null; SGD_UI.year = Number(y); SGD_UI.pick = null; sgdRerender(false); }
if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !SGD_UI.open) return;
    const m = document.getElementById('modal');
    if (!(m && m.classList.contains('open') && m.querySelector('.sgd-root'))) return;
    if (SGD_UI.dd) { SGD_UI.dd = null; sgdRerender(false); return; }
    if (SGD_XA_DRAWER && SGD_UI.screen === 'xa' && SGD_UI.xa.sel) { sgdXaSel(null); return; }   // Esc đóng khung hồ sơ trước
    sgdClose();
  });
  document.addEventListener('click', (e) => {
    if (!SGD_UI.dd || !SGD_UI.open) return;
    if (e.target && e.target.closest && e.target.closest('.sgd-root .stc-dd')) return;
    SGD_UI.dd = null;
    sgdRerender(false);
  });
}

/* ---------- Xuất Excel ---------- */
async function sgdExport() {
  if (typeof ExcelJS === 'undefined') { if (typeof toast === 'function') toast('Thư viện xuất Excel chưa tải xong, thử lại sau giây lát.'); return; }
  const n = sgdNP();
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Chỉ tiêu Thành phố');
  ws.addRow(['Sở Giáo dục và Đào tạo Hà Nội · năm học ' + sgdYearLabel(n.y) + ' · DỮ LIỆU GIẢ LẬP, KHÔNG PHẢI SỐ LIỆU THẬT']).font = { italic: true };
  ws.addRow([]);
  ws.addRow(['Nhóm', 'Chỉ tiêu', 'Thành phần', 'Năm học ' + sgdYearLabel(n.y), n.py != null ? 'Năm học ' + sgdYearLabel(n.py) : 'Năm trước', 'So năm trước', 'Đơn vị']).font = { bold: true };
  SGD_TREE.forEach((spec) => {
    const g = SGD_GROUPS.find((x) => x.id === spec.group), T = sgdEvalTree(spec, n.C, n.P);
    const add = (x, depth) => {
      const rate = sgdIsRate(x);
      const d = x.now == null || x.prev == null ? null : rate ? Math.round((x.now - x.prev) * 10) / 10 : (x.prev ? Math.round((x.now / x.prev - 1) * 1000) / 10 : null);
      ws.addRow([g ? g.label : '', spec.label, depth ? '   '.repeat(depth - 1) + x.label : '(tổng)', x.now == null ? null : rate ? Math.round(x.now * 10) / 10 : x.now, x.prev == null ? null : rate ? Math.round(x.prev * 10) / 10 : x.prev, d == null ? null : d + (rate ? ' điểm %' : '%'), rate ? '%' : spec.unit]);
      (x.kids || []).forEach((k) => add(k, depth + 1));
    };
    add(T, 0);
  });
  ws.columns = [{ width: 26 }, { width: 32 }, { width: 30 }, { width: 18 }, { width: 18 }, { width: 14 }, { width: 12 }];
  const wx = wb.addWorksheet('126 phường-xã');
  wx.addRow(['Phường/xã', 'Loại'].concat(SGD_XA_INDS.map((x) => x.label + (x.pct ? ' (%)' : '')))).font = { bold: true };
  sgdUnits().forEach((r) => {
    const o = r.v[n.y];
    wx.addRow([r.name, r.isXa ? 'Xã' : 'Phường'].concat(SGD_XA_INDS.map((x) => {
      const v = x.type === 'count' ? x.parts.reduce((a, c) => a + (c.f(o) || 0), 0) : sgdDiv(x.num(o), x.den(o), x.m);
      return v == null ? null : Math.round(v * 100) / 100;
    })));
  });
  wx.columns = [{ width: 32 }, { width: 8 }].concat(SGD_XA_INDS.map(() => ({ width: 16 })));
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'so-gddt-nam-hoc-' + n.y + '-' + (n.y + 1) + '-DU-LIEU-GIA-LAP.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ===== js/features/hcc-data.js ===== */
/* ============================== TRUNG TÂM PHỤC VỤ HCC — LỚP DỮ LIỆU (SỐ GIẢ LẬP) ==============================
   API hcc_tkpro (api/API_HCC) mới có schema, chưa có bản ghi thật, nên lớp này SINH SỐ GIẢ LẬP có cấu trúc đúng như API
   sẽ trả: số theo từng đơn vị lá của cây đơn vị (các sở/ngành trong HCC_SO + 126 phường/xã) cho 6 quý, số theo lĩnh vực (chỉ cấp
   Thành phố), số tài khoản, và danh sách mẫu (hồ sơ trễ hạn, thủ tục chưa trực tuyến toàn trình) khi mở hồ sơ một đơn vị.
   - Tổng Thành phố lấy từ HCC_TARGETS (hcc-config.js), chia cho các đơn vị theo quy mô (phường/xã: số học sinh trong file
     "SỐ LIỆU TRƯỜNG HỌC" 07/2026 làm thước đo dân số; sở/ngành: trọng số trong HCC_SO), có nhiễu ngẫu nhiên CỐ ĐỊNH (seed)
     → lần nào mở cũng ra cùng số. Mỗi đơn vị có một "mức chất lượng" cố định nên đơn vị tốt ở quý này thường tốt ở quý sau.
   - Số con không vượt số cha (trễ hạn ≤ đã giải quyết, số hóa ≤ tiếp nhận...). Mọi số cấp Thành phố là TỔNG CỘNG DỒN
     từ các đơn vị (trừ số thủ tục: lấy nút gốc, xem giả định trong hcc-config.js).
   - Theo lĩnh vực: tổng hồ sơ tiếp nhận các lĩnh vực = tổng tiếp nhận các đơn vị; đã giải quyết các lĩnh vực = tổng
     trước hạn + đúng hạn + trễ hạn các đơn vị; tồn cuối quý này = chuyển sang đầu quý sau (khớp theo từng lĩnh vực).
   Khi có API thật: thay hccBuild() bằng hàm đọc các endpoint, giữ nguyên cấu trúc {name,kind,v:{kỳ:{trường}}}. */

/* dxl = hồ sơ đang xử lý cuối kỳ (tồn của đơn vị), dxlt = trong đó đã quá hạn xử lý (đang xử lý trễ hạn), dxlth = còn trong hạn */
const HCC_UFIELDS = ['hs', 'sh', 'gq', 'th', 'dh', 'tre', 'tp', 'ttt', 'tkh', 'dg', 'rhl', 'hl', 'bt', 'khl', 'rkhl', 'tthc', 'tt', 'mp', 'ctt', 'dxl', 'dxlt', 'dxlth'];
const HCC_KHOI = [['so', 'Sở, ngành'], ['p', 'Phường'], ['x', 'Xã']];

function hccRng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Chia tổng theo trọng số (phần dư lớn nhất), có trần cho từng phần tử. Tổng luôn giữ đúng nếu tổng trần đủ lớn. */
function hccAlloc(total, w, cap) {
  const n = w.length;
  const sw = w.reduce((a, b) => a + b, 0) || 1;
  const raw = w.map((x) => (x / sw) * total);
  const out = raw.map((x) => Math.floor(x));
  const rem = total - out.reduce((a, b) => a + b, 0);
  const ord = raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]);
  for (let k = 0; k < rem; k++) out[ord[k % n][1]]++;
  if (cap) {
    let ex = 0;
    for (let i = 0; i < n; i++) if (out[i] > cap[i]) { ex += out[i] - cap[i]; out[i] = cap[i]; }
    let guard = 0;
    while (ex > 0 && guard < 200000) {
      let best = -1, bv = -1;
      for (let i = 0; i < n; i++) {
        if (cap[i] - out[i] > 0) { const s = (w[i] + 1e-9) / (out[i] + 1); if (s > bv) { bv = s; best = i; } }
      }
      if (best < 0) break;
      const add = Math.min(ex, cap[best] - out[best], Math.max(1, Math.floor(ex / 8)));
      out[best] += add; ex -= add; guard++;
    }
  }
  return out;
}

function hccSum(o, keys) { if (!o) return null; let s = 0; for (const k of keys) { if (o[k] == null) return null; s += o[k]; } return s; }

    if (n.f) { now = hccSum(oNow, n.f); prev = hccSum(oPrev, n.f); }
    else if (kids.length) { now = kids.every((k) => k.now != null) ? kids.reduce((s, k) => s + k.now, 0) : null; prev = kids.every((k) => k.prev != null) ? kids.reduce((s, k) => s + k.prev, 0) : null; }
    if (n.den) { den = hccSum(oNow, n.den); denPrev = hccSum(oPrev, n.den); }
    return Object.assign({}, n, { kind: 'add', now: now, prev: prev, den: den, denPrev: denPrev, kids: kids });
  };

}

/* ---------- Tiện ích ---------- */
function hccE(s) { return typeof esc === 'function' ? esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

/* Chú thích khi rê chuột vào mũi tên tăng/giảm (thuộc tính title) — cùng quy ước với sgdDlTip. kind: 'rate' = điểm %,
   'abs' = chênh lệch số thường, 'rel' = % so với chính nó. better: 'high' / 'low' / 'none'. cmpTP: so với mức Thành phố. */
function hccDlTip(kind, better, now, prev, d, cmpTP) {
  const L = [];
  const fm = (x) => (kind === 'rate' ? hccFmt(x, 1) + '%' : hccFmt(x, kind === 'abs' ? d : Number.isInteger(x) ? 0 : 1));
  const was = cmpTP ? 'Mức Thành phố' : 'Kỳ trước', is = cmpTP ? 'đơn vị này' : 'kỳ này';
  if (kind === 'rate') L.push('Đơn vị "điểm %" (điểm phần trăm): lấy tỷ lệ ' + is + ' TRỪ thẳng ' + (cmpTP ? 'tỷ lệ của Thành phố' : 'tỷ lệ kỳ trước') + '.');
  else if (kind === 'abs') L.push('Chênh lệch trực tiếp: số ' + is + ' trừ ' + (cmpTP ? 'mức Thành phố' : 'số kỳ trước') + '.');
  else L.push('Tăng/giảm bao nhiêu % so với chính nó kỳ trước: (kỳ này ÷ kỳ trước − 1) × 100.');
  if (now != null && prev != null) {
    const v = kind === 'rel' ? (prev ? (now / prev - 1) * 100 : null) : now - prev;
    if (v != null) {
      const dd = kind === 'abs' ? d : 1, unit = kind === 'rate' ? ' điểm %' : kind === 'rel' ? '%' : '';
      const r = Math.round(v * Math.pow(10, dd)) / Math.pow(10, dd);
      L.push(was + ' ' + fm(prev) + ' → ' + is + ' ' + fm(now) + ': ' + (r === 0 ? 'không đổi' : (r > 0 ? (cmpTP ? 'cao hơn ' : 'tăng ') : (cmpTP ? 'thấp hơn ' : 'giảm ')) + hccFmt(Math.abs(v), dd) + unit) + '.');
    }
  }
  if (kind === 'rate') L.push('Ví dụ: 92,1% lên 92,9% là tăng 0,8 điểm %, không phải tăng 0,8%.');
  if (!cmpTP) L.push(better === 'low' ? 'Chỉ tiêu này giảm là tốt: tăng tô đỏ, giảm tô xanh.' : better === 'none' ? 'Tăng hay giảm không tự thân tốt/xấu nên tô màu trung tính.' : 'Chỉ tiêu này tăng là tốt: tăng tô xanh, giảm tô đỏ.');
  return L.join('\n');
}
/* Mũi tên tăng/giảm — cùng quy ước với form Sở GD&ĐT. o.rate: chênh lệch điểm %, o.abs: chênh lệch số thường,
   o.inv: giảm là tốt, o.neutral: màu trung tính. */
function hccDl(now, prev, o) {
  o = o || {};
  if (now == null || prev == null) return '';
  const v = o.rate || o.abs ? now - prev : (prev ? (now / prev - 1) * 100 : null);
  if (v == null) return '';
  const d = o.d != null ? o.d : 1;
  const r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d);
  let cls = r > 0 ? 'up' : r < 0 ? 'down' : 'flat';
  if (cls !== 'flat') { if (o.inv) cls += r > 0 ? ' bad' : ' good'; else if (o.neutral) cls += ' n'; }
  const txt = cls === 'flat' ? 'Không đổi' : hccFmt(Math.abs(v), d) + (o.abs ? '' : o.rate ? ' điểm %' : '%');
  const tip = hccDlTip(o.rate ? 'rate' : o.abs ? 'abs' : 'rel', o.inv ? 'low' : o.neutral ? 'none' : 'high', now, prev, d);
  return '<span class="stc-dl ' + cls + '" title="' + hccE(tip) + '" style="cursor:help">' + txt + (o.ref ? ' <span class="stc-ref">' + hccE(o.ref) + '</span>' : '') + '</span>';
}
function hccLegend(p, pp) {

        L.map((x) => '<div class="sgd-xt-row" style="grid-template-columns:' + lg + '"><span class="sgd-mono">' + hccE(x.code) + '</span><span>' + hccE(x.tthc) + '</span><span>' + hccE(x.applicant) + '</span><span>' + x.exp + '</span><span>' + x.done + '</span><span class="sgd-num"><b style="color:var(--bad)">' + x.late + ' ngày</b></span></div>').join('') + '</div>' +

        : hccEmpty('Không có hồ sơ trễ hạn', 'Đơn vị không có hồ sơ trễ hạn trong kỳ này.'));
  }
  return h + '</div>';
}

/* ---------- Dựng màn + điều khiển ---------- */
function hccScreenHtml() {
  if (HCC_UI.screen === 'group') return hccScreenGroup();
  if (HCC_UI.screen === 'detail') return hccScreenDetail();
  if (HCC_UI.screen === 'xa') return hccScreenXa();
  if (HCC_UI.screen === 'src') return hccScreenSrc();
  return hccScreenHome();
}
function hccScreenMeta() {
  const base = 'Trung tâm Phục vụ hành chính công';
  if (HCC_UI.screen === 'group') { const gi = Math.max(0, HCC_GROUPS.findIndex((g) => g.id === HCC_UI.group)); return { title: base + ' — ' + HCC_GROUPS[gi].label, sub: 'Nhóm ' + (gi + 1) + '/' + HCC_GROUPS.length + ' · ' + hccPeriodLabel(HCC_UI.period) }; }
  if (HCC_UI.screen === 'detail') { const t = HCC_TREE.find((x) => x.id === HCC_UI.tree); return { title: base + ' — Chi tiết chỉ tiêu', sub: t ? t.label : '' }; }
  if (HCC_UI.screen === 'xa') { const t = HCC_XA_INDS.find((x) => x.id === HCC_UI.xa.ind); return { title: base + ' — Chỉ tiêu theo đơn vị', sub: (t ? t.label + ' · ' : '') + hccPeriodLabel(HCC_UI.period) }; }
  if (HCC_UI.screen === 'src') return { title: base + ' — Nguồn dữ liệu và giả định', sub: '9 API hcc_tkpro (hiện chỉ có schema)' };
  return { title: base + ' — Bộ chỉ tiêu hành chính công Thủ đô', sub: 'Tổng hợp từ ' + HCC_SO.length + ' sở, ngành và 126 phường/xã' };
}
function hccTasksHtml() {
  if (typeof fieldScenarioSummary !== 'function') return '';
  try { return '<div class="stc-tasks" style="margin-top:18px">' + fieldScenarioSummary('cat::' + (HCC_UI.role || (typeof currentRole !== 'undefined' ? currentRole : 'UBND')) + '::ubnd-hcc') + '</div>'; } catch (e) { return ''; }
}
function hccRerender(resetScroll) {
  const body = document.getElementById('modalBody'), title = document.getElementById('modalTitle'), sub = document.getElementById('modalSub');
  if (!body || !HCC_UI.open) return;
  const top = body.scrollTop, meta = hccScreenMeta();
  if (title) title.textContent = meta.title;
  if (sub) sub.textContent = 'DỮ LIỆU GIẢ LẬP · ' + meta.sub;
  let html;
  try { html = hccScreenHtml(); } catch (e) { console.error(e); html = hccEmpty('Không dựng được màn hình', 'Có lỗi khi tính số liệu giả lập: ' + (e && e.message ? e.message : e)); }
  body.innerHTML = '<div class="stc-root hcc-root stc-wrap">' + html + '</div>' + hccTasksHtml();
  if (typeof lcFit === 'function') lcFit(body);
  body.scrollTop = resetScroll ? 0 : top;
  if (HCC_UI.focusQ) {
    const inp = body.querySelector('#hccQ');
    if (inp) { inp.focus(); const L = inp.value.length; try { inp.setSelectionRange(L, L); } catch (e) { /* bỏ qua */ } }
    HCC_UI.focusQ = false;
  }
}
function hccOpenForm(itemIndex, role) {
  if (role) HCC_UI.role = role;
  const it = typeof itemIndex === 'number' ? HCC_ITEMS[itemIndex] : null;
  const key = it ? it.hccKey : 'home';
  HCC_UI.dd = null; HCC_UI.pick = null; HCC_UI.xa.sel = null;
  if (key === 'xa') HCC_UI.screen = 'xa';
  else if (HCC_GROUPS.some((g) => g.id === key)) { HCC_UI.screen = 'group'; HCC_UI.group = key; }
  else HCC_UI.screen = 'home';
  if (typeof STC_UI !== 'undefined') STC_UI.open = false;          // popup đang thuộc về form Trung tâm Phục vụ HCC
  if (typeof SGD_UI !== 'undefined') SGD_UI.open = false;
  HCC_UI.open = true;
  hccRerender(true);
  if (typeof openModal === 'function') openModal();
  /* lần dựng đầu popup còn ẩn: vẽ lại biểu đồ đường khi popup đã hiện */
  if (typeof lcFit === 'function') lcFit(document.getElementById('modalBody'));
}
function hccClose() { HCC_UI.open = false; if (typeof closeModal === 'function') closeModal(); }
function hccGo(screen, arg) { HCC_UI.dd = null; HCC_UI.pick = null; HCC_UI.screen = screen; if (screen === 'group' && arg) HCC_UI.group = arg; hccRerender(true); }
function hccDetail(id) { HCC_UI.dd = null; HCC_UI.pick = null; HCC_UI.screen = 'detail'; if (id) HCC_UI.tree = id; hccRerender(true); }
function hccPick(id) { HCC_UI.pick = HCC_UI.pick === id ? null : id; hccRerender(false); }
function hccStep(d) { const at = HCC_TREE.findIndex((t) => t.id === HCC_UI.tree); HCC_UI.tree = HCC_TREE[(at + d + HCC_TREE.length) % HCC_TREE.length].id; HCC_UI.pick = null; hccRerender(true); }
function hccXa(ind) { HCC_UI.dd = null; HCC_UI.screen = 'xa'; HCC_UI.xa.sel = null; if (ind) hccXaSetInd(ind); hccRerender(true); }
function hccXaOpen(ind, name) { HCC_UI.dd = null; HCC_UI.screen = 'xa'; hccXaSetInd(ind); HCC_UI.xa.f = 'all'; HCC_UI.xa.q = ''; HCC_UI.xa.sel = name; HCC_UI.xa.anim = true; hccRerender(true); }
function hccXaSetInd(ind) { const x = HCC_XA_INDS.find((i) => i.id === ind); if (!x) return; HCC_UI.xa.ind = ind; HCC_UI.xa.sk = 'v'; HCC_UI.xa.sd = x.better === 'low' ? 1 : -1; }
function hccXaInd(ind) { hccXaSetInd(ind); hccRerender(false); }
function hccXaF(f) { HCC_UI.xa.f = f; hccRerender(false); }
function hccXaQ(v) { HCC_UI.xa.q = v; HCC_UI.focusQ = true; hccRerender(false); }
function hccXaSel(name) { const X = HCC_UI.xa; X.anim = !!name && !X.sel; X.sel = name || null; hccRerender(false); }
function hccXaStep(d) { const X = HCC_UI.xa, at = X.order.indexOf(X.sel); if (at < 0 || !X.order[at + d]) return; X.sel = X.order[at + d]; hccRerender(false); }
function hccXaSort(k) { const X = HCC_UI.xa; X.sd = X.sk === k ? -X.sd : (k === 'name' ? 1 : -1); X.sk = k; hccRerender(false); }
function hccDdToggle(id) { HCC_UI.dd = HCC_UI.dd === id ? null : id; hccRerender(false); }
function hccSetPeriod(p) { HCC_UI.dd = null; HCC_UI.period = String(p); HCC_UI.pick = null; hccRerender(false); }
if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !HCC_UI.open) return;
    const m = document.getElementById('modal');
    if (!(m && m.classList.contains('open') && m.querySelector('.hcc-root'))) return;
    if (HCC_UI.dd) { HCC_UI.dd = null; hccRerender(false); return; }
    if (HCC_UI.screen === 'xa' && HCC_UI.xa.sel) { hccXaSel(null); return; }   // Esc đóng khung hồ sơ trước
    hccClose();
  });
  document.addEventListener('click', (e) => {
    if (!HCC_UI.dd || !HCC_UI.open) return;
    if (e.target && e.target.closest && e.target.closest('.hcc-root .stc-dd')) return;
    HCC_UI.dd = null;
    hccRerender(false);
  });
}

/* ---------- Xuất Excel ---------- */
async function hccExport() {
  if (typeof ExcelJS === 'undefined') { if (typeof toast === 'function') toast('Thư viện xuất Excel chưa tải xong, thử lại sau giây lát.'); return; }
  const n = hccNP();
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Chỉ tiêu Thành phố');
  ws.addRow(['Trung tâm Phục vụ hành chính công Hà Nội · ' + hccPeriodLabel(n.p) + ' · DỮ LIỆU GIẢ LẬP, KHÔNG PHẢI SỐ LIỆU THẬT']).font = { italic: true };
  ws.addRow([]);
  ws.addRow(['Nhóm', 'Chỉ tiêu', 'Thành phần', hccPeriodLabel(n.p), n.pp != null ? hccPeriodLabel(n.pp) : 'Kỳ trước', 'So kỳ trước', 'Đơn vị']).font = { bold: true };
  HCC_TREE.forEach((spec) => {
    const g = HCC_GROUPS.find((x) => x.id === spec.group), T = hccEvalTree(spec, n.C, n.P);
    const add = (x, depth) => {
      const d = x.now == null || x.prev == null || !x.prev ? null : Math.round((x.now / x.prev - 1) * 1000) / 10;
      ws.addRow([g ? g.label : '', spec.label, depth ? '   '.repeat(depth - 1) + x.label : '(tổng)', x.now, x.prev, d == null ? null : d + '%', spec.unit]);
      (x.kids || []).forEach((k) => add(k, depth + 1));
    };
    add(T, 0);
  });
  ws.columns = [{ width: 26 }, { width: 34 }, { width: 30 }, { width: 16 }, { width: 16 }, { width: 14 }, { width: 12 }];
  const wx = wb.addWorksheet('Theo đơn vị');
  wx.addRow(['Đơn vị', 'Khối'].concat(HCC_XA_INDS.map((x) => x.label + (x.pct ? ' (%)' : '')))).font = { bold: true };
  hccUnits().forEach((r) => {
    const o = r.v[n.p];
    wx.addRow([r.name, hccKindLabel(r.kind)].concat(HCC_XA_INDS.map((x) => {
      const v = x.type === 'count' ? x.parts.reduce((a, c) => a + (c.f(o) || 0), 0) : hccDiv(x.num(o), x.den(o), x.m);
      return v == null ? null : Math.round(v * 100) / 100;
    })));
  });
  wx.columns = [{ width: 40 }, { width: 10 }].concat(HCC_XA_INDS.map(() => ({ width: 16 })));
  const wl = wb.addWorksheet('Theo lĩnh vực');
  wl.addRow(['Lĩnh vực', 'Kỳ trước chuyển sang', 'Tiếp nhận', 'Trực tuyến', 'Trực tiếp', 'Bưu chính', 'Đã giải quyết', 'Còn tồn']).font = { bold: true };
  n.C.lv.forEach((x) => wl.addRow([x.name, x.kt, x.tong, x.ol, x.tti, x.bc, x.ht, x.ton]));
  wl.columns = [{ width: 26 }].concat([1, 2, 3, 4, 5, 6, 7].map(() => ({ width: 16 })));
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tt-phuc-vu-hcc-' + n.p + '-DU-LIEU-GIA-LAP.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

    body + foot + '</div></div>';
}
/* Thẻ xem trước một nhóm (dùng ở bản xem trước gộp nhiều lĩnh vực, hoặc khi bật HCC_SHOW_OUTER_GROUP_CARDS). */
function hccPreviewBody(it) {
  const M = hccMetrics();

   theo giao diện mới của Sở Tài chính / Sở GD&ĐT / TT Phục vụ HCC:
     1. 8 ô số then chốt của Thành phố (mỗi ô ghi sở cung cấp và kỳ số liệu),

     3. thẻ từng sở cùng một kiểu: nhãn – số – đơn vị – tăng/giảm, chân thẻ ghi kỳ và nguồn.
   CHỈ thay lớp ngoài: bấm ô số / thẻ sở vẫn gọi openCategoryDetail() như cũ, giao diện chi tiết của từng sở giữ nguyên.
   Số lấy thẳng từ cấu hình của từng sở (stc-/sgd-/hcc-data, *_ITEMS, *_KY ...), không ghi cứng ở đây.
   Đặt UBND_OVERVIEW_ENABLED = false để quay về lưới thẻ cũ (code cũ trong indicators.js giữ nguyên). */
const UBND_OVERVIEW_ENABLED = true;
/* Nhãn "SỐ GIẢ LẬP" / "DỮ LIỆU MẪU" ở chân thẻ và câu nhắc giả lập ở đầu băng tổng quan — anh yêu cầu ẩn (2026-10-06). */
const UBND_OV_SHOW_DEMO_FLAG = false;
/* Cột so sánh (▲▼ kỳ trước / cùng kỳ) và ghi chú phụ ("đạt chỉ tiêu…", "5 quá hạn"…) — anh yêu cầu bỏ ở màn tổng quan
   (2026-10-06): mỗi dòng chỉ còn tên – số – đơn vị, kẻ thẳng cột. Số liệu so sánh vẫn tính trong UBND_OV_SPECS, chỉ không hiện. */
const UBND_OV_SHOW_COMPARE = false;
/* true = sở đã có cấu hình chi tiết khuôn mới (ctm-so.js) thì thẻ, ô số ở đây ĐỌC THẲNG dòng thẻ ngoài của cấu hình đó (ctmOvLines),
   không tự tính lại — cùng số, cùng đơn vị, cùng nhãn với tab "Tất cả" và với màn chi tiết (quy tắc H22, 12/10/2026).
   false = quay về bảng tự tính UBND_OV_SPECS bên dưới (giữ nguyên, không xóa). */
const UBND_OV_FROM_CTM = true;
let UBND_OV_GROUP = 'all';

/* Sở Du lịch đã nhập vào Sở Văn hóa, Thể thao và Du lịch (cờ UBND_SAP_XEP_SO_2026, central-level.js): 'ubnd-dulich' vẫn để trong
   nhóm dưới đây nhưng không còn trong danh mục sở nên tự rơi khỏi nhóm; ô số khách du lịch đọc dòng "dlTong" của thẻ sở gộp. */
const UBND_OV_GOP_DL = typeof UBND_SAP_XEP_SO_2026 !== 'undefined' && UBND_SAP_XEP_SO_2026;
const UBND_OV_GROUPS = [
  { id: 'kt', label: 'Kinh tế – Tài chính', ids: ['ubnd-taichinh', 'ubnd-congthuong', 'ubnd-dulich', 'ubnd-bqlkcnc'] },
  { id: 'vx', label: 'Văn hóa – Xã hội', ids: ['ubnd-gddt', 'ubnd-yte', 'ubnd-vhtt', 'ubnd-noivu', 'ubnd-dantoc-tongiao'] },
  { id: 'hc', label: 'Hành chính – Chuyển đổi số', ids: ['ubnd-hcc', 'ubnd-vpubnd', 'ubnd-khcn', 'ubnd-thanhtra'] },
  { id: 'dt', label: 'Đô thị – Môi trường', ids: ['ubnd-xaydung', 'ubnd-nnmt'] }
];
/* 8 ô số then chốt: lấy dòng thứ `line` trong thẻ của sở `cat` (xem UBND_OV_SPECS). */
const UBND_OV_KPIS = [
  { cat: 'ubnd-taichinh', line: 0, label: 'Thu ngân sách nhà nước' },
  { cat: 'ubnd-hcc', line: 0, label: 'Hồ sơ thủ tục hành chính tiếp nhận mới', u: '' },
  { cat: 'ubnd-hcc', line: 1, label: 'Nộp hồ sơ trực tuyến' },
  { cat: 'ubnd-congthuong', line: 0, m: 'xk', label: 'Kim ngạch xuất khẩu' },
  { cat: 'ubnd-congthuong', line: 2, m: 'bl', label: 'Bán lẻ hàng hóa và dịch vụ tiêu dùng' },

  { cat: 'ubnd-vpubnd', line: 0, m: 'vbR', label: 'Văn bản xử lý trên môi trường mạng' }
];
/* Tên ngắn của sở ở ô số và thẻ nhóm. */
const UBND_OV_SHORT = {
  'ubnd-taichinh': 'Sở Tài chính', 'ubnd-congthuong': 'Sở Công Thương', 'ubnd-dulich': 'Sở Du lịch', 'ubnd-bqlkcnc': 'Ban Quản lý KCNC và KCN',
  'ubnd-gddt': 'Sở Giáo dục và Đào tạo', 'ubnd-yte': 'Sở Y tế', 'ubnd-vhtt': UBND_OV_GOP_DL ? 'Sở Văn hóa, Thể thao và Du lịch' : 'Sở Văn hóa và Thể thao', 'ubnd-noivu': 'Sở Nội vụ',
  'ubnd-dantoc-tongiao': 'Sở Dân tộc và Tôn giáo', 'ubnd-hcc': 'TT Phục vụ hành chính công', 'ubnd-vpubnd': 'Văn phòng UBND Thành phố',
  'ubnd-khcn': 'Sở Khoa học và Công nghệ', 'ubnd-thanhtra': 'Thanh tra Thành phố', 'ubnd-xaydung': 'Sở Xây dựng', 'ubnd-nnmt': 'Sở Nông nghiệp và Môi trường'
};

/* ---------- Tiện ích ---------- */
function uoE(s) { return typeof esc === 'function' ? esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function uoFmt(n, d) {
  if (n == null || !isFinite(n)) return '—';
  d = d || 0;
  const p = Math.abs(n).toFixed(d).split('.');
  return (n < 0 && Number(Math.abs(n).toFixed(d)) !== 0 ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : '');
}
function uoPct(a, b) { return a == null || !b ? null : (a / b) * 100; }
/* Giá trị một thành phần phân tổ (theo nhãn) của chỉ tiêu thứ i trong *_ITEMS. */
function uoP(items, i, label) {
  const it = items && items[i];
  if (!it) return null;
  for (const p of (it[4] || [])) { const x = (p.items || []).find((y) => y.label === label); if (x) return Number(x.value); }
  return null;
}
/* Tổng các thành phần của phân tổ đầu tiên của chỉ tiêu thứ i. */
function uoSum(items, i) {
  const p = items && items[i] && (items[i][4] || [])[0];
  return p ? p.items.reduce((s, x) => s + (Number(x.value) || 0), 0) : null;
}
/* Mũi tên tăng/giảm — cùng lớp CSS với form STC/SGD/HCC. o.inv: giảm là tốt; o.neutral: màu trung tính; o.rate: chênh điểm %. */
function uoDl(now, prev, o) {
  o = o || {};
  if (now == null || prev == null) return '';
  const v = o.rate ? now - prev : (prev ? (now / prev - 1) * 100 : null);
  if (v == null) return '';
  const r = Math.round(v * 10) / 10;
  let cls = r > 0 ? 'up' : r < 0 ? 'down' : 'flat';
  if (cls !== 'flat') { if (o.inv) cls += r > 0 ? ' bad' : ' good'; else if (o.neutral) cls += ' n'; }
  const txt = cls === 'flat' ? 'Không đổi' : uoFmt(Math.abs(v), 1) + (o.rate ? ' điểm %' : '%');
  const tip = (o.ref ? 'So ' + o.ref + ': ' : '') + uoFmt(prev, o.d || 0) + ' → ' + uoFmt(now, o.d || 0) + '. ' +
    (o.inv ? 'Chỉ tiêu này giảm là tốt.' : o.neutral ? 'Tăng hay giảm không tự thân tốt/xấu nên để màu trung tính.' : 'Chỉ tiêu này tăng là tốt.');
  return '<span class="stc-dl ' + cls + '" title="' + uoE(tip) + '">' + txt + (o.ref ? ' <span class="stc-ref">' + uoE(o.ref) + '</span>' : '') + '</span>';
}
/* Ghi chú ngắn thay cho mũi tên khi sở chưa có số kỳ trước (tone: 'good' | 'bad' | ''). */
function uoNote(text, tone) { return '<span class="stc-dl na' + (tone ? ' uo-' + tone : '') + '">' + uoE(text) + '</span>'; }
function uoL(l, v, u, d) { return { l: l, v: v, u: u || '', d: d || '' }; }

/* ---------- Số của từng sở: { ky, src, flag, lines } ---------- */
const UBND_OV_SPECS = {
  'ubnd-taichinh': () => {
    if (typeof stcDefaultPeriod !== 'function' || typeof stcBuildPeriod !== 'function') return null;
    const p = stcDefaultPeriod(), res = p ? stcBuildPeriod(p.year, p.period) : null;
    if (!res) return { ky: '—', src: 'API', lines: [], none: 'Chưa có bản chụp số liệu.' };
    const lines = ['thu', 'chi', 'vdt', 'grdp'].map((id) => {
      const n = res.byId[id], root = res.rootOf ? res.rootOf[id] : null;

      const d = stcDeltaCq(n) != null ? stcDlOne(n, 'cq', true) : stcDeltaKq(n) != null ? stcDlOne(n, 'kq', true) : '';
      return uoL((typeof STC_SHORT !== 'undefined' && STC_SHORT[id]) || n.label, stcVal(n), n.unit, d);
    }).filter(Boolean);
    return { ky: 'Quý ' + p.period + '/' + p.year, src: 'API', flag: (typeof STC_DEMO_ON !== 'undefined' && STC_DEMO_ON) ? 'DỮ LIỆU MẪU' : '', lines: lines, none: 'Kỳ này chưa có số liệu.' };
  },
  'ubnd-gddt': () => {

      uoL('Trường đạt chuẩn quốc gia', uoFmt(M.cq[0]), 'trường', sgdDl(M.cq[0], M.cq[1], o)),
      uoL('Học sinh tiểu học, THCS', uoFmt(M.hs[0]), 'học sinh',sgdDl(M.hs[0], M.hs[1], o)),
      uoL('Giáo viên tiểu học, THCS', uoFmt(M.gv[0]), 'người', sgdDl(M.gv[0], M.gv[1], o))] };
  },
  'ubnd-hcc': () => {

      uoL('Nộp hồ sơ trực tuyến', uoFmt(M.olR[0], 1), '%', hccDl(M.olR[0], M.olR[1], { rate: true, ref: 'kỳ trước' })),
      uoL('Giải quyết đúng hạn', uoFmt(M.dungR[0], 2), '%', hccDl(M.dungR[0], M.dungR[1], { rate: true, d: 2, ref: 'kỳ trước' })),

  'ubnd-congthuong': () => {
    const X = SCT_XNK, B = SCT_BL, N = SCT_NL, o = (x) => Object.assign({ ref: 'cùng kỳ' }, x || {});
    return { ky: SCT_KY, src: 'Eform', lines: [
      uoL('Kim ngạch xuất khẩu', uoFmt(X.xk), 'triệu USD', uoDl(X.xk, X.xkCk, o())),
      uoL('Kim ngạch nhập khẩu', uoFmt(X.nk), 'triệu USD', uoDl(X.nk, X.nkCk, o({ neutral: true }))),
      uoL('Bán lẻ hàng hóa và dịch vụ tiêu dùng', uoFmt(B.banLe + B.dichVu), 'tỷ đồng', uoDl(B.banLe + B.dichVu, B.ckTong, o())),
      uoL('Điện năng tiêu thụ', uoFmt(N.dien), 'triệu kWh', uoDl(N.dien, N.dienCk, o({ neutral: true })))] };
  },
  'ubnd-dulich': () => {
    const I = DL_ITEMS, qt = uoP(I, 0, 'Quốc tế'), nd = uoP(I, 0, 'Nội địa');
    return { ky: DL_KY, src: 'Eform', lines: [
      uoL('Tổng lượt khách du lịch', uoFmt((qt + nd) / 1e6, 2), 'triệu lượt', ''),
      uoL('Khách quốc tế', uoFmt(qt / 1e6, 2), 'triệu lượt', uoNote(uoFmt(uoPct(qt, qt + nd), 1) + '% tổng lượt')),
      uoL('Tổng thu từ du lịch', uoFmt(uoSum(I, 1)), 'tỷ đồng', '')] };
  },
  'ubnd-bqlkcnc': () => {
    const I = BQL_ITEMS;
    return { ky: BQL_KY, src: 'Eform', lines: [
      uoL('Doanh nghiệp đang hoạt động', uoFmt(uoP(I, 0, 'Doanh nghiệp đang hoạt động')), 'doanh nghiệp', ''),
      uoL('Lao động đang làm việc', uoFmt(uoP(I, 0, 'Lao động đang làm việc')), 'người', ''),
      uoL('Vốn thu hút mới', uoFmt(uoP(I, 1, 'Vốn thu hút mới (tỷ đồng)')), 'tỷ đồng', uoNote(uoFmt(uoP(I, 1, 'Dự án mới')) + ' dự án mới'))] };
  },
  'ubnd-yte': () => {

function ubndOvData(id) {
  const C = ubndOvFromCtm(id);
  if (C) return C;
  const f = UBND_OV_SPECS[id];
  if (!f) return null;
  try { return f(); } catch (e) { if (typeof console !== 'undefined') console.warn('[ubnd-overview] ' + id, e); return null; }
}

/* Dòng thẻ ngoài lấy từ cấu hình chi tiết khuôn mới của sở (ctm-so.js). Dòng mang khóa chỉ tiêu (k) để ô số then chốt chọn theo khóa. */
function ubndOvFromCtm(id) {
  if (!UBND_OV_FROM_CTM || typeof CTM_SPECS === 'undefined' || typeof ctmOvLines !== 'function') return null;
  const spec = CTM_SPECS[id];
  if (!spec || spec.enabled === false || (spec.level || 'city') !== 'city') return null;
  try {
    return { ky: ctmPLabel(spec, ctmCurPid(spec)), src: 'Eform', lines: ctmOvLines(spec).map((x) => ({ k: x.k, l: x.l, v: x.v, u: x.u, d: '' })) };
  } catch (e) { if (typeof console !== 'undefined') console.warn('[ubnd-overview] ' + id, e); return null; }
}

/* ============================== BIỂU ĐỒ ĐƯỜNG DÙNG CHUNG ==============================
   Dùng cho: khuôn chỉ tiêu chung (ctm-engine.js) và thẻ "Xu hướng" của Sở Tài chính, Sở GD&ĐT, TT Phục vụ HCC.
   - Trục dọc chia số tròn (1, 2, 2,5, 5 × 10^k), không bắt đầu từ 0 (quy tắc H13), có thể có đường mốc (VD 100 của chỉ số).
   - Nhãn số đặt tránh đường, đường mốc, điểm và nhãn khác; điểm quá dày thì chỉ ghi đầu, cuối, cao nhất, thấp nhất.
   - lcBox() trả khung HTML có bản vẽ tạm 560 đơn vị; lcFit(gốc) vẽ lại đúng bề rộng thật của khung (1 đơn vị SVG = 1px)
     để chữ không bị phóng to / thu nhỏ theo khung. Gọi lcFit sau khi gán innerHTML và khi popup đã hiện.
   Không phụ thuộc file nào khác. Nạp trước các file dashboard-*.js và ctm-engine.js. */

const LC_REG = {};
let LC_SEQ = 0;
function lcE(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function lcNum(v, d) { return v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('vi-VN', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }

/* Trục chia số tròn, khoảng 4 vạch; đáy trục chừa ít nhất 1/4 bước dưới điểm thấp nhất để nhãn số không đè trục ngang.
   o.pct: kẹp trong 0–100; o.zero: không xuống dưới 0 (số đếm) */
function lcNiceAxis(mn, mx, o) {
  o = o || {};
  const range = (mx - mn) || Math.max(Math.abs(mx), 1) * 0.1, raw = range / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => s >= raw - 1e-12);
  let lo = Math.floor(mn / step + 1e-9) * step, hi = Math.ceil(mx / step - 1e-9) * step;
  if (mn - lo < step * 0.25) lo -= step;
  if (hi <= lo) hi = lo + step;
  if (o.pct || o.zero) lo = Math.max(0, lo);
  if (o.pct) hi = Math.min(100, Math.max(hi, lo + step));
  const sd = String(+step.toFixed(6)).split('.')[1], dec = sd ? Math.min(3, sd.length) : 0;
  const ticks = [];
  for (let v = lo; v <= hi + step * 1e-6; v += step) ticks.push(+v.toFixed(6));
  return { lo: lo, hi: hi, step: step, ticks: ticks, dec: dec };
}

/* pts: [{ l: nhãn trục, v: số | null, on: điểm đang xem }]

/* Số ngẫu nhiên cố định theo chuỗi hạt giống (FNV-1a + mulberry32). */
function ctmRng(seed) {
  let h = 2166136261;
  const s = String(seed);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
/* Chia `total` theo trọng số (số thực). */
function ctmShare(total, w) { const s = w.reduce((a, b) => a + b, 0) || 1; return w.map((x) => (x / s) * total); }
/* Chia `total` (số nguyên không âm) theo trọng số thành số nguyên không âm, tổng luôn đúng bằng total: làm tròn xuống rồi chia
   phần còn lại cho các phần có phần lẻ lớn nhất (cách chia phần dư lớn nhất). Phần có trọng số 0 luôn nhận 0. */
function ctmShareInt(total, w) {
  const v = ctmShare(total, w), r = v.map(Math.floor);
  let d = total - r.reduce((a, b) => a + b, 0);
  const ord = v.map((x, i) => [x - Math.floor(x), i]).filter((x) => w[x[1]] > 0).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  for (let k = 0; d > 0 && ord.length; k = (k + 1) % ord.length, d--) r[ord[k][1]]++;
  return r;
}

   là quay về giao diện cũ — code cũ giữ nguyên, không xóa.

/* Mũi tên tăng/giảm — cùng quy ước Sở GD&ĐT / Trung tâm HCC: inv = giảm là tốt; neutral = màu trung tính; rate = chênh điểm %.
