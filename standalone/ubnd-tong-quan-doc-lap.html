/* ---------- Địa bàn vùng đồng bào DTTS và miền núi có dự án ----------
   DANH SÁCH THẬT theo Quyết định 201/QĐ-UBND ngày 15/01/2026 của UBND Thành phố (giai đoạn 2026-2030): 5 xã khu vực I
   (Yên Xuân, Mỹ Đức, Ba Vì, Suối Hai, Yên Bài) và 6 thôn: thôn Đồng Ké (xã Trần Phú); thôn Đồng Vàng, Cổ Rùa, Đồng Âm,
   Trán Voi, Đồng Vỡ (xã Phú Cát). Với 2 xã chỉ có thôn trong danh sách, chỉ các thôn đó có dự án.
   Số hộ, số thôn của 5 xã khu vực I, số hộ nghèo và mọi số vốn là GIẢ LẬP (chưa có số công bố theo xã mới sau sắp xếp).
   Hộ nghèo: Hà Nội không còn hộ nghèo theo chuẩn nghèo đa chiều từ năm 2024; các xã miền núi huyện Ba Vì cũ đã xóa hết hộ
   nghèo — nên số hộ nghèo đặt bằng 0 hoặc rất nhỏ (coi như theo chuẩn riêng của Thành phố, cần Sở xác nhận).
   [xã, số hộ DTTS, số thôn có đồng bào DTTS, hệ số quy mô vốn, hộ nghèo đầu kỳ, tên thôn (chỉ với xã chỉ có thôn trong danh sách)] */
const DTTG_XA = [
  ['Xã Ba Vì', 2300, 18, 1.55, 0], ['Xã Yên Xuân', 2100, 16, 1.45, 6], ['Xã Yên Bài', 1500, 12, 1.2, 0], ['Xã Suối Hai', 1100, 10, 1.0, 0],
  ['Xã Mỹ Đức', 520, 5, 0.75, 4],
  ['Xã Phú Cát', 720, 5, 0.85, 3, ['Đồng Vàng', 'Cổ Rùa', 'Đồng Âm', 'Trán Voi', 'Đồng Vỡ']],
  ['Xã Trần Phú', 210, 1, 0.5, 1, ['Đồng Ké']]
];
/* mô tả ngắn vùng đồng bào DTTS (thẻ số, bảng phường/xã) */
const DTTG_VUNG_NGAN = DTTG_XA.filter((x) => !x[5]).length + ' xã khu vực I, ' + dttgSum(DTTG_XA.filter((x) => x[5]).map((x) => x[5].length)) + ' thôn ở ' + DTTG_XA.filter((x) => x[5]).length + ' xã';
/* số phường/xã chưa gửi báo cáo tháng 9 (chọn cố định theo hàm băm trong các đơn vị không có dự án) */
const DTTG_SO_CHUA_BC = 5;

/* Số bản ghi theo dự án thành phần cho xã có n thôn; khoảng vốn kế hoạch 1 bản ghi (triệu đồng); loại bản ghi; nguồn vốn có thể có;
   nguồn dữ liệu thường dùng (chỉ số trong DTTG_NGUON, DTTG_LOAI_BG, DTTG_NGUON_DL).
   Nguồn vốn: Hà Nội là địa phương tự cân đối ngân sách, phải tự bố trí ngân sách địa phương cho Chương trình (báo cáo Sở Tài
   chính 6/2026) → không có NSTW; NSĐP là chính, sinh kế có thêm tín dụng chính sách, doanh nghiệp, người dân đóng góp. */
const DTTG_MAU = [
  { soBg: (t) => Math.max(1, Math.round(t / 2)), von: [2500, 9000], loai: 2, nguon: [1], ndl: [0, 2], ten: 'Cứng hóa đường trục thôn, đường liên thôn' },
  { soBg: (t) => (t >= 5 ? 2 : 1), von: [1200, 4000], loai: 2, nguon: [1], ndl: [2, 0], ten: 'Công trình cấp nước sinh hoạt tập trung' },
  { soBg: () => 1, von: [300, 900], loai: 0, nguon: [1], ndl: [4, 5], ten: 'Đào tạo nghề, hỗ trợ việc làm cho lao động DTTS' },
  { soBg: () => 1, von: [400, 1200], loai: 0, nguon: [1], ndl: [1, 5], ten: 'Bồi dưỡng kiến thức dân tộc, nâng cao năng lực cán bộ cơ sở' },
  { soBg: (t) => (t >= 4 ? 1 : 0), von: [300, 1000], loai: 1, nguon: [1, 5], ndl: [0, 1], ten: 'Bảo tồn lễ hội, nhà văn hóa thôn' },
  { soBg: (t) => (t >= 6 ? 2 : 1), von: [600, 2500], loai: 1, nguon: [1, 1, 2, 3, 4], ndl: [4, 0], ten: 'Hỗ trợ phát triển sản xuất theo chuỗi giá trị' },
  { soBg: () => 1, von: [50, 150], loai: 0, nguon: [1], ndl: [3], ten: 'Kiểm tra, giám sát, đánh giá thực hiện Chương trình' }
];
/* tiến độ giải ngân lũy kế chuẩn theo tháng (tỷ lệ của giải ngân đến hết tháng 9) */
const DTTG_DUONG_GN = [0.03, 0.07, 0.14, 0.22, 0.33, 0.45, 0.6, 0.79, 1];

/* ---------- Bản ghi (dự án, tiểu dự án, công trình) của các xã có vùng DTTS ---------- */
const DTTG_REC = [];
DTTG_XA.forEach((x) => {
  const xa = x[0], soThon = x[2], qm = x[3];
  DTTG_MAU.forEach((m, d) => {
    for (let j = 0; j < m.soBg(soThon); j++) {
      const k = xa + '|' + d + '|' + j, R = (s) => dttgR(k, s);
      const kh = Math.round((m.von[0] + (m.von[1] - m.von[0]) * R('v')) * qm);
      const pb = Math.round(kh * (R('pb') < 0.45 ? 1 : 0.82 + 0.18 * R('pb2')));
      const rt = R('tt');
      const tt = d === 6 ? (rt < 0.6 ? 1 : 0) : rt < 0.26 ? 0 : rt < 0.79 ? 1 : rt < 0.87 ? 2 : rt < 0.94 ? 3 : 4;   // chỉ số DTTG_TT
      const tdKh = tt === 0 ? 100 : Math.round(62 + 26 * R('kh'));
      const tdTt = tt === 0 ? 100 : tt === 1 ? Math.max(5, Math.min(99, tdKh - 15 + Math.round(22 * R('tt2')))) : tt === 2 ? 0 : tt === 3 ? Math.round(10 + 30 * R('tt2')) : Math.round(20 + 30 * R('tt2'));
      const dungTd = tt === 4 ? 2 : tt === 0 ? (R('ht') < 0.82 ? 0 : 1) : tt === 1 ? (tdTt >= tdKh - 5 ? 0 : 1) : 1;      // chỉ số DTTG_DUNG_TD
      const gn9 = Math.round(tt === 0 ? pb * (0.86 + 0.14 * R('g')) : tt === 1 ? pb * tdTt / 100 * (0.78 + 0.2 * R('g')) : tt === 2 ? 0 : pb * (0.05 + 0.25 * R('g')));
      const luyKe = DTTG_DUONG_GN.map((c, mi) => Math.round(gn9 * Math.min(1, c * (0.85 + 0.3 * R('m' + mi)))));
      luyKe[8] = gn9;
      for (let mi = 1; mi < 9; mi++) luyKe[mi] = Math.max(luyKe[mi], luyKe[mi - 1]);       // lũy kế không giảm
      const dinhTre = tt === 3 ? Math.round((pb - gn9) * (0.6 + 0.4 * R('dt'))) : tt === 1 && R('dt2') < 0.1 ? Math.round((pb - gn9) * 0.2) : 0;
      DTTG_REC.push({
        xa: xa, thon: x[5] ? 'Thôn ' + x[5][dttgHash(k + 'thon') % x[5].length] : 'Thôn ' + (1 + (dttgHash(k + 'thon') % soThon)), ma: 'DT' + (d + 1) + '-' + (DTTG_DV.indexOf(xa) + 1) + '-' + (j + 1),
        ten: m.ten, datp: d, loai: m.loai, nguon: m.nguon[dttgHash(k + 'ng') % m.nguon.length],
        kh: kh, pb: pb, luyKe: luyKe, gn9: gn9, gnKy: gn9 - luyKe[7],
        tt: tt, tdKh: tdKh, tdTt: tdTt, dungTd: dungTd, dinhTre: dinhTre,
        viPham: tt === 3 ? 1 + (R('vp') < 0.4 ? 1 : 0) : R('vp') < 0.06 ? 1 : 0,
        ktgs: R('kt') < 0.86 ? 0 : 1, cnso: R('cn') < 0.72 ? 0 : 1,                                                    // 0 = Có, 1 = Không
        doiSoat: R('ds') < 0.56 ? 0 : R('ds') < 0.8 ? 1 : R('ds') < 0.92 ? 2 : 3,
        ndl: m.ndl[dttgHash(k + 'ndl') % m.ndl.length]
      });
    }
  });
});
DTTG_REC.forEach((r) => {
  const R = (s) => dttgR(r.ma, s);
  r.co = r.doiSoat === 3 || r.viPham > 1 ? 1 : R('co') < 0.08 ? 2 : 0;                                                // chỉ số DTTG_CO
});

/* ---------- Từng phường/xã ---------- */
const DTTG_CHUA_BC = DTTG_DV.filter((n) => !DTTG_XA.some((x) => x[0] === n)).map((n) => [n, dttgR(n, 'bc')]).sort((a, b) => a[1] - b[1]).slice(0, DTTG_SO_CHUA_BC).map((r) => r[0]);
const DTTG_UNITS = DTTG_DV.map((ten) => {
  const x = DTTG_XA.find((r) => r[0] === ten);
  if (!x) return { ten: ten, bc: DTTG_CHUA_BC.indexOf(ten) >= 0 ? 2 : 1, rec: [] };
  const R = (s) => dttgR(ten, s), soHo = x[1], soThon = x[2];
  const hoNgheoDau = x[4];
  const hsTuoi = Math.round(soHo * (0.58 + 0.1 * R('hs')));
  return {
    ten: ten, bc: 0, rec: DTTG_REC.filter((r) => r.xa === ten),
    /* 4 nhóm chỉ số kết quả của địa bàn, theo bản báo cáo tháng 9 */
    /* nước hợp vệ sinh, đường, học sinh: vùng DTTS Hà Nội đã gần như phủ kín (100% xã có đường nhựa/bê tông đến trung tâm) */
    soHo: soHo, hoNuoc: Math.round(soHo * (0.955 + 0.04 * R('nuoc'))),
    soDuong: soThon, soCungHoa: Math.min(soThon, Math.round(soThon * (0.88 + 0.13 * R('ch')))),
    hsTuoi: hsTuoi, hsDungCap: Math.round(hsTuoi * (0.972 + 0.025 * R('dc'))),
    hoNgheoDau: hoNgheoDau, hoNgheoCuoi: Math.floor(hoNgheoDau * (0.4 + 0.25 * R('hc')))
  };
});

/* ---------- Số tổng hợp ---------- */
const DTTG_SUM = (function () {
  const R = DTTG_REC, U = DTTG_UNITS, X = U.filter((u) => u.bc === 0), M = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  const tong = (arr, f) => dttgSum(arr.map(f));
  const kh = tong(R, (r) => r.kh), pb = tong(R, (r) => r.pb), gn = tong(R, (r) => r.gn9);
  const luyKeT = M.map((m) => tong(R, (r) => r.luyKe[m]));
  const byDatp = DTTG_DATP.map((_, d) => { const a = R.filter((r) => r.datp === d); return [tong(a, (r) => r.kh), tong(a, (r) => r.pb), tong(a, (r) => r.gn9)]; });
  const byXa = X.map((u) => [u.ten, tong(u.rec, (r) => r.kh), tong(u.rec, (r) => r.gn9)]).sort((a, b) => b[1] - a[1]);
  const ttCnt = DTTG_TT.map((_, i) => R.filter((r) => r.tt === i).length);
  const ttDatp = DTTG_DATP.map((_, d) => DTTG_TT.map((_, i) => R.filter((r) => r.datp === d && r.tt === i).length));
  /* tiến độ bình quân có trọng số theo vốn phân bổ, chỉ dự án đã/đang triển khai (bỏ Chưa triển khai) */
  const tdDatp = DTTG_DATP.map((_, d) => { const a = R.filter((r) => r.datp === d && r.tt !== 2), w = tong(a, (r) => r.pb) || 1;
    return [tong(a, (r) => r.tdKh * r.pb) / w, tong(a, (r) => r.tdTt * r.pb) / w]; });
  const dung = DTTG_DUNG_TD.map((_, i) => R.filter((r) => r.dungTd === i).length);
  const kq = { soHo: tong(X, (u) => u.soHo), hoNuoc: tong(X, (u) => u.hoNuoc), soDuong: tong(X, (u) => u.soDuong), soCungHoa: tong(X, (u) => u.soCungHoa),
    hsTuoi: tong(X, (u) => u.hsTuoi), hsDungCap: tong(X, (u) => u.hsDungCap), hoNgheoDau: tong(X, (u) => u.hoNgheoDau), hoNgheoCuoi: tong(X, (u) => u.hoNgheoCuoi) };
  kq.tl = [kq.hoNuoc / kq.soHo * 100, kq.soCungHoa / kq.soDuong * 100, kq.hsDungCap / kq.hsTuoi * 100, (kq.hoNgheoDau - kq.hoNgheoCuoi) / kq.hoNgheoDau * 100];
  const bc = DTTG_BC.map((_, i) => U.filter((u) => u.bc === i).length);
  return {
    gn: { kh: kh, pb: pb, gn: gn, gnKy: tong(R, (r) => r.gnKy), luyKeT: luyKeT, kyT: M.map((m) => luyKeT[m] - (m ? luyKeT[m - 1] : 0)),
      dinhTre: tong(R, (r) => r.dinhTre), byDatp: byDatp, byXa: byXa,
      byNguon: DTTG_NGUON.map((_, i) => tong(R.filter((r) => r.nguon === i), (r) => r.kh)) },
    td: { n: R.length, tt: ttCnt, ttDatp: ttDatp, tdDatp: tdDatp, dung: dung, viPham: tong(R, (r) => r.viPham),
      ktgs: [R.filter((r) => r.ktgs === 0).length, R.filter((r) => r.ktgs === 1).length],
      loai: DTTG_LOAI_BG.slice(0, 3).map((_, i) => R.filter((r) => r.loai === i).length) },
    kq: kq,
    kqXa: X.map((u) => ({ ten: u.ten, soHo: u.soHo, hoNuoc: u.hoNuoc, hoNgheoDau: u.hoNgheoDau, hoNgheoCuoi: u.hoNgheoCuoi, soDuong: u.soDuong, soCungHoa: u.soCungHoa })),
    ds: { bc: bc, xaCo: X.length, doiSoat: DTTG_DOI_SOAT.map((_, i) => R.filter((r) => r.doiSoat === i).length),
      co: DTTG_CO.map((_, i) => R.filter((r) => r.co === i).length), ndl: DTTG_NGUON_DL.map((_, i) => R.filter((r) => r.ndl === i).length),
      cnso: [R.filter((r) => r.cnso === 0).length, R.filter((r) => r.cnso === 1).length],
      /* bản ghi tháng 9 = bản ghi dự án + 1 bản "Không phát sinh" mỗi phường/xã xác nhận không phát sinh */
      banGhi: R.length + bc[1] }
  };
})();

/* ---------- Mô tả 4 chỉ tiêu (dùng cho tài liệu; khối "Cách tính" trên giao diện đang ẩn) ---------- */
const DTTG_EFORM = 'Chương trình mục tiêu quốc gia phát triển kinh tế - xã hội vùng đồng bào dân tộc thiểu số và miền núi';
const DTTG_CT = [
  { key: 'gn', name: 'Giải ngân vốn Chương trình mục tiêu quốc gia vùng đồng bào DTTS', ky: 'lũy kế đến tháng 9/2026', freq: 'Tháng', soBanGhi: DTTG_REC.length },
  { key: 'td', name: 'Tiến độ thực hiện dự án, công trình', ky: DTTG_KY, freq: 'Tháng', soBanGhi: DTTG_REC.length },
  { key: 'kq', name: 'Kết quả đối với vùng đồng bào dân tộc thiểu số', ky: DTTG_KY, freq: 'Tháng', soBanGhi: DTTG_SUM.ds.xaCo },
  { key: 'ds', name: 'Tình hình báo cáo và đối soát dữ liệu', ky: DTTG_KY, freq: 'Tháng', soBanGhi: DTTG_SUM.ds.banGhi }
];

/* ---------- Dòng chỉ tiêu cho categorySeed (central-level.js) ---------- */
function dttgPart(dim, type, rows) { return { dim: dim, type: type, items: rows.map((r) => ({ label: r[0], value: r[1] })) }; }
const DTTG_ITEMS = (function () {
  const S = DTTG_SUM, src = 'Eform Sở Dân tộc và Tôn giáo (giả lập)';
  const parts = {

    td: [dttgPart('Trạng thái triển khai', 'bar', DTTG_TT.map((t, i) => [t[0], S.td.tt[i]]))],

const TTRA_MUA = [0.96, 0.82, 1.12, 1.08, 1.1, 1.04, 0.98, 0.94, 0.96];     // tháng Tết ít, quý II nhiều
const TTRA_LOAI_DON = [['Khiếu nại', '#d33a44'], ['Tố cáo', '#FD9843'], ['Kiến nghị, phản ánh', '#2a78d6'], ['Nhiều nội dung/khác', '#8ba7c2']];
const TTRA_KQ = [['Giải quyết đúng hạn', '#1baf7a'], ['Giải quyết quá hạn', '#eda100'], ['Đang xử lý trong hạn', '#2a78d6'], ['Đang xử lý quá hạn', '#d33a44'], ['Rút đơn/đình chỉ', '#898781']];

const TTRA_TCD = (function () {
  const w = TTRA_DV.map(ttraQuyMo);
  const luot = ttraSplit(TTRA_TCD_TONG.luot, w), don = ttraSplit(TTRA_TCD_TONG.donMoi, w.map((x, i) => x * (TTRA_DAT_DAI.indexOf(TTRA_DV[i]) >= 0 ? 1.3 : 1)));
  return TTRA_DV.map((ten, i) => {
    const R = (k) => ttraR('tcd' + ten, k), mua = TTRA_MUA.map((m, j) => m * (0.85 + 0.3 * R('m' + j)));
    const luotT = ttraSplit(luot[i], mua), donT = ttraSplit(don[i], mua);
    const nguoi = Math.round(luot[i] * (1.15 + 0.15 * R('ng')));
    const doan = Math.round(luot[i] * (0.008 + 0.006 * R('do')) * (TTRA_DAT_DAI.indexOf(ten) >= 0 ? 2 : 1));
    const vuTiepDan = Math.round(luot[i] * (0.5 + 0.12 * R('vt')));
    const kyTruoc = Math.round(don[i] * (0.08 + 0.06 * R('kt')));
    /* đơn phải xử lý = kỳ trước chuyển sang + đơn mới; đã xử lý (đã phân loại) = 93–98% số phải xử lý, phần còn lại chuyển kỳ sau (bản trả lời BA, mục 82) */
    const phaiXl = kyTruoc + don[i], xuLy = Math.round(phaiXl * (0.93 + 0.05 * R('xl'))), duDk = Math.round(xuLy * (0.66 + 0.1 * R('dk')));
    const tq = Math.round(duDk * (0.26 + 0.1 * R('tq'))), chuyen = Math.round((duDk - tq) * (0.48 + 0.12 * R('ch')));
    const kn = Math.round(don[i] * (0.12 + 0.05 * R('kn'))), tc = Math.round(don[i] * (0.05 + 0.03 * R('tc'))), khac = Math.round(don[i] * (0.05 + 0.04 * R('kh')));
    const thuLy = Math.round(tq * (0.2 + 0.08 * R('tl')));   // vụ việc khiếu nại, tố cáo thuộc thẩm quyền phải thụ lý
    const rut = Math.round(thuLy * 0.04 * R('rut') * 2), dangQh = Math.round(thuLy * (0.01 + 0.04 * R('dq'))), dangTh = Math.round(thuLy * (0.07 + 0.08 * R('dt')));
    const daGq = thuLy - rut - dangQh - dangTh, quaHan = Math.round(daGq * (0.03 + 0.07 * R('qh')));
    return {
      ten: ten, luotT: luotT, donT: donT, luot: luot[i], nguoi: nguoi, doan: doan, vuTiepDan: vuTiepDan,
      kyTruoc: kyTruoc, donMoi: don[i], phaiXl: phaiXl, daXl: xuLy, chuaXl: phaiXl - xuLy, duDk: duDk, khongDk: xuLy - duDk, tq: tq, chuyen: chuyen, huongDan: duDk - tq - chuyen,
      kn: kn, tc: tc, khac: khac, knpa: don[i] - kn - tc - khac,
      thuLy: thuLy, daGq: daGq, dungHan: daGq - quaHan, quaHan: quaHan, dangTh: dangTh, dangQh: dangQh, rut: rut,
      phucTap: Math.round(thuLy * 0.025 * R('pt') * (TTRA_DAT_DAI.indexOf(ten) >= 0 ? 3 : 1)), ton: dangTh + dangQh
    };
  });
})();

  const lvSo = TTRA_LV.map((_, i) => C.filter((c) => c.lv === i).length);
  const tt = { n: C.length, kyTruoc: C.filter((c) => c.kyTruoc).length, kl: C.filter((c) => c.kl).length, soDv: tong(C, (c) => c.soDv),

    tt: TTRA_TT.map((_, i) => C.filter((c) => c.tt === i).length), lv: lvSo, nguon: TTRA_NGUON.map((_, i) => C.filter((c) => c.nguon === i).length),
    cb: TTRA_CB.map((_, i) => C.filter((c) => c.cb === i).length),
    lvTien: TTRA_LV.map((_, i) => [tong(C.filter((c) => c.lv === i), (c) => c.thuHoi), tong(C.filter((c) => c.lv === i), (c) => c.daThu)]),
    theoDoi: [TTRA_THEO_DOI.hoanThanh, TTRA_THEO_DOI.tong - TTRA_THEO_DOI.hoanThanh - TTRA_THEO_DOI.quaHan, TTRA_THEO_DOI.quaHan] };
  const keys = ['luot', 'nguoi', 'doan', 'vuTiepDan', 'kyTruoc', 'donMoi', 'phaiXl', 'daXl', 'chuaXl', 'duDk', 'khongDk', 'tq', 'chuyen', 'huongDan', 'kn', 'tc', 'khac', 'knpa',
    'thuLy', 'daGq', 'dungHan', 'quaHan', 'dangTh', 'dangQh', 'rut', 'phucTap', 'ton'];
  const tcd = {}; keys.forEach((k) => { tcd[k] = tong(U, (u) => u[k]); });
  tcd.luotT = TTRA_MONTHS.map((_, m) => tong(U, (u) => u.luotT[m])); tcd.donT = TTRA_MONTHS.map((_, m) => tong(U, (u) => u.donT[m]));
  tcd.top = U.map((u) => [u.ten, u.daGq, u.ton, u.rut]).sort((a, b) => (b[1] + b[2] + b[3]) - (a[1] + a[2] + a[3])).slice(0, 15);
  return { kt: kt, tt: tt, tcd: tcd };
})();

/* ============================== SỞ KHOA HỌC VÀ CÔNG NGHỆ — CHỈ SỐ CHUYỂN ĐỔI SỐ CẤP XÃ THEO 3 EFORM ==============================

const KHCN_MONTHS = ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9'];

function khcnN(n, d) {
  if (n == null || !isFinite(n)) return '—';
  d = d || 0;
  const p = Math.abs(n).toFixed(d).split('.');
  return (n < 0 ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : '');
}
function khcnSum(a) { return a.reduce((s, v) => s + v, 0); }
function khcnPct(a, b, d) { return khcnN(b ? (a / b) * 100 : null, d == null ? 1 : d) + '%'; }
function khcnHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
function khcnR(name, key) { return (khcnHash(name + '|' + key) % 10000) / 10000; }

/* dân số giả lập: Hà Nội ~ 8,7 triệu người / 126 đơn vị; phường đông hơn xã */
/* dân số thật của phường/xã (js/core/xa-dan-so.js); thiếu file thì về số băm cũ */
function khcnDanSo(n) { return (typeof xaDanSoThat === 'function' && xaDanSoThat(n)) || Math.round((n.indexOf('Phường') === 0 ? 82000 : 58000) * (0.6 + 0.8 * khcnR(n, 'ds')) / 100) * 100; }
/* "hạng" số hóa của đơn vị trong [0, 1]: phường trung tâm cao, xã xa thấp */
function khcnHang(n) { return Math.max(0, Math.min(1, (n.indexOf('Phường') === 0 ? 0.68 : 0.42) + 0.3 * khcnR(n, 'hg') - (KHCN_XA_XA.indexOf(n) >= 0 ? 0.25 : 0))); }

/* diễn biến cả Thành phố T1 → T9 (tỷ lệ chuẩn, mỗi đơn vị lệch quanh mức này theo "hạng") */

const KHCN_UNITS = KHCN_DV.map((ten) => {
  const R = (k) => khcnR(ten, k), h = khcnHang(ten), ph = ten.indexOf('Phường') === 0, dan = khcnDanSo(ten);
  const ho = Math.round(dan / 3.1), ds15 = Math.round(dan * 0.79), ds14 = Math.round(dan * 0.8), dsTt = Math.round(dan * 0.77);

  /* ---- 1. hạ tầng (tháng 9) ---- */
  const ht = {
    ho: ho, hoCq: Math.round(ho * Math.min(0.995, 0.8 + 0.17 * h + 0.03 * R('cq'))),
    ds15: ds15, sm: Math.round(ds15 * Math.min(0.99, 0.9 + 0.08 * h + 0.01 * R('sm'))),
    cqTruSo: 0, giaoBan: R('gb') < (h > 0.3 ? 0.99 : 0.85) ? 0 : 1, wifi: R('wf') < 0.35 + 0.7 * h ? 0 : 1, dvc: R('dv') < 0.985 ? 0 : 1
  };
  /* ---- 2. con người (tháng 9) ---- */
  const cn = {
    dan: dan, dvctt: Math.round(dan * (0.3 + 0.28 * h + 0.04 * R('dc'))),
    ds14: ds14, dtdt: Math.round(ds14 * (0.82 + 0.13 * h + 0.03 * R('dt'))),

  const lech = (k) => (h - 0.55) * 0.32 + 0.1 * (R(k) - 0.5);
  const hsGoc = Math.round(dan / 30 * (0.85 + 0.3 * R('hs')));
  const thang = KHCN_MONTHS.map((_, m) => {
    const RM = (k) => R(k + m), hs = Math.round(hsGoc * (m === 1 ? 0.75 : 0.92 + 0.16 * RM('hm')));

    const vbNb = Math.round(dan / 45 * (0.9 + 0.2 * RM('vn'))), vbCq = Math.round(dan / 60 * (0.9 + 0.2 * RM('vc')));
    const cl = (v) => Math.max(0, Math.min(1, v));
    return {
      hs: hs, toanTrinh: Math.round(cl(KHCN_XU_HUONG.toanTrinh[m] + lech('tt')) * 1000) / 10,

}

function sxdN(n, d) {
  if (n == null || !isFinite(n)) return '—';
  d = d || 0;
  const p = Math.abs(n).toFixed(d).split('.');
  return (n < 0 ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : '');
}
function sxdSum(a) { return a.reduce((s, v) => s + v, 0); }
function sxdHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }

function sxdSplit(total, w) {
  const ws = sxdSum(w) || 1, raw = w.map((x) => total * x / ws), base = raw.map(Math.floor);
  raw.map((v, i) => [v - base[i], i]).sort((a, b) => b[0] - a[0]).slice(0, total - sxdSum(base)).forEach((x) => base[x[1]]++);
  return base;
}

     A. "Danh sách bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp" — bản ghi = «Địa bàn» (126 phường/xã) × «Mã chỉ tiêu»
        (5 mã: tỷ lệ tham gia BHTN, tỷ lệ tham gia BHXH, số người hưởng, thu, chi) × kỳ; mỗi bản ghi có «Tổng số đối tượng»,

     B. "Lao động Công chức viên chức" — bản ghi = «Địa bàn» × kỳ; 3 nhóm trường: lao động trên địa bàn; biên chế và biến động
        công chức, viên chức; cán bộ chuyển đổi số, kỹ năng số, chữ ký số.

   - 9 tháng 2025 Sở Nội vụ cấp, cấp lại, gia hạn giấy phép cho 8.009 lao động nước ngoài; cả nước 162.858 lao động nước ngoài (cuối 2025).
   - Từ 30/6/2025 toàn bộ cán bộ xử lý hồ sơ trên môi trường mạng và ký số.
   Số lao động Hà Nội đi làm việc ở nước ngoài và số lao động nước ngoài đang làm việc chưa thấy công bố → GIẢ ĐỊNH theo bậc độ lớn.

function snvSum(a) { return a.reduce((s, v) => s + v, 0); }
function snvHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
function snvR(name, key) { return (snvHash(name + '|' + key) % 10000) / 10000; }

/* địa bàn có khu công nghiệp, khu công nghệ cao lớn: nhiều lao động làm công ăn lương, nhiều lao động nước ngoài */
const SNV_KCN = ['Xã Quang Minh', 'Xã Nội Bài', 'Xã Hòa Lạc', 'Xã Phú Nghĩa', 'Xã Thạch Thất', 'Xã Đông Anh', 'Xã Kim Anh', 'Xã Thường Tín', 'Xã Phú Xuyên', 'Xã Mê Linh'];
/* phường trung tâm, nhiều văn phòng doanh nghiệp FDI */
const SNV_TT = ['Phường Cầu Giấy', 'Phường Ba Đình', 'Phường Hoàn Kiếm', 'Phường Tây Hồ', 'Phường Từ Liêm', 'Phường Yên Hòa', 'Phường Láng', 'Phường Xuân Phương', 'Phường Hai Bà Trưng', 'Phường Cửa Nam'];
/* xã miền núi, xa trung tâm */
const SNV_XA_XA = ['Xã Ba Vì', 'Xã Yên Bài', 'Xã Suối Hai', 'Xã Bất Bạt', 'Xã Yên Xuân', 'Xã Mỹ Đức', 'Xã Hương Sơn', 'Xã Phú Cát', 'Xã Trần Phú',
  'Xã Minh Châu', 'Xã Cổ Đô', 'Xã Hồng Sơn', 'Xã Phúc Sơn', 'Xã Đại Xuyên', 'Xã Chuyên Mỹ'];

const SNV_M = [0, 1, 2, 3, 4, 5, 6, 7, 8];
/* đơn vị tiền lưu TRIỆU ĐỒNG */
const SNV_UNITS = SNV_DV.map((ten) => {
  const R = (k) => snvR(ten, k), ph = ten.indexOf('Phường') === 0, kcn = SNV_KCN.indexOf(ten) >= 0, tt = SNV_TT.indexOf(ten) >= 0, xa = SNV_XA_XA.indexOf(ten) >= 0;
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  /* dân số thật của phường/xã (js/core/xa-dan-so.js); thiếu file thì về số băm cũ */
  const dan = (typeof xaDanSoThat === 'function' && xaDanSoThat(ten)) || Math.round((ph ? 82000 : 58000) * (0.6 + 0.8 * R('ds')) / 100) * 100;
  const llld = Math.round(dan * (0.55 + 0.03 * R('ll')));
  /* ---- 1. bảo hiểm: tỷ lệ tham gia tăng dần từ T1 đến T9 ---- */
  const bhxh9 = cl((ph ? 0.585 : 0.468) + 0.11 * (R('bx') - 0.5) + (kcn ? 0.09 : 0) + (tt ? 0.05 : 0) - (xa ? 0.08 : 0), 0.3, 0.8);
  const bhtnK = 0.84 + 0.06 * R('tn');
  const nguoiHuong = Math.round(dan * (ph ? 0.084 : 0.058) * (0.9 + 0.2 * R('nh')));
  const quaTk = cl(0.996 - (xa ? 0.03 : 0) - 0.008 * R('tk'), 0.9, 1);
  const thang = SNV_M.map((m) => {
    const RM = (k) => R(k + m), heSo = 0.968 + 0.032 * m / 8;
    const bhxh = Math.round(llld * bhxh9 * heSo), bhtn = Math.round(bhxh * bhtnK);
    /* thu: bình quân ~2,8 triệu đồng/người tham gia/tháng (gồm BHYT); tháng 2 (Tết) thấp hơn; đơn vị nợ đóng → thu đạt 92 – 99% */
    const phaiThu = Math.round(bhxh * 2.78 * (m === 1 ? 0.9 : 0.97 + 0.06 * RM('pt')));
    const daThu = Math.round(phaiThu * cl(0.955 + 0.035 * RM('dt') - (xa ? 0.02 : 0) + 0.002 * m, 0.9, 0.995));
    /* chi: bình quân ~7,3 triệu đồng/người hưởng/tháng (lương hưu, trợ cấp, chi khám chữa bệnh BHYT) */
    const phaiChi = Math.round(nguoiHuong * 7.3 * (0.96 + 0.08 * RM('pc')));
    const daChi = Math.round(phaiChi * (0.996 + 0.004 * RM('dc')));
    return { bhxh: bhxh, bhtn: bhtn, phaiThu: phaiThu, daThu: daThu, phaiChi: phaiChi, daChi: daChi };
  });
  const bh = { llld: llld, nguoiHuong: nguoiHuong, quaTk: Math.round(nguoiHuong * quaTk), thang: thang, soThon: Math.round((ph ? 22 : 30) + 18 * R('th')) };
  /* ---- 2. lao động: «Số lao động đạt» hiểu là lao động đã qua đào tạo ---- */
  const ld = {
    llld: llld, daoTao: Math.round(llld * cl((ph ? 0.805 : 0.725) + 0.06 * (R('dt') - 0.5) - (xa ? 0.05 : 0) + (kcn ? 0.02 : 0), 0.55, 0.9)),
    /* đi làm việc ở nước ngoài theo hợp đồng trong tháng: chủ yếu lao động xã ngoại thành */
    diNn: SNV_M.map((m) => Math.floor((ph ? 0.6 : (xa ? 2.4 : 3.3)) * (0.5 + R('xk')) * (m === 1 ? 0.5 : 1) + snvR(ten, 'xm' + m))),
    /* lao động nước ngoài đang làm việc (thời điểm): dồn ở phường trung tâm và địa bàn có khu công nghiệp */
    nuocNgoai: Math.round((tt ? 650 : kcn ? 1100 : ph ? 90 : 20) * (0.5 + R('nn')))
  };
  /* ---- 3. biên chế công chức, viên chức cấp xã (thời điểm) và biến động trong tháng ---- */
  const giao = Math.round((ph ? 73 : 66) + 13 * R('bg'));
  const thucHien = Math.round(giao * cl(0.935 + 0.06 * R('th2'), 0.9, 1));
  const huongLuong = thucHien - (R('hl') < 0.3 ? 1 : 0);
  const bd = (k, lam) => SNV_M.map((m) => Math.floor(lam + snvR(ten, k + m)));
  const bc = { giao: giao, thucHien: thucHien, huongLuong: huongLuong,
    tuyen: SNV_M.map((m) => (m === 5 || m === 6 || m === 7) ? Math.floor(0.5 + 1.2 * snvR(ten, 'tm' + m)) : Math.floor(0.12 + snvR(ten, 'tm' + m))),
    huu: bd('hu', 0.14), thoiViec: bd('tv', 0.17 + 0.06 * R('tv0')), chuyen: bd('ct', 0.27) };
  /* ---- 4. cán bộ chuyển đổi số, kỹ năng số, chữ ký số (tổng = công chức, viên chức thực hiện) ---- */
  const lechCds = (ph ? 0.03 : -0.01) - (xa ? 0.05 : 0) + 0.04 * (R('ks') - 0.5);
  const cds = {
    dvCds: R('dc1') < 0.05 ? 0 : (R('dc2') < 0.55 ? 1 : 2), dvAntt: R('da1') < (xa ? 0.45 : 0.2) ? 0 : 1,
    thang: SNV_M.map((m) => {
      const kns = cl(0.78 + 0.14 * m / 8 + lechCds, 0.5, 1), cks = cl(0.968 + 0.022 * m / 8 + lechCds * 0.3, 0.8, 1);
      return { tong: thucHien, kns: Math.round(thucHien * kns), cks: Math.round(thucHien * cks) };
    })
  };
  return { ten: ten, phuong: ph, dan: dan, bh: bh, ld: ld, bc: bc, cds: cds };
});

/* ---------- Số tổng hợp ---------- */
const SNV_SUM = (function () {
  const U = SNV_UNITS, t = (f) => snvSum(U.map(f)), cnt = (f) => U.filter(f).length, Q9 = 8;
  const th = (f) => SNV_M.map((m) => t((u) => f(u, m)));
  const nhom = (g, f) => [U.filter((u) => u.phuong), U.filter((u) => !u.phuong)].map(f);
  const top = (f, n, asc) => U.map((u) => [u.ten, f(u)]).sort((a, b) => asc ? a[1] - b[1] : b[1] - a[1]).slice(0, n || 10);
  const xep = (rows, g) => g.map((x, i) => [x[0], rows.filter((r) => r[1] >= x[1] && (i === 0 || r[1] < g[i - 1][1])).length, x[2]]);
  /* 1. bảo hiểm */
  const bhxhT = th((u, m) => u.bh.thang[m].bhxh), bhtnT = th((u, m) => u.bh.thang[m].bhtn);
  const ptT = th((u, m) => u.bh.thang[m].phaiThu), dtT = th((u, m) => u.bh.thang[m].daThu), pcT = th((u, m) => u.bh.thang[m].phaiChi), dcT = th((u, m) => u.bh.thang[m].daChi);
  const llld = t((u) => u.bh.llld);
  const tlBhxh = U.map((u) => [u.ten, u.bh.thang[Q9].bhxh / u.bh.llld * 100]);
  const bh = {
    llld: llld, bhxh: bhxhT[Q9], bhtn: bhtnT[Q9], nguoiHuong: t((u) => u.bh.nguoiHuong), quaTk: t((u) => u.bh.quaTk),
    phaiThu: snvSum(ptT), daThu: snvSum(dtT), phaiChi: snvSum(pcT), daChi: snvSum(dcT),
    ptT: ptT, dtT: dtT, pcT: pcT, dcT: dcT,
    xuHuong: [bhxhT.map((v) => v / llld * 100), bhtnT.map((v) => v / llld * 100)],
    cap: nhom(0, (g) => [snvSum(g.map((u) => u.bh.thang[Q9].bhxh)) / snvSum(g.map((u) => u.bh.llld)) * 100, snvSum(g.map((u) => u.bh.thang[Q9].bhtn)) / snvSum(g.map((u) => u.bh.llld)) * 100]),
    nhom: xep(tlBhxh, [['Từ 60% trở lên', 60, '#1baf7a'], ['Từ 45% đến dưới 60%', 45, '#2a78d6'], ['Dưới 45%', 0, '#eda100']]),
    thap: tlBhxh.slice().sort((a, b) => a[1] - b[1]).slice(0, 10),
    soThon: t((u) => u.bh.soThon)
  };
  /* 2. lao động */
  const diT = th((u, m) => u.ld.diNn[m]);
  const ld = {
    llld: t((u) => u.ld.llld), daoTao: t((u) => u.ld.daoTao), diNn: snvSum(diT), diT: diT, nuocNgoai: t((u) => u.ld.nuocNgoai),
    cap: nhom(0, (g) => snvSum(g.map((u) => u.ld.daoTao)) / snvSum(g.map((u) => u.ld.llld)) * 100),
    diTop: top((u) => snvSum(u.ld.diNn)), nnTop: top((u) => u.ld.nuocNgoai),
    dtThap: top((u) => u.ld.daoTao / u.ld.llld * 100, 10, true)
  };
  /* 3. biên chế */
  const tuyenT = th((u, m) => u.bc.tuyen[m]), huuT = th((u, m) => u.bc.huu[m]), tvT = th((u, m) => u.bc.thoiViec[m]), ctT = th((u, m) => u.bc.chuyen[m]);
  const tlBc = U.map((u) => [u.ten, u.bc.thucHien / u.bc.giao * 100]);
  const bc = {
    giao: t((u) => u.bc.giao), thucHien: t((u) => u.bc.thucHien), huongLuong: t((u) => u.bc.huongLuong),
    tuyen: snvSum(tuyenT), huu: snvSum(huuT), thoiViec: snvSum(tvT), chuyen: snvSum(ctT),
    tuyenT: tuyenT, giamT: [huuT, tvT, ctT],
    nhom: xep(tlBc, [['Từ 98% trở lên', 98, '#1baf7a'], ['Từ 95% đến dưới 98%', 95, '#2a78d6'], ['Dưới 95%', 0, '#eda100']]),
    thieu: top((u) => u.bc.giao - u.bc.thucHien)
  };
  /* 4. chuyển đổi số */
  const tongT = th((u, m) => u.cds.thang[m].tong), knsT = th((u, m) => u.cds.thang[m].kns), cksT = th((u, m) => u.cds.thang[m].cks);
  const cds = {
    tong: tongT[Q9], kns: knsT[Q9], cks: cksT[Q9],
    dvCds: t((u) => u.cds.dvCds), dvAntt: t((u) => u.cds.dvAntt),
    tieuChi: [['Có công chức, viên chức chuyên trách chuyển đổi số', cnt((u) => u.cds.dvCds > 0)], ['Có công chức, viên chức chuyên trách an toàn thông tin mạng', cnt((u) => u.cds.dvAntt > 0)]],
    xuHuong: [knsT.map((v, m) => v / tongT[m] * 100), cksT.map((v, m) => v / tongT[m] * 100)],
    thap: top((u) => u.cds.thang[Q9].kns / u.cds.thang[Q9].tong * 100, 10, true)
  };
  return { bh: bh, ld: ld, bc: bc, cds: cds };
})();

/* ---------- Mô tả 4 chỉ tiêu (dùng cho tài liệu; khối "Cách tính" trên giao diện đang ẩn) ---------- */
const SNV_EFORM_A = 'Danh sách bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp';
const SNV_EFORM_B = 'Lao động Công chức viên chức';
const SNV_CT = [

  { key: 'ld', name: 'Lao động, việc làm trên địa bàn', eform: SNV_EFORM_B, ky: SNV_KY, freq: 'Tháng', soBanGhi: SNV_DV.length },

/* ---------- Dòng chỉ tiêu cho categorySeed (central-level.js) ---------- */
function snvPart(dim, type, rows) { return { dim: dim, type: type, items: rows.map((r) => ({ label: r[0], value: r[1] })) }; }
const SNV_ITEMS = (function () {
  const S = SNV_SUM, src = 'Eform Sở Nội vụ (giả lập)', r1 = (v) => Math.round(v * 10) / 10;
  const parts = {
    bh: [snvPart('Tỷ lệ tham gia (%)', 'stat', [['Bảo hiểm xã hội', r1(S.bh.bhxh / S.bh.llld * 100)], ['Bảo hiểm thất nghiệp', r1(S.bh.bhtn / S.bh.llld * 100)]])],
    ld: [snvPart('Lao động', 'stat', [['Lao động qua đào tạo (%)', r1(S.ld.daoTao / S.ld.llld * 100)], ['Đi làm việc ở nước ngoài, 9 tháng (người)', S.ld.diNn], ['Lao động nước ngoài đang làm việc (người)', S.ld.nuocNgoai]])],
    bc: [snvPart('Biên chế (người)', 'stat', [['Được giao', S.bc.giao], ['Thực hiện', S.bc.thucHien], ['Hưởng lương', S.bc.huongLuong]])],

   Nguồn: "File mô tả đầu vào eform" (Google Sheets, sheet "Sở Y tế"), 4 eform → 4 chỉ tiêu (1 eform = 1 chỉ tiêu):

   - Ngộ độc thực phẩm: cả nước năm 2025 84 vụ, 2.301 người mắc; quý I/2026 36 vụ. Số riêng của Hà Nội chưa thấy công bố
     → GIẢ ĐỊNH 6 vụ trong 9 tháng (bếp ăn tập thể, trường học, cỗ, thức ăn đường phố, nấm rừng, rượu).
   Nạp TRƯỚC central-level.js (central-level.js dùng SYT_ITEMS). Không dùng hàm nào của file khác. */

const SYT_KY = 'Tháng 9/2026';
const SYT_MONTHS = ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9'];
const SYT_M = [0, 1, 2, 3, 4, 5, 6, 7, 8];

function sytSum(a) { return a.reduce((s, v) => s + v, 0); }
function sytHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
function sytR(name, key) { return (sytHash(name + '|' + key) % 10000) / 10000; }
/* chia một tổng cho các đơn vị theo trọng số, làm tròn theo phần dư lớn nhất → cộng lại đúng bằng tổng */
function sytSplit(total, w) {
  const sw = sytSum(w) || 1, raw = w.map((x) => total * x / sw), fl = raw.map(Math.floor);
  let du = total - sytSum(fl);
  raw.map((x, i) => [x - fl[i], i]).sort((a, b) => b[0] - a[0]).forEach((x) => { if (du > 0) { fl[x[1]]++; du--; } });
  return fl;
}

/* ---------- Dân số và số thôn/TDP từng phường/xã (dân số gồm cả người tạm trú, ~8,9 triệu) ---------- */
const SYT_UNITS = SYT_DV.map((ten) => {
  const R = (k) => sytR(ten, k), ph = ten.indexOf('Phường') === 0, xa = SYT_XA_XA.indexOf(ten) >= 0;
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  /* cùng khóa băm với khcn/snv-config.js để dân số và số thôn khớp giữa các sở (nhân hệ số gồm người tạm trú) */
  /* dân số thật của phường/xã (js/core/xa-dan-so.js) — cột Dân số bảng 126 xã khớp mẫu số tỷ lệ; thiếu file thì về số băm cũ */
  const dan = (typeof xaDanSoThat === 'function' && xaDanSoThat(ten)) || Math.round((ph ? 82000 : 58000) * (0.6 + 0.8 * R('ds')) / 100) * 100;
  /* số băm cũ cộng thêm người tạm trú; dân số thật dùng nguyên số để mẫu số tỷ lệ đúng bằng cột Dân số của bảng 126 xã */
  const danTT = typeof xaDanSoThat === 'function' && xaDanSoThat(ten) ? dan : Math.round(dan * (ph ? 1.04 : 1.015));
  const soThon = Math.round((ph ? 22 : 30) + 18 * R('th'));
  /* 2. BHYT: phường thấp hơn (lao động tự do, người tạm trú), xã miền núi cao (ngân sách hỗ trợ) */
  const bhyt9 = cl((ph ? 0.957 : 0.968) + 0.016 * (R('bh') - 0.5) + (xa ? 0.018 : 0), 0.93, 0.995);
  const bhyt = SYT_M.map((m) => Math.round(danTT * cl(bhyt9 - 0.0045 * (8 - m) / 8 * (0.7 + 0.6 * R('bt')), 0.9, 0.998)));
  /* 4. hồ sơ sức khỏe điện tử: tăng nhanh đầu năm, gần 99% cuối quý II, đạt ~99,4% tháng 9 */
  const lechHs = (ph ? 0.003 : -0.002) - (xa ? 0.012 : 0) + 0.008 * (R('hs') - 0.5);
  const XH = [0.935, 0.946, 0.956, 0.965, 0.974, 0.985, 0.989, 0.992, 0.994];
  const hssk = SYT_M.map((m) => Math.round(danTT * cl(XH[m] + lechHs * (1 + (8 - m) / 8), 0.85, 1)));
  return { ten: ten, phuong: ph, dan: danTT, soThon: soThon, bhyt: bhyt, hssk: hssk };
});

/* ---------- 3. Dịch bệnh nhóm A, B: tổng Thành phố theo tháng, chia về phường/xã theo trọng số ---------- */
/* [tên bệnh, nhóm, số ca T1 – T9, tỷ lệ ca nặng, số tử vong, màu, kiểu phân bố] */
const SYT_BENH = [
  ['Tay chân miệng', 'B', [160, 120, 210, 380, 600, 820, 1100, 980, 1150], 0.025, 0, '#2a78d6', 'deu'],
  ['Sốt xuất huyết', 'B', [40, 25, 20, 18, 25, 40, 120, 450, 1100], 0.02, 0, '#d33a44', 'sxh'],

  ['Ho gà', 'B', [1, 1, 1, 0, 2, 1, 1, 0, 1], 0.25, 0, '#1baf7a', 'xa'],
  ['Liên cầu lợn', 'B', [0, 0, 0, 1, 0, 1, 1, 0, 0], 1, 1, '#898781', 'xa'],
  ['Dại', 'B', [0, 0, 1, 0, 0, 1, 0, 0, 0], 1, 2, '#4a3aa7', 'xa']
];
const SYT_DICH = (function () {
  const U = SYT_UNITS;
  const wt = (u, kieu, b) => u.dan * (kieu === 'sxh' ? (SYT_SXH.indexOf(u.ten) >= 0 ? 6 : u.phuong ? 1.4 : sytR(u.ten, 'sx') < 0.25 ? 0 : 0.35) : kieu === 'pho' ? (u.phuong ? 1.5 : 0.7) : kieu === 'xa' ? (u.phuong ? 0.2 : 1.2) : 1)
    * (0.4 + 1.2 * sytR(u.ten, 'd' + b));
  /* ca[benh][thang][donVi] */
  const ca = SYT_BENH.map((b, bi) => SYT_M.map((m) => sytSplit(b[2][m], U.map((u) => wt(u, b[6], bi) * (0.6 + 0.8 * sytR(u.ten, 'dm' + bi + '_' + m))))));
  /* ca nặng, tử vong: chia theo số ca của từng đơn vị trong cả kỳ */
  const caDv = ca.map((b) => U.map((_, i) => sytSum(b.map((t) => t[i]))));
  const nang = SYT_BENH.map((b, bi) => sytSplit(Math.round(sytSum(b[2]) * b[3]), caDv[bi]));
  const tuVong = SYT_BENH.map((b, bi) => sytSplit(b[4], caDv[bi].map((v, i) => v ? v * (1 + sytR(U[i].ten, 'tv' + bi)) : 0)));
  /* số bản ghi: mỗi bệnh có ca tại một phường/xã trong tháng → số thôn/TDP có ca (ước tính theo số ca) */
  let banGhi = 0;
  ca.forEach((b) => b.forEach((t) => t.forEach((v, i) => { if (v) banGhi += Math.min(v, Math.max(1, Math.round(U[i].soThon * 0.35))); })));
  return { ca: ca, caDv: caDv, nang: nang, tuVong: tuVong, banGhi: banGhi };
})();

/* ---------- 1. Ngộ độc thực phẩm: danh sách vụ việc 9 tháng 2026 (GIẢ ĐỊNH) ---------- */

const SYT_NGO_DOC = [

/* ---------- Số tổng hợp ---------- */
const SYT_SUM = (function () {
  const U = SYT_UNITS, D = SYT_DICH, Q9 = 8, t = (f) => sytSum(U.map(f));
  const top = (rows, n, asc) => rows.slice().sort((a, b) => asc ? a[1] - b[1] : b[1] - a[1]).slice(0, n || 10);
  const xep = (rows, g) => g.map((x, i) => [x[0], rows.filter((r) => r[1] >= x[1] && (i === 0 || r[1] < g[i - 1][1])).length, x[2]]);
  const nhomPx = (f) => [U.filter((u) => u.phuong), U.filter((u) => !u.phuong)].map((g) => sytSum(g.map((u) => f(u))) / sytSum(g.map((u) => u.dan)) * 100);
  /* 1. ngộ độc */
  const N = SYT_NGO_DOC, nhNg = ['Vi sinh vật', 'Độc tố tự nhiên', 'Hóa chất', 'Chưa rõ'];
  const nd = {
    vu: N.length, mac: sytSum(N.map((v) => v[4])), nang: sytSum(N.map((v) => v[5])), tuVong: sytSum(N.map((v) => v[6])),
    vuLon: N.filter((v) => v[4] >= 30).length,
    thangVu: SYT_M.map((m) => N.filter((v) => v[2] === m + 1).length), thangMac: SYT_M.map((m) => sytSum(N.filter((v) => v[2] === m + 1).map((v) => v[4]))),
    nguyenNhan: nhNg.map((g, i) => [g, sytSum(N.filter((v) => v[8] === g).map((v) => v[4])), ['#2a78d6', '#1baf7a', '#d33a44', '#898781'][i]]).filter((r) => r[1] > 0),
    dsVu: N.map((v) => [v[0] + ' — ' + v[1], v[4], v[5], v[6]])
  };
  /* 2. BHYT */
  const bhT = SYT_M.map((m) => t((u) => u.bhyt[m])), dan = t((u) => u.dan);
  const tlBh = U.map((u) => [u.ten, u.bhyt[Q9] / u.dan * 100]);
  const bh = {
    dan: dan, bhyt: bhT[Q9], xuHuong: bhT.map((v) => v / dan * 100), chiTieu: 96.25, cap: nhomPx((u) => u.bhyt[Q9]),
    nhom: xep(tlBh, [['Từ 97% trở lên', 97, '#1baf7a'], ['Từ 95% đến dưới 97%', 95, '#2a78d6'], ['Dưới 95%', 0, '#eda100']]),
    datCt: tlBh.filter((r) => r[1] >= 96.25).length, thap: top(tlBh, 10, true), chua: dan - bhT[Q9]
  };
  /* 3. dịch bệnh */
  const caBenh = SYT_BENH.map((b) => sytSum(b[2]));
  const caTong = U.map((_, i) => sytSum(D.caDv.map((b) => b[i])));
  const dich = {
    ca: sytSum(caBenh), nang: sytSum(D.nang.map(sytSum)), tuVong: sytSum(D.tuVong.map(sytSum)), nhomA: 0,
    benh: SYT_BENH.map((b, i) => [b[0], caBenh[i], b[5], sytSum(D.nang[i]), sytSum(D.tuVong[i])]),
    thang: SYT_BENH.map((b) => b[2]), caT9: sytSum(SYT_BENH.map((b) => b[2][Q9])),
    dvCo: caTong.filter((v) => v > 0).length, sxhDv: D.caDv[1].filter((v) => v > 0).length,
    sxhTop: top(U.map((u, i) => [u.ten, D.caDv[1][i]]), 10), tcmTop: top(U.map((u, i) => [u.ten, D.caDv[0][i]]), 10),
    banGhi: D.banGhi
  };
  /* 4. hồ sơ sức khỏe điện tử */
  const hsT = SYT_M.map((m) => t((u) => u.hssk[m]));
  const tlHs = U.map((u) => [u.ten, u.hssk[Q9] / u.dan * 100]);
  const hs = {
    dan: dan, hssk: hsT[Q9], xuHuong: hsT.map((v) => v / dan * 100), cap: nhomPx((u) => u.hssk[Q9]),
    nhom: xep(tlHs, [['Từ 99,5% trở lên', 99.5, '#1baf7a'], ['Từ 98% đến dưới 99,5%', 98, '#2a78d6'], ['Dưới 98%', 0, '#eda100']]),
    thap: top(tlHs, 10, true), chua: dan - hsT[Q9]
  };

/* ---------- Dựng cây chỉ tiêu ---------- */
function stcApplyRows(n, keys, api, match, measure, ctx) {
  const set = {};

    const field = match === 'chiTieu' ? r.chiTieu : r.loai;
    if (!set[stcNorm(field)]) return;

      else { ctx.odd.push(r.chiTieu + ' / ' + r.loai); }

    } else if (measure === 'cmp') {

function stcBuildNode(spec, inh, ctx) {

    neutral: spec.neutral != null ? spec.neutral : !!inh.neutral,

    apiLabel: (spec.keys && spec.keys[0]) || (spec.totalKeys && spec.totalKeys[0]) || spec.label,
    now: null, prev: null, ck: null, cmp: null, derivedCk: false, rows: [], kids: []

    n.kids.push(stcBuildNode(k, { api: api, match: match, measure: measure, unit: n.unit, neutral: n.neutral, kind: n.kind }, ctx));
  });

    if (n.prev == null && n.kids.every((k) => k.prev != null)) n.prev = n.kids.reduce((a, k) => a + k.prev, 0);
    /* Tổng của các thành phần chỉ có chỉ số cùng kỳ: suy ra mức tăng chung từ các thành phần (giả định chỉ số lấy 100 làm mốc) */

      const pd = n.kids.reduce((a, k) => a + k.now / (k.ck / 100), 0);

function stcBuildIndicator(spec, data) {
  const ctx = { data: data, used: {}, matched: 0, odd: [] };
  const root = stcBuildNode(spec, {}, ctx);
  root.group = spec.group; root.view = spec.view;
  const apis = Object.keys(stcCollectApis(spec, {}));
  root.apis = apis;
  const unmatched = ctx.odd.slice();
  apis.forEach((api) => {
    if (!Array.isArray(data[api])) { unmatched.push('thiếu API ' + api); return; }
    data[api].forEach((r, i) => { if (!(ctx.used[api] && ctx.used[api][i])) unmatched.push(r.chiTieu + ' / ' + r.loai); });
  });

  stcWalk(root, (n) => { ['now', 'prev', 'ck', 'cmp'].forEach((f) => { if (n[f] != null && !n.derivedCk) vals.push(n[f]); }); });
  root.state = ctx.matched === 0 ? 'missing' : (vals.every((v) => v === 0) ? 'nodata' : 'ok');

/* ---------- Phép tính từ số API ---------- */
/* Hai cách so sánh (từ 2026-10-02 hiện cả hai):

  if (n.kind === 'pct' || n.kind === 'idx') return n.now - n.kq;

/* Mức thay đổi so với cùng kỳ năm trước. null nếu không tính được. */
function stcDeltaCq(n) {

  res.inds.forEach((ind) => stcWalk(ind, (n) => {
    n.kqLbl = kqLbl; n.cqLbl = cqLbl;
    n.kq = valIn(rK, n.id);
    n.cq = null; n.cqSrc = null;
    if (n.prev != null) { n.cq = n.prev; n.cqSrc = 'api'; }

function stcCheckQuality(res) {

    if (ind.kind === 'add' && ind.kids.length && ind.now != null && ind.kids.every((k) => k.now != null)) {
      const s = ind.kids.reduce((a, k) => a + k.now, 0);
      if (Math.abs(s - ind.now) > 0.5) ind.warns.push('Tổng ' + ind.kids.length + ' khoản (' + stcFmt(s) + ') lệch ' + stcFmt(s - ind.now) + ' so với dòng tổng của API (' + stcFmt(ind.now) + ')');
    }
    /* Chỉ số nằm ngoài khoảng giả định */
    stcWalk(ind, (n) => {
      const list = [];
      if (n.kind === 'idx' && n.now > 0) list.push(n.now);
      if (n.ck > 0 && !n.derivedCk) list.push(n.ck);
      list.forEach((v) => { if (v < ck[0] || v > ck[1]) ind.warns.push('"' + n.label + '": giá trị ' + stcFmt(v, 1) + ' ngoài khoảng dự kiến ' + ck[0] + '–' + ck[1] + ' của chỉ số lấy 100 làm mốc; API có thể đang trả % tăng, cần xác nhận với Sở Tài chính'); });
    });
  });
  /* Bán lẻ là một phần của bán ra */
  const bra = res.byId.bra, ble = res.byId.ble;
  if (bra && ble && bra.state === 'ok' && ble.state === 'ok' && bra.now != null && ble.now != null && ble.now > bra.now) {
    ble.warns.push('Tổng mức bán lẻ (' + stcFmt(ble.now) + ') lớn hơn tổng mức bán ra (' + stcFmt(bra.now) + '), trong khi bán lẻ là một phần của bán ra');
  }
}

/* ---------- Dựng toàn bộ một kỳ ---------- */
function stcBuildPeriod(year, period) {
  const key = (STC_DEMO_ON ? 'demo:' : '') + year + '-' + period;
  if (STC_CACHE[key]) return STC_CACHE[key];
  const snap = stcSnapshotObj();
  const pd = snap && snap.periods && snap.periods[year + '-' + period];
  if (!pd) return null;
  const res = { year: year, period: period, importedAt: pd.importedAt, source: pd.source, demo: STC_DEMO_ON, inds: [], byId: {}, rootOf: {}, groups: [] };
  STC_INDICATORS.forEach((spec) => {
    const ind = stcBuildIndicator(spec, pd.data || {});
    res.inds.push(ind);
    stcWalk(ind, (n) => { res.byId[n.id] = n; res.rootOf[n.id] = ind; });
  });
  STC_GROUPS.forEach((g) => { res.groups.push({ id: g.id, label: g.label, inds: g.inds.map((id) => res.byId[id]).filter(Boolean) }); });
  stcCheckQuality(res);
  STC_CACHE[key] = res;      // đặt cache TRƯỚC khi gắn số so sánh: stcAttachCompare chỉ dựng các kỳ cũ hơn nên không lặp vòng
  stcAttachCompare(res);
  return res;
}

/* Chuỗi hiển thị thời điểm chụp: "21/09/2026 15:22" */
function stcStampText(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  const p2 = (x) => (x < 10 ? '0' : '') + x;
  return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}

/* Chế độ thử: nạp sớm dữ liệu thử, xong thì vẽ lại lưới chỉ tiêu (thẻ xem trước dùng bản chụp). */
if (STC_DEMO_ON && typeof document !== 'undefined') {
  stcEnsureReady().then(() => { try { if (typeof renderIndicators === 'function') renderIndicators(); } catch (e) { /* bỏ qua */ } });
}
/* ===== js/features/dashboard-stc.js ===== */
/* ============================== SỞ TÀI CHÍNH — FORM CHỈ TIÊU MỚI ==============================
   Form riêng cho Sở Tài chính, hiển thị trong popup chuẩn của IOC (#modal), 6 màn hình: Trang chủ, 4 màn nhóm, Chi tiết theo cấp bậc (kiểu A).
   Dữ liệu: stc-data.js (bản chụp API). Không có số nào gõ cứng ở đây: mọi con số đến từ bản chụp (hoặc dữ liệu thử ?stcdemo=1).
   Mọi lớp CSS có tiền tố stc- (css/stc.css). Cần: esc() từ helpers.js. */

const STC_UI = { open: false, screen: 'home', group: 'ns', ind: 'chi', pick: null, focus: null, dd: null, zoom: null, role: null, year: null, period: null, loading: false, error: false };
/* Không hiện mã kỹ thuật trên giao diện (tên trường chiTieu/loai/giaTri/quy, tên API): false = ghi bằng lời. Bật true khi cần đối soát với nhóm kỹ thuật. */
const STC_SHOW_TECH = false;
/* câu chữ theo cờ: bản kỹ thuật (nhắc API, lệnh nạp kỳ) hoặc bản ghi bằng lời */
function stcT(tech, plain) { return STC_SHOW_TECH ? tech : plain; }
const STC_PAL = ['var(--s1)','var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];
const STC_ICON_INFO = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>';

const STC_ICON_REFRESH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>';

/* ---------- Tiện ích hiển thị ---------- */
function stcE(s) { return typeof esc === 'function' ? esc(s) : String(s == null ? '' : s); }
function stcRes() { return (STC_UI.year && STC_UI.period) ? stcBuildPeriod(STC_UI.year, STC_UI.period) : null; }
function stcQ(y, p) { return 'Q' + p + '/' + y; }
function stcInd(res, id) { return res.byId[id]; }
function stcShare(n, parent) { return (parent && parent.kind === 'add' && parent.now > 0 && n.now != null) ? (n.now / parent.now) * 100 : null; }
function stcVal(n) {
  if (n.now == null) return '—';
  if (n.kind === 'pct') return stcFmt(n.now) + '%';
  if (n.kind === 'idx') return stcFmt(n.now, 1);
  return stcFmt(n.now);
}
/* Chú thích khi rê chuột vào một mũi tên tăng/giảm. which: 'kq' = so kỳ trước (quý liền trước), 'cq' = so cùng kỳ năm trước. */
function stcDlTip(n, which, v) {
  const isK = which === 'kq', u = stcDeltaUnit(n, which), base = isK ? n.kq : n.cq, lbl = isK ? n.kqLbl : n.cqLbl;
  const L = [(isK ? 'So kỳ trước' : 'So cùng kỳ') + ': so với ' + (isK ? 'quý liền trước' : 'cùng quý năm trước') + (lbl ? ' (' + lbl + ')' : '') + '.'];
  if (v == null) {
    L.push(isK ? (n.kind === 'idx' && n.now > 0 ? 'Chưa có số của quý liền trước nên chưa so được.' : 'Chưa có số liệu của quý liền trước nên chưa so được.') : 'Nguồn số liệu chưa có số cùng kỳ năm trước cho mục này.');
    return L.join('\n');
  }
  const fv = (x) => (n.kind === 'pct' ? stcFmt(x) + '%' : stcFmt(x, n.kind === 'idx' ? 1 : Math.round(x) === x ? 0 : 1));
  const other = isK ? 'quý trước' : 'cùng kỳ';
  if (n.kind === 'idx' && !isK) L.push('Chỉ số đã lấy cùng kỳ năm trước làm mốc 100, nên mức tăng = ' + stcFmt(n.now, 1) + ' − 100 = ' + stcSgn(v, 1) + '%.');
  else if (u === '%' && base != null) L.push('Cách tính: (kỳ này ÷ ' + other + ' − 1) × 100 = (' + fv(n.now) + ' ÷ ' + fv(base) + ' − 1) × 100 = ' + stcSgn(v, 1) + '%.');
  else if (u === '%') L.push('Lấy theo chỉ số so cùng kỳ của nguồn số liệu: ' + stcFmt(n.ck, 1) + ' − 100 = ' + stcSgn(v, 1) + '%.');
  else L.push('Đơn vị "' + u + '": lấy kỳ này TRỪ thẳng ' + other + ' = ' + fv(n.now) + ' − ' + fv(base) + ' = ' + stcSgn(v, 1) + ' ' + u + '.' + (u === 'điểm %' ? ' Không phải tăng ' + stcFmt(Math.abs(v), 1) + '%.' : ''));
  if (!isK && n.cqSrc === 'ck') L.push('Số cùng kỳ được suy ra từ chỉ số so cùng kỳ (giả định chỉ số lấy 100 làm mốc).');
  L.push(n.neutral ? 'Tăng hay giảm không tự thân tốt/xấu nên tô màu trung tính.' : 'Tăng tô xanh, giảm tô đỏ.');
  return L.join('\n');
}
/* Một mũi tên tăng/giảm. withRef: ghi kèm chữ "so kỳ trước"/"so cùng kỳ". Không tính được thì hiện "—" (vẫn có chú thích). */
function stcDlOne(n, which, withRef) {
  const v = which === 'kq' ? stcDeltaKq(n) : stcDeltaCq(n);
  const ref = withRef ? ' <span class="stc-ref">' + (which === 'kq' ? 'so kỳ trước' : 'so cùng kỳ') + '</span>' : '';
  const tip = ' title="' + stcE(stcDlTip(n, which, v)) + '"';
  if (v == null) return '<span class="stc-dl na"' + tip + '>—' + ref + '</span>';
  const cls = v > 0.0499 ? 'up' : v < -0.0499 ? 'down' : 'flat';
  const neutral = n.neutral && cls !== 'flat' ? ' n' : '';
  const u = stcDeltaUnit(n, which);
  const txt = cls === 'flat' ? 'Không đổi' : stcFmt(Math.abs(v), 1) + (u === '%' ? '%' : ' ' + u);
  return '<span class="stc-dl ' + cls + neutral + '"' + tip + '>' + txt + ref + '</span>';
}
/* Mũi tên tăng/giảm: hiện CẢ HAI cách so (kỳ trước và cùng kỳ), xếp chồng. Xanh/đỏ chỉ khi chỉ tiêu có "chiều tốt";
   chi, nhập khẩu, giá dùng màu trung tính. Không cách nào tính được thì trả ''. */
function stcDl(n, withRef) {
  if (stcDeltaKq(n) == null && stcDeltaCq(n) == null) return '';
  return '<span class="stc-dlp">' + stcDlOne(n, 'kq', true) + stcDlOne(n, 'cq', true) + '</span>';
}
/* Có cột so sánh nào tính được trong danh sách mục không */
function stcHasCmp(list) { return list.some((k) => stcDeltaKq(k) != null || stcDeltaCq(k) != null); }
function stcBtnLnk(label, act) { return '<button type="button" class="stc-lnk" onclick="' + act + '">' + stcE(label) + '</button>'; }
function stcEmptyBox(title, text) { return '<div class="stc-empty">' + STC_ICON_DB + '<b>' + stcE(title) + '</b><span style="font-size:12px;max-width:360px">' + stcE(text) + '</span></div>'; }
function stcNote(html) { return '<div class="stc-note">' + STC_ICON_INFO + '<div>' + html + '</div></div>'; }

/* Bản "khung" của chỉ tiêu chưa có số: giữ nguyên cấu trúc (nhãn, đơn vị, phân cấp), mọi giá trị = null để hiện "—".
   Chỉ dùng để vẽ khung thiết kế; không bao giờ điền số thay thế. */
function stcBlank(n) {
  return Object.assign({}, n, { now: null, prev: null, ck: null, cmp: null, kq: null, cq: null, cqSrc: null, derivedCk: false, state: 'blank', kids: (n.kids || []).map(stcBlank) });
}

}
function stcStateBody(ind, res) {
  if (ind.state === 'nodata') return stcEmptyBox('Chưa có số liệu từ Sở Tài chính', '' + stcT('API trả toàn bộ giá trị bằng 0 cho ', 'Sở Tài chính đang báo toàn bộ giá trị bằng 0 cho ') + '' + stcQ(res.year, res.period) + ', nên form không vẽ biểu đồ rỗng.');
  if (ind.state === 'missing') return stcEmptyBox('Không nhận diện được dữ liệu', 'Bản chụp không có dòng nào khớp với chỉ tiêu này' + (STC_SHOW_TECH ? ' (API ' + ind.apis.join(', ') + ')' : '') + '.');

}

function stcYears() {
  const set = {};
  stcPeriods().forEach((p) => { set[p.year] = true; });
  const cy = new Date().getFullYear();
  set[cy] = true; set[cy - 1] = true;
  return Object.keys(set).map(Number).sort((a, b) => b - a);
}
/* Hộp chọn tự dựng (thay <select> gốc của trình duyệt để danh sách sổ xuống đúng giao diện IOC, cả 3 theme). */

function stcWarnTxt(w) { return STC_SHOW_TECH ? w : String(w).replace(/dòng API/g, 'dòng số liệu').replace(/của API/g, 'do Sở Tài chính báo').replace(/API/g, 'nguồn'); }
function stcWarnBadge(ind) { return ind.warns.length ? '<span class="stc-bd warn" title="' + stcE(ind.warns.map(stcWarnTxt).join(' | ')) + '">Cần đối soát</span>' : ''; }
/* Nút phóng to/thu nhỏ một thẻ biểu đồ ra toàn màn hình popup (xem stcToggleZoom/stcApplyZoom). */

}
function stcCard(ind, res, sub, body, extraCls) {
  const link = stcBtnLnk('Chi tiết ›', "stcDetail('" + ind.id + "')");
  const real = (ind.state === 'ok' && !res.demo) ? '<span class="stc-bd real">' + stcT('Số liệu thật từ API', 'Số liệu thật') + '</span>' : '';
  const warnNote = (ind.state === 'ok' && ind.warns.length) ? '<div class="stc-warnbox stc-note" style="color:var(--warn)">' + STC_ICON_WARN + '<div><b>Cần đối soát:</b> ' + ind.warns.map((w) => stcE(stcWarnTxt(w))).join('; ') + '</div></div>' : '';

    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">' + real + (ind.state === 'nodata' ? '<span class="stc-bd">Chưa có số liệu</span>' : '') + stcWarnBadge(ind) + link + stcZoomBtn(ind.id) + (STC_SHOW_TECH ? '<span class="stc-bd">' + stcE(ind.apis.join(' · ')) + '</span>' : '') + '</div></div>' +
    (ind.state === 'missing' ? stcStateBody(ind, res) : (ind.state === 'nodata' ? stcNodataNote(res) + '<div class="stc-blank">' + body + '</div>' : body)) + warnNote + '</div>';
}
function stcSubText(ind, res, withPrev) {
  const cur = stcQ(res.year, res.period);
  const pq = stcPrevQ(res.year, res.period);
  return (withPrev ? 'Kỳ này (' + cur + ') so với kỳ trước (' + stcQ(pq.year, pq.period) + ') và cùng kỳ (' + stcQ(res.year - 1, res.period) + ') · ' : '') + ind.unit + (withPrev ? '' : ' · ' + cur);
}
/* true = hiện mũi tên so kỳ trước/so cùng kỳ cạnh số tổng ở đầu thẻ chỉ tiêu (màn nhóm). Anh yêu cầu 2026-10-02 bỏ vì
   bảng/thanh thành phần bên dưới đã có 2 cột so sánh → mặc định false (ẩn bằng cờ, code giữ nguyên). */
const STC_BIGROW_DL = false;
function stcBigRow(n, hint) {
  return '<div class="stc-bigrow"><div class="stc-big">' + stcVal(n) + '<small>' + stcE(n.unit) + '</small></div>' + (STC_BIGROW_DL ? stcDl(n, true) : '') + '</div>' + (hint ? '<div class="stc-hint">' + stcE(hint) + '</div>' : '');
}

/* ---------- Các kiểu thẻ ---------- */
function stcDonutSvg(items, total, center, unit, label) {
  const C = 2 * Math.PI * 54;
  let cum = 0, segs = '';
  items.forEach((it) => {
    if (!(it.v > 0) || !(total > 0)) return;
    const len = (it.v / total) * C, dash = Math.max(0.6, len - 2.5);
    segs += '<circle class="stc-seg" cx="80" cy="80" r="54" stroke="' + it.c + '" stroke-dasharray="' + dash.toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="' + (-cum).toFixed(1) + '"/>';
    cum += len;
  });
  const fs = center.length > 8 ? 14 : center.length > 6 ? 17 : 21;
  return '<svg viewBox="0 0 160 160" role="img" aria-label="' + stcE(label) + '"><circle class="stc-trk" cx="80" cy="80" r="54"/><g transform="rotate(-90 80 80)">' + segs + '</g>' +
    '<text class="stc-tv" x="80" y="80" text-anchor="middle" style="font-size:' + fs + 'px">' + stcE(center) + '</text><text class="stc-tu" x="80" y="96" text-anchor="middle">' + stcE(unit) + '</text></svg>';
}
function stcKidColor(k, i) { return k.color || STC_PAL[i % STC_PAL.length]; }
/* Tiêu đề 2 cột so sánh trong bảng (rỗng nếu không mục nào so được) */
function stcCmpHeads(kids) { return stcHasCmp(kids) ? '<th>So kỳ trước</th><th>So cùng kỳ</th>' : ''; }
function stcCmpCells(k) { return '<td>' + stcDlOne(k, 'kq', false) + '</td><td>' + stcDlOne(k, 'cq', false) + '</td>'; }

function stcViewBarsCompare(ind, res) {
  const kids = ind.kids;
  const mx = Math.max(1, ...kids.map((k) => Math.max(k.now || 0, k.prev || 0)));
  let h = stcBigRow(ind, 'Tổng của ' + kids.length + '' + stcT(' nguồn do API cung cấp.', ' nguồn do Sở Tài chính cung cấp.') + '');
  h += '<div class="stc-lg"><span><i style="background:var(--s1)"></i>Kỳ này</span><span><i style="background:var(--prev)"></i>Cùng kỳ năm trước</span></div>';
  kids.forEach((k, i) => {
    const w = (v) => (v > 0 ? Math.max(0.2, (v / mx) * 100) : 0);
    h += '<div class="stc-cmp"' + (i === 0 ? ' style="margin-top:8px"' : '') + '><div class="stc-nm">' + stcE(k.label) + '</div><div class="stc-bars">' +
      '<div class="stc-br"><div class="stc-tr"><div class="stc-b" style="width:' + w(k.now).toFixed(2) + '%"></div></div><div class="stc-val">' + stcFmt(k.now) + '</div></div>' +
      (k.prev != null ? '<div class="stc-br"><div class="stc-tr"><div class="stc-b p" style="width:' + w(k.prev).toFixed(2) + '%"></div></div><div class="stc-val p">' + stcFmt(k.prev) + '</div></div>' : '') +
      '</div>' + (stcDl(k, false) || '<span class="stc-dl flat">—</span>') + '</div>';
  });
  return h;
}
function stcViewDonutTable(ind, res) {
  const kids = ind.kids;
  const extra = ind.id === 'grdp';
  const cmpH = stcCmpHeads(kids);
  const items = kids.map((k, i) => ({ v: k.now, c: stcKidColor(k, i) }));
  const center = stcFmt(ind.now);
  let h = stcBigRow(ind, ind.id === 'grdp' ? 'Tổng của 4 khu vực theo giá hiện hành.' : ind.id === 'chi' ? '' + stcT('Lấy đúng dòng "Tổng chi NS ĐP" của API;', 'Lấy đúng dòng "Tổng chi NS ĐP" của Sở Tài chính;') + ' các khoản chi bên dưới cộng lại phải khớp tổng.' : 'Tổng của ' + kids.length + ' thành phần.');
  h += '<div class="stc-dn" style="margin-top:14px">' + stcDonutSvg(items, ind.now, center, ind.unit, 'Cơ cấu ' + ind.label) + '<table class="stc-tbl"><thead><tr><th>Thành phần</th><th>Giá trị</th><th>Tỷ trọng</th>' +
    cmpH + (extra ? '<th>Giá so sánh cùng kỳ năm trước</th>' : '') + '</tr></thead><tbody>';
  kids.forEach((k, i) => {
    const sh = stcShare(k, ind);
    h += '<tr><td><i class="stc-sw" style="background:' + stcKidColor(k, i) + '"></i>' + stcE(k.label) + '</td><td>' + stcFmt(k.now) + '</td><td>' + (sh == null ? '—' : stcFmt(sh, 1) + '%') + '</td>' +
      (cmpH ? stcCmpCells(k) : '') + (extra ? '<td>' + stcFmt(k.cmp) + '</td>' : '') + '</tr>';
  });
  if (extra) h += '<tr class="tot"><td>Tổng</td><td>' + stcFmt(ind.now) + '</td><td>100,0%</td>' + (cmpH ? stcCmpCells(ind) : '') + '<td>' + stcFmt(kids.every((k) => k.cmp != null) ? kids.reduce((a, k) => a + k.cmp, 0) : null) + '</td></tr>';
  h += '</tbody></table></div>';
  if (extra) h += '<div class="stc-note" style="margin-top:16px"><span class="stc-bd warn" style="flex:0 0 auto">Chờ xác nhận</span><div>Chưa rõ cột "giá so sánh cùng kỳ năm trước" là giá trị (tỷ đồng) hay tốc độ tăng (%). Form hiện <b>' + stcT('nguyên số API trả về', 'nguyên số Sở Tài chính cung cấp') + '</b> và chưa tính tăng trưởng GRDP.</div></div>';
  return h;
}
function stcViewStackTable(ind, res) {
  const kids = ind.kids;
  const cmpH = stcCmpHeads(kids);
  let h = stcBigRow(ind, ind.id === 'ble' ? 'Là một phần của bán ra; hai chỉ tiêu đặt cạnh nhau, không cộng gộp.' : 'Tổng của ' + kids.length + ' thành phần.' + (cmpH ? '' : ' Nguồn số liệu chưa có kỳ so sánh nên chưa hiện tăng giảm.'));
  h += '<div class="stc-stack" style="height:20px;margin:16px 0 12px">' + kids.map((k, i) => '<i style="flex:' + Math.max(0, k.now || 0) + ';background:' + stcKidColor(k, i) + '"></i>').join('') + '</div>';
  h += '<table class="stc-tbl"><thead><tr><th>Thành phần</th><th>Giá trị</th><th>Tỷ trọng</th>' + cmpH + '</tr></thead><tbody>';
  kids.forEach((k, i) => { const sh = stcShare(k, ind); h += '<tr><td><i class="stc-sw" style="background:' + stcKidColor(k, i) + '"></i>' + stcE(k.label) + '</td><td>' + stcFmt(k.now) + '</td><td>' + (sh == null ? '—' : stcFmt(sh, 1) + '%') + '</td>' + (cmpH ? stcCmpCells(k) : '') + '</tr>'; });
  h += '</tbody></table>';
  if (ind.id === 'nsnn') h += '<div style="margin-top:14px">' + stcNote('' + stcT('API chỉ có giá trị đã thực hiện', 'Số liệu chỉ có giá trị đã thực hiện') + ', chưa có kế hoạch vốn, nên form <b>không tính tỷ lệ giải ngân</b>.') + '</div>';

}
function stcViewProgress(ind, res) {
  const kids = ind.kids.slice().sort((a, b) => (b.now || 0) - (a.now || 0));
  let h = '';
  kids.forEach((k) => { h += '<div class="stc-pg"><div class="stc-row"><span class="stc-nm">' + stcE(k.label) + '</span><span class="stc-pv">' + stcFmt(k.now) + '%</span></div><div class="stc-trk"><div class="stc-fill" style="width:' + Math.max(0, Math.min(100, k.now || 0)) + '%"></div></div></div>'; });
  h += '<div style="margin-top:8px">' + stcNote('' + stcT('API chưa có mốc kế hoạch', 'Số liệu chưa có mốc kế hoạch') + ', nên form chỉ hiển thị tỷ lệ hoàn thành và <b>không gắn nhãn "chậm" hay "đúng tiến độ"</b>. Năm nhóm không cùng loại nên cũng không tính tiến độ trung bình.') + '</div>';
  return h;
}
function stcViewIdxAxis(ind, res) {
  const items = [ind].concat(ind.kids).filter((n) => n.now > 0);
  const vals = items.map((n) => n.now).concat([100]);
  const lo = Math.floor(Math.min(...vals) - 3), hi = Math.ceil(Math.max(...vals) + 3), span = hi - lo;
  const zero = ((100 - lo) / span) * 100;
  let h = '<div class="stc-lg" style="margin:0 0 6px"><span><i style="background:var(--s1)"></i>Cao hơn cùng kỳ</span><span><i style="background:var(--dn)"></i>Thấp hơn cùng kỳ</span></div>';
  [ind].concat(ind.kids).forEach((n) => {
    if (!(n.now > 0)) { h += '<div class="stc-iip"><div class="stc-nm">' + stcE(n.label) + '</div><div class="stc-axis"></div><div class="stc-rt"><b>—</b></div></div>'; return; }
    const left = n.now >= 100 ? zero : ((n.now - lo) / span) * 100, width = (Math.abs(n.now - 100) / span) * 100;
    h += '<div class="stc-iip"><div class="stc-nm">' + stcE(n.label) + '</div><div class="stc-axis"><div class="stc-zero" style="left:' + zero.toFixed(2) + '%"></div><div class="stc-bar ' + (n.now >= 100 ? 'up' : 'dn') + '" style="left:' + left.toFixed(2) + '%;width:' + width.toFixed(2) + '%"></div></div>' +
      '<div class="stc-rt"><b>' + stcFmt(n.now, 1) + '</b>' + stcDl(n, false) + '</div></div>';
  });
  return h;
}
function stcViewBarsDelta(ind, res) {
  const kids = ind.kids;
  const mx = Math.max(1, ...kids.map((k) => k.now || 0));
  let h = stcBigRow(ind, 'Tổng ' + kids.length + ' nhóm dịch vụ; mức tăng chung tính từ các nhóm (giả định chỉ số lấy 100 làm mốc).');
  kids.forEach((k) => {
    h += '<div class="stc-cmp" style="grid-template-columns:150px minmax(0,1fr) 150px"><div class="stc-nm">' + stcE(k.label) + '</div><div class="stc-bars"><div class="stc-br"><div class="stc-tr"><div class="stc-b" style="width:' + (k.now > 0 ? Math.max(0.2, (k.now / mx) * 100).toFixed(2) : 0) + '%"></div></div><div class="stc-val">' + stcFmt(k.now) + '</div></div></div>' + (stcDl(k, false) || '<span class="stc-dl flat">—</span>') + '</div>';
  });
  return h;
}
function stcViewXnk(ind, res) {
  const xk = ind.kids[0], nk = ind.kids[1];
  const col = (n, title) => {
    let c = '<div><div class="stc-hint" style="font-weight:600;color:var(--ink2)">' + stcE(title) + '</div><div class="stc-bigrow" style="margin-top:4px"><div class="stc-big" style="font-size:26px">' + stcVal(n) + '<small>' + stcE(n.unit) + '</small></div>' + (STC_BIGROW_DL ? stcDl(n, false) : '') + '</div>';
    c += '<div class="stc-stack">' + n.kids.map((k, i) => '<i style="flex:' + Math.max(0, k.now || 0) + ';background:' + stcKidColor(k, i) + '"></i>').join('') + '</div><table class="stc-tbl"><thead><tr><th>Khu vực</th><th>Giá trị</th><th>So kỳ trước</th><th>So cùng kỳ</th></tr></thead><tbody>';
    n.kids.forEach((k, i) => { c += '<tr><td><i class="stc-sw" style="background:' + stcKidColor(k, i) + '"></i>' + stcE(k.label) + '</td><td>' + stcFmt(k.now) + '</td>' + stcCmpCells(k) + '</tr>'; });
    return c + '</tbody></table></div>';
  };
  let h = '<div class="stc-g2" style="gap:24px">' + col(xk, 'Xuất khẩu') + col(nk, 'Nhập khẩu') + '</div>';
  if (xk.now != null && nk.now != null) {
    const bal = xk.now - nk.now, mx = Math.max(xk.now, nk.now, 1);
    h += '<div class="stc-note" style="margin-top:18px;align-items:center;justify-content:space-between;gap:24px"><div style="flex:1;min-width:0"><div class="stc-hint" style="margin-bottom:2px">Cán cân thương mại (xuất khẩu trừ nhập khẩu)</div><div style="font-size:18px;font-weight:700;color:var(--ink)">' + (bal < 0 ? 'Nhập siêu ' : bal > 0 ? 'Xuất siêu ' : 'Cân bằng ') + stcFmt(Math.abs(bal)) + ' ' + stcE(ind.unit) + '</div></div>' +
      '<div style="width:210px;display:grid;gap:6px;flex:0 0 auto"><div style="display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;font-size:11px"><span>XK</span><div style="height:8px;border-radius:0 4px 4px 0;background:var(--s1);width:' + ((xk.now / mx) * 100).toFixed(1) + '%"></div></div><div style="display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;font-size:11px"><span>NK</span><div style="height:8px;border-radius:0 4px 4px 0;background:var(--prev);width:' + ((nk.now / mx) * 100).toFixed(1) + '%"></div></div></div></div>';
  }
  return h;
}
function stcViewScales(ind, res) {
  let h = '<div class="stc-g3">';
  ind.kids.forEach((k) => {
    const v = k.now, lo = Math.min(80, Math.floor((v || 0) / 10) * 10 - 10), hi = Math.max(120, Math.ceil(((v || 0) + 10) / 20) * 20), span = hi - lo;
    h += '<div id="stc-ind-' + k.id + '" class="stc-card' + (STC_UI.zoom === k.id ? ' stc-zoomed' : '') + '"><div class="stc-ch"><div><h3 class="stc-ct">' + stcE(k.label) + '</h3><div class="stc-cs">' + stcE(ind.unit) + '</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">' + stcZoomBtn(k.id) + (STC_SHOW_TECH ? '<span class="stc-bd">' + stcE(ind.apis[0]) + '</span>' : '') + '</div></div>';
    if (!(v > 0)) h += '<div class="stc-bigrow"><div class="stc-big">—</div></div><div class="stc-hint">Chưa có số liệu</div>';
    else h += '<div class="stc-bigrow"><div class="stc-big">' + stcFmt(v, 1) + '</div>' + stcDl(k, true) + '</div><div class="stc-scale"><div class="stc-tick" style="left:' + (((100 - lo) / span) * 100).toFixed(2) + '%"></div><div class="stc-dot" style="left:' + (((v - lo) / span) * 100).toFixed(2) + '%"></div></div><div class="stc-scale-cap"><span>' + lo + '</span><span>Vạch đứng: mốc 100</span><span>' + hi + '</span></div>';
    h += '</div>';
  });
  return h + '</div>';
}

const STC_VIEWS = { barsCompare: stcViewBarsCompare, donutTable: stcViewDonutTable, stackTable: stcViewStackTable, progress: stcViewProgress, idxAxis: stcViewIdxAxis, barsDelta: stcViewBarsDelta, xnk: stcViewXnk, scales: stcViewScales };
const STC_VIEW_SUB = { barsCompare: (i, r) => stcSubText(i, r, true), donutTable: (i, r) => stcSubText(i, r, i.kids.some((k) => k.prev > 0)), stackTable: (i, r) => stcSubText(i, r, false), progress: (i, r) => 'Tỷ lệ hoàn thành (%) · ' + stcQ(r.year, r.period) + ' · xếp từ cao xuống thấp', idxAxis: (i, r) => 'So với cùng kỳ năm trước · vạch đứng là mốc 100 (bằng cùng kỳ)', barsDelta: (i, r) => 'Ước tính quý · ' + i.unit, xnk: (i, r) => 'Ước tính quý · ' + i.unit + ' · so với cùng kỳ', scales: (i, r) => 'So với cùng kỳ năm trước (100 = bằng cùng kỳ)' };

function stcIndCard(id, res) {
  const ind = res.byId[id];
  if (!ind) return '';
  if (ind.view === 'scales') {
    /* Chỉ số giá: 3 thẻ riêng, mỗi thẻ một thang riêng (vàng 187 và CPI 103 không đặt chung một biểu đồ) */
    const secT = '<div class="stc-sec">Chỉ số giá · so với cùng kỳ năm trước (100 = bằng cùng kỳ)</div>';
    const fc = '<div id="stc-ind-gia"' + (STC_UI.focus === 'gia' ? ' class="stc-focus"' : '') + '>';
    if (ind.state === 'ok') return fc + secT + stcViewScales(ind, res) + '</div>';
    if (ind.state === 'nodata') return fc + secT + stcNodataNote(res) + '<div class="stc-blank" style="margin-top:12px">' + stcViewScales(stcBlank(ind), res) + '</div></div>';
    return stcCard(ind, res, STC_VIEW_SUB.scales(ind, res), '');
  }
  const v = ind.state === 'nodata' ? stcBlank(ind) : ind;
  return stcCard(ind, res, STC_VIEW_SUB[ind.view](v, res), STC_VIEWS[ind.view](v, res));
}

/* ---------- Màn: Trang chủ ---------- */
/* onclick tuỳ chỗ dùng: mặc định (trong popup) chuyển màn bằng stcGo; ngoài lưới (stcOverviewBandHtml) mở thẳng
   popup đúng nhóm bằng openCategoryDetail vì popup chưa mở. */
function stcKpiTile(k, res, onclick) {
  const n = res.byId[k.ind], root = res.rootOf[k.ind];
  const has = root && root.state === 'ok' && n && n.now != null;
  let v = '—', u = 'Chưa có số liệu', d = '';
  if (has) {
    if (k.fmt === 'nghinTy') { v = stcFmt(n.now / 1000, 1); u = 'nghìn tỷ đồng'; }
    else if (k.fmt === 'trieuLuot') { v = stcFmt(n.now / 1000, 2); u = 'triệu lượt'; }
    else { v = stcFmt(n.now, 1); u = '% so với cùng kỳ'; }
    /* 2 cột: so kỳ trước | so cùng kỳ (không tính được thì "—", rê chuột xem lý do) */
    d = '<div class="stc-kdl"><div><small>So kỳ trước</small>' + stcDlOne(n, 'kq', false) + '</div><div><small>So cùng kỳ</small>' + stcDlOne(n, 'cq', false) + '</div></div>';
  }
  return '<button type="button" class="stc-kpi" onclick="' + (onclick || ("stcGo('group','" + k.target + "')")) + '"><div class="stc-lb">' + stcE(k.label) + '</div><div class="stc-v">' + v + '</div><div class="stc-u">' + stcE(u) + '</div><div class="stc-dlw" style="min-height:18px">' + d + '</div></button>';
}
/* Một dòng trong thẻ nhóm: nhãn, giá trị + đơn vị, tăng giảm */
function stcLine(label, n, root, unitOverride, valOverride) {
