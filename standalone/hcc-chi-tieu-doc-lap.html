<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ chỉ tiêu Trung tâm Phục vụ hành chính công — IOC Hà Nội</title>
<!-- Trang độc lập, dựng tự động bằng "node tools/hcc-build-doc-lap.js" lúc 17:16:25 20/10/2026. Đừng sửa tay: sửa code gốc rồi dựng lại. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- ExcelJS: dùng cho nút "Xuất Excel" trong popup (hccExport() ở dashboard-hcc.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* ============================== KHUNG TỐI THIỂU (tự viết, không phải file gốc của IOC) ==============================
   Bản rút gọn của style.css + theme-light.css/theme-green.css: chỉ giữ đúng phần khung popup (#overlay/#modal/#toast)
   và lưới thẻ (.field-category-*) mà bộ chỉ tiêu cần, để trang này đứng độc lập không cần index.html
   gốc. Màu lấy nguyên từ 3 giao diện hiện có của IOC (tối mặc định, sáng, xanh lá). */
:root{--font:'Be Vietnam Pro',Inter,Segoe UI,Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);background:radial-gradient(circle at 50% -20%,#093b6c 0,#06162a 40%,#020813 100%);color:#ecf7ff;font-size:14px}
html.theme-light,html.theme-light body{background:#f3f5f9;color:#0b1220}
html.theme-green,html.theme-green body{background:#eef9f3;color:#1f2937}
h1,h2,h3,h4,h5,h6{margin:0;font-weight:800}
button{cursor:pointer;border:0;background:none;outline:none;font:inherit;color:inherit;transition:filter .15s}
button:not(:disabled):hover{filter:brightness(1.35)}
html.theme-light button:not(:disabled):hover,html.theme-green button:not(:disabled):hover{filter:brightness(1)}

.stc-page{max-width:1400px;margin:0 auto;padding:28px 20px 60px}
.stc-page-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.stc-page-head h1{font-size:19px;letter-spacing:-.01em}
.stc-page-head p{margin:4px 0 0;font-size:12.5px;color:#a8c3d8}
html.theme-light .stc-page-head p,html.theme-green .stc-page-head p{color:#5b6a80}
.stc-theme-sw{display:flex;gap:6px}
.stc-theme-sw button{height:32px;padding:0 12px;border-radius:8px;border:1px solid rgba(87,178,255,.3);background:rgba(255,255,255,.06);font-size:12.5px;font-weight:600}
.stc-theme-sw button.on{background:#1f63b8;border-color:transparent;color:#fff}
html.theme-light .stc-theme-sw button{border-color:#D5DAE3;background:#fff;color:#111827}
html.theme-green .stc-theme-sw button{border-color:#d1fae5;background:#fff;color:#1f2937}
html.theme-light .stc-theme-sw button.on{background:#9d151c;color:#fff;border-color:transparent}
html.theme-green .stc-theme-sw button.on{background:#2e9d5b;color:#fff;border-color:transparent}

.field-category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:900px){.field-category-grid{grid-template-columns:1fr}}
.field-category-card{border:1px solid rgba(87,178,255,.26);background:linear-gradient(180deg,rgba(9,39,70,.88),rgba(4,18,34,.95));border-radius:14px;padding:12px;text-align:left;height:210px;display:grid;grid-template-rows:auto auto 1fr;gap:6px;overflow:hidden;transition:.16s}
.field-category-card:hover{filter:brightness(1.15);transform:translateY(-1px)}
.field-category-card.so-item-card{height:auto;min-height:110px;grid-template-rows:auto auto auto;align-content:start;overflow:visible}
.field-category-card h4{margin:0;font-size:14px;line-height:1.28;color:#f2fbff}
html.theme-light .field-category-card{background:#fff;border-color:#D5DAE3}
html.theme-light .field-category-card h4{color:#111827}
html.theme-light .field-category-card:hover{border-color:#9d151c;box-shadow:0 4px 14px rgba(157,21,28,.12);transform:translateY(-1px)}
html.theme-green .field-category-card{background:#fff;border-color:#d1fae5}
html.theme-green .field-category-card h4{color:#1f2937}
html.theme-green .field-category-card:hover{border-color:#2e9d5b;box-shadow:0 4px 14px rgba(46,157,91,.12);transform:translateY(-1px)}
.access-lock{border:1px dashed rgba(255,213,75,.45);background:rgba(255,213,75,.08);border-radius:12px;padding:10px;color:#ffe6a6;line-height:1.45}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.56);z-index:90;opacity:0;pointer-events:none;transition:.18s}
.overlay.show{opacity:1;pointer-events:auto}
html.theme-light .overlay.show,html.theme-green .overlay.show{background:rgba(30,41,59,.45)}
.modal{position:fixed;inset:2vh 50%;width:min(1680px,98vw);transform:translateX(-50%) scale(.96);background:linear-gradient(180deg,#08213b,#031120);border:1px solid rgba(87,178,255,.45);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.55);z-index:110;opacity:0;pointer-events:none;transition:.18s;display:flex;flex-direction:column;max-height:96vh;overflow-y:auto;overflow-x:hidden}
.modal.open{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
html.theme-light .modal{background:#F9FAFB;border-color:#D5DAE3;box-shadow:0 20px 60px rgba(15,23,42,.18)}
html.theme-green .modal{background:#ffffff;border-color:#d1fae5;box-shadow:0 20px 60px rgba(15,23,42,.18)}
.modal-head{padding:16px;border-bottom:1px solid rgba(87,178,255,.22);display:grid;grid-template-columns:1fr auto;gap:10px}
.modal-head h3{margin:0;line-height:1.28;font-size:16px}
.modal-head .muted{color:#a8c3d8;font-size:12.5px;margin-top:2px}
html.theme-light .modal-head{border-bottom-color:#D5DAE3}
html.theme-light .modal-head .muted{color:#5b6a80}
html.theme-green .modal-head{border-bottom-color:#d1fae5}
html.theme-green .modal-head .muted{color:#566a5e}
.modal-body{padding:14px;overflow-y:scroll;overflow-x:hidden;display:grid;align-content:start;gap:12px;flex:1;min-height:0}
.close{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);font-size:21px;color:inherit}
html.theme-light .close{background:#f2f4f8;border-color:#D5DAE3;color:#475569}
html.theme-light .close:hover{background:#fdeceb;color:#9d151c}
html.theme-green .close{background:#eef9f3;border-color:#d1fae5;color:#475569}
html.theme-green .close:hover{background:#ddf2e8;color:#2e9d5b}
.toast{position:fixed;right:18px;bottom:18px;z-index:200;background:#06223f;border:1px solid rgba(87,178,255,.45);border-radius:12px;padding:12px 14px;box-shadow:0 15px 50px rgba(0,0,0,.4);transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s;max-width:420px;overflow-wrap:anywhere;font-size:13px}
.toast.show{transform:translateY(0);opacity:1}
html.theme-light .toast{background:#F9FAFB;border-color:#D5DAE3;color:#111827}
html.theme-green .toast{background:#ffffff;border-color:#d1fae5;color:#1f2937}


/* ===== css/stc.css ===== */
/* ============================== SỞ TÀI CHÍNH — GIAO DIỆN FORM CHỈ TIÊU MỚI ==============================
   Mọi lớp đều có tiền tố stc- và nằm trong .stc-root để không đụng CSS chung của IOC. 3 giao diện: tối (mặc định),
   html.theme-light, html.theme-green. Sinh từ bản dựng thiết kế đã duyệt. */
/* Chỉ tiêu Sở Tài chính - bản dựng minh họa. Dùng chung cho mọi artboard.
   Màu theo vai trò (biến CSS) để đổi giao diện tối/sáng ở một chỗ. */
.stc-root{box-sizing:border-box;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;line-height:1.45;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased;overflow:hidden}
.stc-root *,.stc-root *::before,.stc-root *::after{box-sizing:border-box}
.stc-root h1,.stc-root h2,.stc-root h3,.stc-root p{margin:0}

.stc-root{--page:#061a2e;--card:#0b2540;--card2:#0e2c4a;--line:rgba(140,190,255,.16);--ink:#eaf4ff;--ink2:#b9cee2;--mute:#8ba7c2;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--prev:#4f6f8f;--track:#123a60;--good:#4fd69c;--bad:#ff8a8a;--dn:#e66767;--warn:#f2b636;--accent:#3987e5;--btn:#1f63b8;--chip:rgba(57,135,229,.14)}
html.theme-light .stc-root{--page:#f3f5f9;--card:#ffffff;--card2:#f5f7fb;--line:rgba(15,23,42,.13);--ink:#0b1220;--ink2:#3f4c63;--mute:#5b6a80;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--prev:#b3bfd0;--track:#e6ecf5;--good:#006300;--bad:#b3261e;--dn:#e34948;--warn:#8a5a00;--accent:#2a78d6;--btn:#1f63b8;--chip:rgba(42,120,214,.09)}

.stc-pad{padding:28px 28px 32px}

/* Đầu form */
.stc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:16px}
.stc-eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.stc-root h1{font-size:24px;line-height:1.25;font-weight:700;margin:3px 0 4px;letter-spacing:-.01em}
.stc-sub{color:var(--ink2);font-size:13px}
.stc-ctrls{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.stc-sel{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px;font-weight:500;color:var(--ink)}
.stc-sel small{color:var(--mute);font-size:11.5px;font-weight:500}
.stc-sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:0 22px 0 0;height:34px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 9px) 15px,calc(100% - 5px) 15px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.stc-sel select option{color:#111;background:#fff}
.stc-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.stc-btn.primary{background:var(--btn);border-color:transparent;color:#fff}
.stc-btn svg{flex:0 0 auto}

.stc-status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.stc-chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--chip);color:var(--ink2);border:1px solid var(--line)}
.stc-chip i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:0 0 auto}
.stc-chip.demo{background:rgba(242,182,54,.13);color:var(--warn);border-color:rgba(242,182,54,.42)}
.stc-chip.demo i{background:var(--warn)}

/* Thẻ KPI */
.stc-kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:22px}
.stc-kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 13px;min-width:0}
.stc-kpi .stc-lb{font-size:11.5px;font-weight:500;color:var(--ink2);min-height:33px;line-height:1.4}
.stc-kpi .stc-v{font-size:26px;font-weight:700;line-height:1.1;margin-top:6px;letter-spacing:-.015em}
.stc-kpi .stc-u{font-size:11.5px;color:var(--mute);margin-top:3px}
.stc-kpi .stc-dl{margin-top:10px}

/* Tăng / giảm */
.stc-dl{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stc-dl::before{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;flex:0 0 auto}
.stc-dl.up{color:var(--good)}
.stc-dl.up::before{border-bottom:6px solid currentColor}
.stc-dl.down{color:var(--bad)}
.stc-dl.down::before{border-top:6px solid currentColor}
.stc-dl.n{color:var(--ink2)}
.stc-dl.flat{color:var(--mute)}
.stc-dl.flat::before{width:8px;height:2px;border:0;background:currentColor}
.stc-dl .stc-ref{font-weight:500;color:var(--mute);font-size:11.5px}
.stc-dl[title]{cursor:help}
.stc-dl.na{color:var(--mute)}
.stc-dl.na::before{display:none}
/* Cặp mũi tên: so kỳ trước (trên) + so cùng kỳ (dưới) */
.stc-dlp{display:inline-flex;flex-direction:column;align-items:flex-end;gap:3px}
.stc-dlp .stc-dl{margin-top:0}
.stc-kpi .stc-dlp,.stc-oc-root .stc-dlp,.stc-oc-card .stc-dlp{align-items:flex-start}
.stc-cmp .stc-dlp,.stc-root .stc-gl .stc-dlp{justify-self:end}
/* Tab */
.stc-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.stc-tab{padding:10px 16px 11px;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink2);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.stc-tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.stc-tab .stc-cnt{font-size:11px;font-weight:600;color:var(--mute);background:var(--chip);border-radius:999px;padding:1px 8px}

/* Thẻ nội dung */
.stc-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stc-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stc-g21{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.stc-mt{margin-top:16px}
.stc-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px 20px;min-width:0}
.stc-ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.stc-ct{font-size:15px;font-weight:600;line-height:1.35}
.stc-cs{font-size:12px;color:var(--mute);margin-top:2px}
.stc-bd{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--mute);white-space:nowrap;flex:0 0 auto}
.stc-bd.real{color:var(--good);border-color:currentColor}
.stc-bd.real::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.stc-bd.warn{color:var(--warn);border-color:currentColor}

.stc-big{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.015em}
.stc-big small{font-size:13px;font-weight:500;color:var(--mute);margin-left:6px;letter-spacing:0}
.stc-bigrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.stc-hint{font-size:12px;color:var(--mute)}

.stc-lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:12px 0 4px}
.stc-lg i,.stc-sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}

/* Hàng so sánh Kỳ này / Kỳ trước */
.stc-cmp{display:grid;grid-template-columns:132px minmax(0,1fr) 150px;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.stc-cmp .stc-nm{font-size:13px;font-weight:500;line-height:1.35}
.stc-cmp .stc-dl{justify-self:end}
.stc-bars{display:grid;gap:5px}
.stc-br{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:10px;align-items:center;height:14px}
.stc-br .stc-tr{position:relative;height:10px}
.stc-br .stc-b{position:absolute;left:0;top:0;height:10px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.stc-br .stc-b.p{background:var(--prev)}
.stc-br .stc-val{font-size:12px;font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.stc-br .stc-val.p{color:var(--mute);font-weight:500}

/* Bảng số liệu */
.stc-tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.stc-tbl th{font-weight:600;color:var(--mute);font-size:11.5px;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);line-height:1.3}
.stc-tbl th:first-child,.stc-tbl td:first-child{text-align:left;padding-left:0}
.stc-tbl td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;vertical-align:middle}
.stc-tbl tr:first-child td{border-top:0}
.stc-tbl td:first-child{font-weight:500;line-height:1.35}
.stc-tbl tr.tot td{font-weight:700}
.stc-tbl .stc-dl{justify-content:flex-end}

/* Cơ cấu */
.stc-stack{display:flex;gap:2px;height:14px;margin:12px 0 4px}
.stc-stack i{display:block;height:100%;border-radius:3px}
.stc-dn{display:grid;grid-template-columns:168px minmax(0,1fr);gap:18px;align-items:center}
.stc-dn svg{display:block;width:168px;height:168px}
.stc-dn .stc-tv{fill:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:700;font-size:21px;letter-spacing:-.01em}
.stc-dn .stc-tu{fill:var(--mute);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:500;font-size:10.5px}
.stc-dn .stc-trk{fill:none;stroke:var(--track);stroke-width:22}
.stc-dn .stc-seg{fill:none;stroke-width:22}

/* Tiến độ */
.stc-pg{padding:12px 0;border-top:1px solid var(--line)}
.stc-pg:first-of-type{border-top:0}
.stc-pg .stc-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.stc-pg .stc-nm{font-size:13px;font-weight:500;line-height:1.35}
.stc-pg .stc-pv{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stc-pg .stc-trk{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.stc-pg .stc-fill{height:100%;background:var(--s1);border-radius:5px}

/* Chỉ số so cùng kỳ (mốc 100) */
.stc-iip{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.4fr) 150px;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.stc-iip .stc-nm{font-size:12.5px;font-weight:500;line-height:1.35}
.stc-iip .stc-rt{text-align:right}
.stc-iip .stc-rt b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.stc-axis{position:relative;height:14px;background:var(--track);border-radius:4px}
.stc-axis .stc-bar{position:absolute;top:2px;height:10px}
.stc-axis .stc-bar.up{background:var(--s1);border-radius:0 4px 4px 0}
.stc-axis .stc-bar.dn{background:var(--dn);border-radius:4px 0 0 4px}
.stc-axis .stc-zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink2)}
.stc-axcap{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin:0 0 2px}

/* Thẻ chỉ số giá */
.stc-scale{position:relative;height:6px;border-radius:3px;background:var(--track);margin:14px 0 6px}
.stc-scale .stc-tick{position:absolute;top:-4px;height:14px;width:1px;background:var(--ink2)}
.stc-scale .stc-dot{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--s1);border:2px solid var(--card)}
.stc-scale-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}

/* Ghi chú, trạng thái */
.stc-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--ink2);font-size:12.5px;line-height:1.5}
.stc-note svg{flex:0 0 auto;margin-top:2px;color:var(--mute)}
.stc-note b{color:var(--ink)}
.stc-foot{display:flex;justify-content:space-between;gap:20px;margin-top:18px;font-size:11.5px;color:var(--mute)}
.stc-skel{background:linear-gradient(90deg,var(--track),var(--card2) 50%,var(--track));border-radius:6px}
.stc-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:150px;padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--ink2)}
.stc-empty b{color:var(--ink);font-size:13.5px}
.stc-empty svg{color:var(--mute)}
.stc-sec{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:26px 0 12px}
/* Màn hình chi tiết và phân cấp - bổ sung cho stc.css */
.stc-root a.stc-lnk{color:var(--accent);font-weight:600;font-size:12.5px;text-decoration:none;white-space:nowrap}
.stc-root a.stc-lnk:hover{text-decoration:underline}
.stc-root .stc-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin-bottom:12px}
.stc-root .stc-crumbs b{color:var(--ink);font-weight:600}
.stc-root .stc-crumbs .stc-sp{width:5px;height:5px;border-top:1.5px solid var(--mute);border-right:1.5px solid var(--mute);transform:rotate(45deg);margin:0 2px}

.stc-root .stc-split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.stc-root .stc-split2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}

/* Cây phân cấp bên trái (màn hình chi tiết) */
.stc-root .stc-anc{font-size:12px;color:var(--mute);padding:5px 12px;line-height:1.3}
.stc-root .stc-anc b{color:var(--ink2);font-weight:600}
.stc-root .stc-trow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:6px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);font:inherit;cursor:pointer;margin-top:2px}
.stc-root .stc-trow:hover{background:var(--card2)}
.stc-root .stc-trow.on{background:var(--chip);border-color:var(--accent)}
.stc-root .stc-trow .stc-tl{font-size:13px;font-weight:500;line-height:1.35;display:flex;align-items:baseline}
.stc-root .stc-trow .stc-tl .stc-sw{flex:0 0 auto;transform:translateY(0)}
.stc-root .stc-trow .stc-tv2{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.stc-root .stc-trow .stc-tb{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.stc-root .stc-trow .stc-tb i{display:block;height:100%;border-radius:2px}
.stc-root .stc-kids{margin-left:14px;padding-left:8px;border-left:1px solid var(--line)}

/* Thẻ chỉ số nhỏ */
.stc-root .stc-mchips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stc-root .stc-mchip{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);min-width:120px;flex:1 1 120px}
.stc-root .stc-mchip .stc-k{font-size:11.5px;color:var(--mute);line-height:1.3}
.stc-root .stc-mchip .stc-v{font-size:18px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}

/* Hàng có thể bấm */
.stc-root .stc-clk{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 84px;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 6px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.stc-root .stc-clk:hover{background:var(--card2)}
.stc-root .stc-clk .stc-n{font-weight:500;font-size:13px;line-height:1.35}
.stc-root .stc-clk .stc-r{text-align:right}
.stc-root .stc-clkh{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 84px;gap:10px;padding:6px 6px;font-size:11.5px;font-weight:600;color:var(--mute)}
.stc-root .stc-clkh span:not(:first-child){text-align:right}
.stc-root .stc-cmp.hl{background:var(--chip);border-radius:10px;padding-left:10px;padding-right:10px;border-top-color:transparent}

/* Dòng dữ liệu gốc từ API */
.stc-root .stc-rawh,.stc-root .stc-rawrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.5fr) minmax(80px,.5fr) 84px;gap:10px;padding:9px 6px;font-size:12.5px;font-variant-numeric:tabular-nums}
.stc-root .stc-rawh{font-size:11.5px;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line);font-family:ui-monospace,Consolas,monospace}
.stc-root .stc-rawrow{border-top:1px solid var(--line)}
.stc-root .stc-rawrow span:not(:first-child),.stc-root .stc-rawh span:not(:first-child){text-align:right}

/* Bảng cây (màn hình phân cấp) */
.stc-root .stc-thd{display:grid;grid-template-columns:minmax(0,1fr) 92px 70px 84px;gap:10px;padding:8px 10px;font-size:11.5px;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line)}
.stc-root .stc-thd span:not(:first-child){text-align:right}
.stc-root .stc-treebox{max-height:600px;overflow:auto}
.stc-root .stc-trw{display:grid;grid-template-columns:minmax(0,1fr) 92px 70px 84px;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.stc-root .stc-trw:hover{background:var(--card2)}
.stc-root .stc-trw.on{background:var(--chip)}
.stc-root .stc-trw .stc-lb2{display:flex;align-items:center;gap:8px;min-width:0}
.stc-root .stc-trw .stc-lb2 span{min-width:0;line-height:1.35}
.stc-root .stc-trw .stc-lb2 small{color:var(--mute);font-size:11px;margin-left:4px;font-weight:500}
.stc-root .stc-trw .stc-r{text-align:right}
.stc-root .stc-trw.stc-l0 .stc-lb2{font-weight:700;font-size:13px}
.stc-root .stc-trw.stc-l1 .stc-lb2{font-weight:600}
.stc-root .stc-chev{flex:0 0 auto;width:0;height:0;border-left:6px solid var(--mute);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
.stc-root .stc-chev.stc-open{transform:rotate(90deg)}
.stc-root .stc-chev.none{border-left-color:transparent}
.stc-root .stc-miniact{display:flex;gap:8px;margin-bottom:12px}

/* Treemap */
.stc-root .stc-tm{display:flex;gap:3px;height:330px}
.stc-root .stc-tm .stc-blk{display:flex;flex-direction:column;gap:3px;min-width:2px;min-height:0}
.stc-root .stc-tm .stc-bh{font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.3;padding:0 2px 1px}
.stc-root .stc-tm .stc-krow{display:flex;gap:3px;flex:1;min-height:0}
.stc-root .stc-tm .stc-cell{flex:1;min-width:2px;border-radius:8px;padding:8px 10px;overflow:hidden;color:#061a2e;font-size:12px;line-height:1.3;display:flex;flex-direction:column;justify-content:flex-start;gap:2px}
.stc-root .stc-tm .stc-cell b{font-size:13px;font-variant-numeric:tabular-nums}
.stc-root .stc-tm .stc-cell.sel{box-shadow:0 0 0 2px var(--ink) inset}

/* Trang chủ: thẻ KPI và thẻ nhóm bấm được */
.stc-root a.stc-kpi{display:block;color:inherit;text-decoration:none;transition:border-color .12s}
.stc-root a.stc-kpi:hover{border-color:var(--accent)}
.stc-root a.stc-gcard{display:block;color:inherit;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;transition:border-color .12s;min-width:0}
.stc-root a.stc-gcard:hover{border-color:var(--accent)}
.stc-root .stc-gh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.stc-root .stc-gh h3{font-size:16px;font-weight:700}
.stc-root .stc-gh span{font-size:12px;color:var(--mute);white-space:nowrap}
.stc-root .stc-gl{display:grid;grid-template-columns:minmax(0,1fr) auto 84px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.35}
.stc-root .stc-gl .stc-v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stc-root .stc-gl .stc-v small{font-weight:500;color:var(--mute);font-size:11.5px;margin-left:4px}
.stc-root .stc-gl .stc-dl{justify-self:end}
/* Sở Tài chính: dòng chỉ tiêu có 2 cột so sánh (so kỳ trước | so cùng kỳ) + hàng tiêu đề cột */
.stc-root .stc-gl.stc-glc{grid-template-columns:minmax(0,1fr) auto 92px 92px}
.stc-root .stc-gl.stc-glc .stc-dlw{text-align:right}
.stc-root .stc-gl.stc-glh{padding:2px 0 6px;border-top:0;font-size:11px;font-weight:600;color:var(--mute);line-height:1.25}
.stc-root .stc-gl.stc-glh span:nth-child(n+3){text-align:right}
/* Ô KPI: 2 cột so sánh, mỗi cột có nhãn nhỏ phía trên */
.stc-kdl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stc-kdl small{display:block;font-size:10.5px;font-weight:500;color:var(--mute);margin-bottom:3px;white-space:nowrap}
.stc-kdl .stc-dl{margin-top:0;font-size:12px}
.stc-root .stc-gmore{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--accent)}
.stc-root .stc-pn{display:flex;justify-content:space-between;gap:20px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.stc-root .stc-secrow{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.stc-root .stc-secrow .stc-sec{margin:0}

/* Đóng góp vào mức tăng (màn hình chi tiết) */
.stc-root .stc-dgrow{padding:9px 8px;border-top:1px solid var(--line)}
.stc-root .stc-dgrow.hl{background:var(--chip);border-radius:10px;border-top-color:transparent}
.stc-root .stc-dgtop{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;line-height:1.35}
.stc-root .stc-dgtop b{font-variant-numeric:tabular-nums;white-space:nowrap}
.stc-root .stc-dgbar{height:8px;border-radius:4px;background:var(--track);margin:7px 0 4px;overflow:hidden}
.stc-root .stc-dgbar i{display:block;height:100%;border-radius:4px}

/* Biểu đồ phân cấp ngang (icicle) */
.stc-root .stc-ic-block{margin-bottom:24px}
.stc-root .stc-ic-root{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 14px;border-radius:10px;background:var(--track);font-size:13px;font-weight:600}
.stc-root .stc-ic-root b{font-variant-numeric:tabular-nums}
.stc-root .stc-ic-row{display:flex;gap:3px;margin-top:3px;height:74px}
.stc-root .stc-ic-seg{min-width:3px;border-radius:8px;padding:8px 10px;overflow:hidden;color:#061a2e;font-size:12px;line-height:1.3;display:flex;flex-direction:column;gap:2px}
.stc-root .stc-ic-seg b{font-size:13px;font-variant-numeric:tabular-nums}
.stc-root .stc-ic-seg.sel{box-shadow:0 0 0 2px var(--ink) inset}
.stc-root .stc-ic-legend{display:grid;gap:2px;margin-top:10px}
.stc-root .stc-ic-li{display:grid;grid-template-columns:minmax(0,1fr) 70px 54px;gap:10px;align-items:baseline;padding:6px 4px;font-size:12.5px;font-variant-numeric:tabular-nums;border-radius:8px}
.stc-root .stc-ic-li.sel{background:var(--chip)}
.stc-root .stc-ic-li .stc-r{text-align:right}
.stc-root .stc-ic-li .stc-m{color:var(--mute)}
/* Màn hình so sánh các kiểu biểu diễn phân cấp */
.stc-root{--conn:rgba(139,167,194,.6)}
html.theme-light .stc-root{--conn:rgba(91,106,128,.55)}
.stc-root .stc-opt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.stc-root .stc-opt-tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;font-size:11px;font-weight:700;background:var(--chip);color:var(--accent);margin-bottom:6px}
.stc-root .stc-opt-tag.rec{background:rgba(79,214,156,.14);color:var(--good)}
.stc-root .stc-opt-when{font-size:12.5px;color:var(--ink2);line-height:1.5;max-width:760px}
.stc-root .stc-opt-when b{color:var(--ink)}

/* A. Sơ đồ cây thẻ số */
.stc-root .stc-oc{display:flex;flex-direction:column;align-items:center}
.stc-root .stc-oc-root{background:var(--card2);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:14px 26px 12px;text-align:center;min-width:320px}
.stc-root .stc-oc-root .stc-k{font-size:12px;color:var(--mute)}
.stc-root .stc-oc-root .stc-v{font-size:28px;font-weight:700;letter-spacing:-.015em;margin:2px 0 6px}
.stc-root .stc-oc-root .stc-v small{font-size:13px;color:var(--mute);font-weight:500;letter-spacing:0}
.stc-root .stc-oc-stem{width:2px;height:24px;background:var(--conn)}
.stc-root .stc-oc-row{display:flex;width:100%}
.stc-root .stc-oc-c{flex:1;position:relative;padding:24px 8px 0;min-width:0}
.stc-root .stc-oc-c::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--conn)}
.stc-root .stc-oc-c.first::before{left:50%}
.stc-root .stc-oc-c.last::before{right:50%}
.stc-root .stc-oc-c::after{content:"";position:absolute;top:0;left:50%;width:2px;height:24px;margin-left:-1px;background:var(--conn)}
.stc-root .stc-oc-card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--cc,var(--s1));border-radius:14px;padding:13px 14px 12px;height:100%}
.stc-root .stc-oc-card .stc-nm{font-size:12.5px;font-weight:600;line-height:1.35;min-height:34px}
.stc-root .stc-oc-card .stc-v{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:6px;font-variant-numeric:tabular-nums}
.stc-root .stc-oc-card .stc-sh{font-size:11.5px;color:var(--mute);margin-top:2px}
.stc-root .stc-oc-card .stc-bar{height:6px;border-radius:3px;background:var(--track);margin:10px 0 10px;overflow:hidden}
.stc-root .stc-oc-card .stc-bar i{display:block;height:100%;border-radius:3px;background:var(--cc,var(--s1));min-width:2px}

/* B. Thanh phân cấp thụt lề */
.stc-root .stc-ib-row{display:grid;grid-template-columns:230px minmax(0,1fr) 84px 58px 76px;gap:14px;align-items:center;padding:11px 0;position:relative}
.stc-root .stc-ib-row.kid{padding-left:34px}
.stc-root .stc-ib-row.kid::before{content:"";position:absolute;left:12px;top:0;width:2px;height:100%;background:var(--conn)}
.stc-root .stc-ib-row.kid.last::before{height:50%}
.stc-root .stc-ib-row.kid::after{content:"";position:absolute;left:12px;top:50%;width:14px;height:2px;background:var(--conn)}
.stc-root .stc-ib-row.rootrow{font-weight:700;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:2px}
.stc-root .stc-ib-row .stc-nm{font-size:13px;font-weight:500;line-height:1.35}
.stc-root .stc-ib-row.rootrow .stc-nm{font-weight:700}
.stc-root .stc-ib-row .stc-tk{height:14px;border-radius:0 5px 5px 0;background:var(--track);position:relative}
.stc-root .stc-ib-row .stc-tk i{position:absolute;left:0;top:0;bottom:0;border-radius:0 5px 5px 0;min-width:2px}
.stc-root .stc-ib-row .stc-r{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.stc-root .stc-ib-row .stc-r.stc-m{color:var(--mute)}
.stc-root .stc-ib-row .stc-dl{justify-self:end}

/* C. Dòng chảy (Sankey) */
.stc-root .stc-sk svg{width:100%;height:auto;display:block}
.stc-root .stc-sk .stc-nm{fill:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:12.5px;font-weight:600}
.stc-root .stc-sk .stc-vv{fill:var(--ink2);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:12.5px;font-weight:500}
.stc-root .stc-sk .stc-lt{fill:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:13px;font-weight:700}
.stc-root .stc-sk .stc-lv{fill:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:22px;font-weight:700}
.stc-root .stc-sk .stc-lm{fill:var(--mute);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:11.5px;font-weight:500}

/* D. Cầu nối (waterfall) */
.stc-root .stc-wf{position:relative;height:290px;margin-left:64px}
.stc-root .stc-wf .stc-gl2{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.stc-root .stc-wf .stc-gt{position:absolute;left:-64px;width:56px;text-align:right;font-size:11px;color:var(--mute);transform:translateY(50%)}
.stc-root .stc-wf .stc-bar2{position:absolute;border-radius:4px 4px 0 0}
.stc-root .stc-wf .stc-vl2{position:absolute;text-align:center;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stc-root .stc-wf .stc-cn{position:absolute;height:0;border-top:1.5px dashed var(--conn)}
.stc-root .stc-wfl{display:flex;margin-left:64px;margin-top:10px}
.stc-root .stc-wfl span{text-align:center;font-size:12px;line-height:1.3;color:var(--ink2);padding:0 4px}

/* E. Donut kèm chú giải */
.stc-root .stc-dl2{display:grid;grid-template-columns:minmax(0,1fr) 120px 84px 58px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.stc-root .stc-dl2 .stc-tk{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.stc-root .stc-dl2 .stc-tk i{display:block;height:100%;border-radius:4px}
.stc-root .stc-dl2 .stc-r{text-align:right;font-variant-numeric:tabular-nums}
.stc-root .stc-dl2 .stc-r.stc-m{color:var(--mute)}

/* Bố cục trình khám phá phân cấp: cột chọn chỉ tiêu + vùng sơ đồ */
.stc-root .stc-explore{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.stc-root .stc-nvh{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:2px 8px 6px}
.stc-root .stc-nvg{font-size:12.5px;font-weight:700;padding:12px 8px 4px;color:var(--ink)}
.stc-root .stc-nvi{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;border:0;border-left:3px solid transparent;background:none;color:var(--ink2);font:inherit;font-size:12.5px;line-height:1.35;cursor:pointer}
.stc-root .stc-nvi:hover{background:var(--card2)}
.stc-root .stc-nvi.on{background:var(--chip);color:var(--ink);border-left-color:var(--accent);font-weight:600}

/* Sơ đồ cây thẻ số dùng được cho mọi cấp */
.stc-root .stc-oc-c.first.last::before{display:none}
.stc-root .stc-oc-stem{margin:0 auto}
.stc-root .stc-oc-c > .stc-oc-row{width:100%}
.stc-root .stc-oc-root .stc-v span{display:inline}
.stc-root .stc-oc-root .stc-v small{margin-left:6px}
.stc-root button.stc-oc-card{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;height:auto;transition:border-color .12s}
.stc-root button.stc-oc-card:hover{border-right-color:var(--conn);border-bottom-color:var(--conn);border-left-color:var(--conn)}
.stc-root .stc-oc-card.sel{box-shadow:0 0 0 2px var(--accent)}
.stc-root .stc-oc-card .stc-sh{min-height:15px}
.stc-root .stc-oc-card .stc-v{font-size:21px}
.stc-root .stc-oc-card .stc-nm{font-size:12.5px}
.stc-root .stc-wf .stc-bar2.sel{box-shadow:0 0 0 2px var(--ink)}
.stc-root .stc-fl{display:grid;gap:7px}

.stc-root .stc-rawh.nar,.stc-root .stc-rawrow.nar{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 68px 62px;gap:8px}

/* ---- Bổ sung cho bản chạy thật ---- */
html.theme-green .stc-root{--page:#eef9f3;--card:#ffffff;--card2:#f2fbf6;--line:rgba(31,41,55,.13);--ink:#1f2937;--ink2:#3d4f44;--mute:#566a5e;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--prev:#b3c9bb;--track:#dff3e7;--good:#006300;--bad:#b3261e;--dn:#e34948;--warn:#8a5a00;--accent:#2e9d5b;--btn:#1e7a44;--chip:rgba(46,157,91,.10);--conn:rgba(86,106,94,.55)}
html.theme-light .stc-root{--accent:#9d151c;--btn:#9d151c;--chip:rgba(157,21,28,.08)}
.stc-wrap{max-width:none;width:100%}
#modalBody .stc-root{background:transparent;overflow:visible}
.stc-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.stc-tl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.stc-chips{display:flex;gap:8px;flex-wrap:wrap}
.stc-root button{font-family:inherit}
.stc-root button.stc-lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.stc-root button.stc-lnk:hover{text-decoration:underline}
.stc-root button.stc-kpi,.stc-root button.stc-gcard{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .12s}
.stc-root button.stc-kpi:hover,.stc-root button.stc-gcard:hover{border-color:var(--accent)}
.stc-root button.stc-gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;min-width:0}
.stc-root .stc-btn:disabled{opacity:.45;cursor:not-allowed}
.stc-root .stc-sel select:disabled{opacity:.6}
.stc-root .stc-warnbox{margin-top:12px}
.stc-root .stc-x{margin-left:6px}
@media(max-width:1000px){
.stc-root .stc-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.stc-root .stc-g2,.stc-root .stc-g21,.stc-root .stc-g3{grid-template-columns:minmax(0,1fr)}
.stc-root .stc-top{flex-direction:column}
.stc-root .stc-ctrls{flex-wrap:wrap}
}
.stc-root svg .stc-ax{fill:var(--mute);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:10.5px;font-weight:500}
.stc-root svg .stc-vl{fill:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:12px;font-weight:700}
/* biểu đồ đường dùng chung (js/core/line-chart.js): lcFit vẽ lại theo bề rộng thật (1 đơn vị SVG = 1px); max-height chỉ chặn bản 560 lúc chưa đo */
.stc-root .lc-box{width:100%;min-width:0}
.stc-root svg.lc{width:100%;height:auto;max-height:300px;display:block}
.stc-root button.stc-kpi,.stc-root button.stc-gcard{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
/* dòng "Xem nhóm … ›" luôn ở đáy thẻ, các thẻ cùng hàng thẳng hàng dù số dòng chỉ tiêu khác nhau */
.stc-root button.stc-gcard .stc-gmore{margin-top:auto;padding-top:10px}
.stc-root button.stc-oc-card{display:block}
.stc-root .stc-rawrow span:nth-child(2),.stc-root .stc-rawh span:nth-child(2){text-align:left}
.stc-root .stc-nodata{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;border:1px dashed var(--line);background:var(--card2);color:var(--ink2);font-size:12.5px;line-height:1.5;margin-bottom:12px}
.stc-root .stc-nodata svg{flex:0 0 auto;width:20px;height:20px;margin-top:1px;color:var(--mute)}
.stc-root .stc-nodata b{color:var(--ink)}
.stc-root .stc-blank{opacity:.72}
.stc-root .stc-blank .stc-stack{background:var(--track);border-radius:3px}
.stc-btn.demoon{background:rgba(242,182,54,.14);border-color:rgba(242,182,54,.5);color:var(--warn)}
.stc-root .stc-focus{outline:2px solid var(--accent);outline-offset:3px;border-radius:16px;animation:stcpulse 1.6s ease-out 1}
@keyframes stcpulse{0%{outline-color:transparent}30%{outline-color:var(--accent)}100%{outline-color:var(--accent)}}

/* Hộp chọn Năm / Kỳ tự dựng (thay <select> gốc) */
.stc-root .stc-dd{position:relative;display:inline-block}
.stc-root .stc-ddb{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;transition:border-color .12s,background .12s}
.stc-root .stc-ddb:hover{border-color:var(--accent)}
.stc-root .stc-dd.open .stc-ddb{border-color:var(--accent);box-shadow:0 0 0 3px var(--chip)}
.stc-root .stc-ddb:focus-visible,.stc-root .stc-ddo:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stc-root .stc-ddb small{color:var(--mute);font-size:11.5px;font-weight:500}
.stc-root .stc-ddb b{font-weight:700;min-width:44px;text-align:left}
.stc-root .stc-ddc{width:7px;height:7px;margin:-3px 0 0 2px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .15s}
.stc-root .stc-dd.open .stc-ddc{transform:rotate(-135deg);margin-top:3px}
.stc-root .stc-ddl{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--card2);box-shadow:0 14px 34px rgba(0,0,0,.42);display:flex;flex-direction:column;gap:2px}
html.theme-light .stc-root .stc-ddl,html.theme-green .stc-root .stc-ddl{background:#fff;box-shadow:0 12px 28px rgba(15,23,42,.18)}
.stc-root .stc-ddo{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:500;text-align:left;cursor:pointer}
.stc-root .stc-ddo:hover:not(:disabled){background:var(--chip)}
.stc-root .stc-ddo.on{background:var(--chip);color:var(--accent);font-weight:700}
.stc-root .stc-ddo i{font-style:normal;font-weight:700}
.stc-root .stc-ddo.off{color:var(--mute);cursor:not-allowed;opacity:.75}
.stc-root .stc-ddo em{font-style:normal;font-size:11px;color:var(--mute)}

/* Khung chờ và màn lỗi tải số liệu */
.stc-root .stc-skel{position:relative;overflow:hidden;border-radius:8px;background:var(--track)}
.stc-root .stc-skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transform:translateX(-100%);animation:stc-shimmer 1.4s infinite}
html.theme-light .stc-root .stc-skel::after,html.theme-green .stc-root .stc-skel::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent)}
@keyframes stc-shimmer{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.stc-root .stc-skel::after{animation:none}}
.stc-root .stc-err svg{width:30px;height:30px;color:var(--warn)}
.stc-root .stc-btn:disabled{opacity:.55;cursor:not-allowed}

/* Nút phóng to/thu nhỏ 1 thẻ biểu đồ ra toàn màn hình popup */
.stc-root .stc-zoombtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--mute);cursor:pointer;flex:0 0 auto}
.stc-root .stc-zoombtn:hover{color:var(--accent);border-color:var(--accent)}
.stc-root .stc-zoombtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--chip)}

/* Lớp phủ toàn màn hình khi 1 thẻ biểu đồ được phóng to. Tách thẻ ra khỏi #modalBody và đặt vào đây (script
   trong dashboard-stc.js) để không bị khung popup cắt bớt; mang class stc-root nên vẫn theo đúng theme đang chọn. */
.stc-zoom-layer.stc-root{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:2vh 2vw;overflow:auto;background:rgba(3,10,20,.82);animation:stc-zoomin .15s ease-out}
html.theme-light .stc-zoom-layer.stc-root,html.theme-green .stc-zoom-layer.stc-root{background:rgba(15,23,42,.6)}
@keyframes stc-zoomin{from{opacity:0}to{opacity:1}}
/* Phóng gần kín khung: bề rộng lấy 1 mốc cố định (min 1180px/bề ngang lớp phủ); độ phóng theo chiều cao (biến
   --stc-zoom, tính bằng JS trong stcApplyZoom để lấp vừa khung, không chừa khoảng trống thừa) áp cho cả thẻ nên
   chữ lẫn biểu đồ cùng to lên theo 1 tỉ lệ, không chỉ nới khung rỗng quanh nội dung cũ. */
.stc-zoom-layer .stc-card.stc-zoomed{width:min(1180px,100%);margin:auto;box-shadow:0 30px 90px rgba(0,0,0,.5);zoom:var(--stc-zoom,1)}
@media (prefers-reduced-motion:reduce){.stc-zoom-layer.stc-root{animation:none}}

/* ===== css/sgd.css ===== */
/* ============================== SỞ GD&ĐT — BỔ SUNG GIAO DIỆN FORM CHỈ TIÊU ==============================
   Form dùng chung bộ lớp stc- của css/stc.css (cùng thiết kế với Sở Tài chính, 3 giao diện tối/sáng/xanh); file này chỉ
   thêm các thành phần riêng của Sở GD&ĐT, tiền tố sgd-, luôn nằm trong .stc-root.sgd-root. */

/* Chiều tốt/xấu: chỉ tiêu mà tăng là xấu (cận thị, phòng học tạm) */
.stc-root .stc-dl.up.bad{color:var(--bad)}
.stc-root .stc-dl.down.good{color:var(--good)}

/* Tiêu đề thẻ bấm được → xem theo 126 phường/xã */
.stc-root button.sgd-ctl{background:none;border:0;padding:0;font:inherit;font-size:15px;font-weight:600;line-height:1.35;color:var(--ink);text-align:left;cursor:pointer}
.stc-root button.sgd-ctl::after{content:" ›";color:var(--accent)}
.stc-root button.sgd-ctl:hover{color:var(--accent)}
.stc-root .sgd-demo{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(242,182,54,.13);color:var(--warn);border:1px solid rgba(242,182,54,.42);white-space:nowrap}
.stc-root .sgd-demo i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.stc-root button.stc-gcard.sgd-alt{background:var(--card2)}

/* Biểu đồ cột năm nay / năm trước (học sinh theo khối) */
.stc-root .sgd-cc{display:flex;align-items:flex-end;gap:8px;height:196px;border-bottom:1px solid var(--line);padding:0 4px}
.stc-root .sgd-cc .sgd-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.stc-root .sgd-cc .sgd-cv{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.stc-root .sgd-cc .sgd-pair{display:flex;gap:3px;align-items:flex-end}
.stc-root .sgd-cc .sgd-b1{width:16px;background:var(--s1);border-radius:3px 3px 0 0}
.stc-root .sgd-cc .sgd-b0{width:16px;background:var(--prev);border-radius:3px 3px 0 0}
.stc-root .sgd-sepc{width:1px;align-self:stretch;background:var(--line);flex:0 0 1px}
.stc-root .sgd-ccl{display:flex;gap:8px;padding:6px 4px 0}
.stc-root .sgd-ccl span{flex:1;text-align:center;font-size:11.5px;color:var(--ink2);min-width:0}
.stc-root .sgd-ccl .sgd-sepc{flex:0 0 1px}

/* Hàng tỷ lệ (không cộng dồn) */
.stc-root .sgd-rt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 64px 92px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.stc-root .sgd-rt:first-child{border-top:0}
.stc-root .sgd-rt .sgd-nm{font-weight:500;line-height:1.35}
.stc-root .sgd-rt .sgd-nm small{display:block;color:var(--mute);font-size:11.5px;font-weight:500}
.stc-root .sgd-rt .sgd-tk{position:relative;height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.stc-root .sgd-rt .sgd-tk i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--s1);min-width:2px}
.stc-root .sgd-rt .sgd-r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.stc-root .sgd-rt .stc-dl{justify-self:end}

/* Thanh tiến độ có vạch mốc */
.stc-root .stc-pg .stc-trk{position:relative}
.stc-root .sgd-mark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.stc-root .stc-pg .stc-row small{color:var(--mute);font-size:11.5px;font-weight:500;margin-left:6px}

/* Màn 126 phường/xã */
.stc-root .sgd-pills{display:flex;gap:8px;flex-wrap:wrap}
.stc-root .sgd-pill{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.stc-root .sgd-pill:hover{border-color:var(--conn)}
.stc-root .sgd-pill.on{background:var(--chip);color:var(--ink);border-color:var(--accent)}
.stc-root .sgd-search{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.stc-root .sgd-search small{color:var(--mute);font-size:11.5px}
.stc-root .sgd-search input{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;width:180px;height:34px;outline:none}
.stc-root .sgd-search input::placeholder{color:var(--mute)}
.stc-root .sgd-xt-box{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.stc-root .sgd-xt-row{display:grid;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font-size:12.5px;font-variant-numeric:tabular-nums;min-width:0}
.stc-root .sgd-xt-row > *{min-width:0}
.stc-root .sgd-xt-row.on{background:var(--chip)}
.stc-root .sgd-xt-head{position:sticky;top:0;z-index:1;background:var(--card2);border-top:0;font-size:11.5px;font-weight:600;color:var(--mute)}
.stc-root .sgd-xt-row .sgd-num{text-align:right;justify-self:end}
.stc-root .sgd-xt-row .sgd-no{color:var(--mute)}
.stc-root .sgd-xt-row .sgd-strong{font-weight:700}
.stc-root .sgd-hbtn{border:0;background:none;padding:4px 0;font:inherit;font-size:11.5px;font-weight:600;color:var(--mute);cursor:pointer;text-align:right;justify-self:end;min-height:28px}
.stc-root .sgd-hbtn.left{text-align:left;justify-self:start}
.stc-root .sgd-hbtn:hover{color:var(--ink)}
.stc-root .sgd-hbtn span{color:var(--accent)}
.stc-root .sgd-xbtn{border:0;background:none;padding:4px 0;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:28px;max-width:100%}
.stc-root .sgd-xbtn:hover{color:var(--accent);text-decoration:underline}
.stc-root .sgd-ok{color:var(--good);font-weight:600}
.stc-root .sgd-mute{color:var(--mute)}
.stc-root .stc-mchip .stc-hint{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stc-root .sgd-tbl-l th,.stc-root .sgd-tbl-l td{text-align:left;vertical-align:top}
.stc-root .sgd-mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;word-break:break-all}
.stc-root ol.sgd-rules{margin:0;padding-left:20px;display:grid;gap:7px;font-size:12.5px;color:var(--ink2);line-height:1.5}

/* Khung hồ sơ phường/xã trượt từ bên phải (SGD_XA_DRAWER) — đè lên bảng, bảng phía sau giữ nguyên chỗ đang xem */
.stc-root .sgd-dw-bg{position:fixed;inset:0;z-index:60;background:rgba(2,10,20,.45)}
.stc-root .sgd-dw{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(780px,94%);display:flex;flex-direction:column;background:var(--page);border-left:1px solid var(--line);box-shadow:-18px 0 40px rgba(0,0,0,.35)}
.stc-root .sgd-dw-anim.sgd-dw{animation:sgdDwIn .22s ease-out}
.stc-root .sgd-dw-anim.sgd-dw-bg{animation:sgdDwFade .22s ease-out}
@keyframes sgdDwIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes sgdDwFade{from{opacity:0}to{opacity:1}}
.stc-root .sgd-dw-top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.stc-root .sgd-dw-nav{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.stc-root .sgd-dw-nav:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.stc-root .sgd-dw-nav[disabled]{opacity:.4;cursor:default}
.stc-root .sgd-dw-pos{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.stc-root .sgd-dw-x{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.stc-root .sgd-dw-x:hover{border-color:var(--accent);color:var(--accent)}
.stc-root .sgd-dw-body{flex:1;min-height:0;overflow:auto;padding:14px 16px 20px}
.stc-root .sgd-dw-body .stc-mchips{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(prefers-reduced-motion:reduce){.stc-root .sgd-dw-anim.sgd-dw,.stc-root .sgd-dw-anim.sgd-dw-bg{animation:none}}

/* Số liệu gốc (4 cột: endpoint · trường dữ liệu · lọc · giá trị) */
.stc-root .sgd-rawh,.stc-root .sgd-raw{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.8fr) 84px;gap:8px;padding:9px 6px;font-size:12px;font-variant-numeric:tabular-nums}
.stc-root .sgd-rawh{font-size:11px;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line)}
.stc-root .sgd-raw{border-top:1px solid var(--line)}
.stc-root .sgd-raw span:last-child,.stc-root .sgd-rawh span:last-child{text-align:right}

/* Băng Tổng quan ngoài lưới chỉ tiêu: 6 thẻ nhóm xếp 3 cột */
.stc-root .sgd-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
/* Màn 126 phường/xã: cột chọn chỉ tiêu KÉO DÀI bằng cột bên phải (trước đây cột trái hết sớm hơn khối thẻ tổng hợp +
   bảng 126 đơn vị, để lại một khoảng trống tối bên dưới — anh báo 2026-09-29). Không dùng "bám khi cuộn" vì bảng có khung
   cuộn riêng nên cả khối chỉ cao hơn cột trái một chút, bám không có tác dụng. */

/* ============================== TRUNG TÂM PHỤC VỤ HCC — BỔ SUNG GIAO DIỆN FORM CHỈ TIÊU ==============================
   Form dùng chung bộ lớp stc- (css/stc.css) và các thành phần sgd- (css/sgd.css: bảng đơn vị, khung trượt, biểu đồ cột...);
   file này chỉ thêm vài thành phần riêng, tiền tố hcc-, luôn nằm trong .stc-root.hcc-root. */

/* Nhãn "Sở" đứng trước tên đơn vị khối sở/ngành trong bảng đơn vị */
.stc-root .hcc-tag{display:inline-block;font-style:normal;font-size:10px;font-weight:700;line-height:16px;padding:0 5px;margin-right:6px;border-radius:4px;background:var(--chip);color:var(--accent);vertical-align:1px}

/* Mức cung cấp trực tuyến của một thủ tục */
.stc-root .hcc-mu{display:inline-block;font-style:normal;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.stc-root .hcc-mu.ok{color:var(--good)}
.stc-root .hcc-mu.mid{color:var(--warn)}
.stc-root .hcc-mu.no{color:var(--bad)}

/* Màn "Theo đơn vị": cột Chỉ tiêu bên trái ngắn hơn phần bên phải (thẻ tổng hợp + bảng 140 đơn vị) nên từng để hở một
   khoảng trống dưới cột (anh góp ý 2026-09-29, 2 lần). Cách sửa: khung cột kéo dài bằng cả chiều cao bên phải (nền thẻ
   phủ kín, không còn lỗ). Danh sách chỉ tiêu CỐ ĐỊNH ở đầu cột, không đi theo khi cuộn (anh yêu cầu 2026-09-29, lần 3). */
.stc-root.hcc-root .stc-explore{align-items:stretch}
.stc-root.hcc-root .hcc-nav{display:flex;flex-direction:column}

/* Khung hồ sơ đơn vị: 6 ô số xếp đều 3 cột × 2 hàng (stc-mchips mặc định là flex nên ô thứ 6 rơi xuống một mình) */
.stc-root.hcc-root .sgd-dw-body .stc-mchips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}

/* 8 ô số chính (thêm "Hồ sơ đang xử lý trễ hạn" 02/10/2026): lưới stc mặc định 7 cột làm ô thứ 8 rơi xuống một mình.

}

    let guard = 0;
    while (ex > 0 && guard < 200000) {

/* ===== js/features/dashboard-hcc.js ===== */
/* ============================== TRUNG TÂM PHỤC VỤ HÀNH CHÍNH CÔNG — FORM CHỈ TIÊU MỚI ==============================
   Form riêng của Trung tâm Phục vụ HCC Thành phố, cùng khuôn với form Sở Tài chính (dashboard-stc.js) và Sở GD&ĐT
   (dashboard-sgd.js), hiển thị trong popup chuẩn của IOC (#modal). 9 màn: Trang chủ, 5 màn nhóm, Chi tiết theo cấp bậc
   (sơ đồ cây thẻ số + cầu nối + xu hướng 6 quý), Chỉ tiêu theo đơn vị (các sở/ngành trong HCC_SO + 126 phường/xã, khung hồ sơ trượt),
   Nguồn dữ liệu và giả định.
   Số liệu: hcc-data.js (SỐ GIẢ LẬP theo schema API hcc_tkpro; API chưa có số thật). Giao diện dùng lớp stc- (css/stc.css),
   các thành phần sgd- (css/sgd.css) và lớp hcc- (css/hcc.css), gốc là .stc-root.hcc-root. Cần: esc() (helpers.js),
   openModal/closeModal. */

const HCC_UI = { open: false, screen: 'home', group: 'tn', tree: 'tiepnhan', pick: null, period: HCC_PERIODS[0].id, dd: null, role: null,
  xa: { ind: 'dunghan', q: '', f: 'all', sk: 'v', sd: -1, sel: null, order: [], anim: false }, focusQ: false };
/* false = KHÔNG hiện mã kỹ thuật trên giao diện (tên endpoint, trường dữ liệu kiểu total_SH, totalTreHan, màn "Nguồn dữ liệu",
   bảng "Số liệu gốc từ API") — anh yêu cầu 2026-09-29, cùng quy tắc với SGD_SHOW_TECH. Ẩn bằng cờ, code giữ nguyên;
   true = hiện lại (dùng khi đối chiếu với bên cung cấp API). */
const HCC_SHOW_TECH = false;
const HCC_PAL =['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];
const HCC_ICON_INFO = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>';
const HCC_ICON_DL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>';
const HCC_ICON_DB = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>';
const HCC_KHOI_COLOR = { so: 'var(--s4)', p: 'var(--s1)', x: 'var(--s3)' };

/* ---------- Tiện ích ---------- */
function hccE(s) { return typeof esc === 'function' ? esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function hccFmt(n, d) {
  if (n == null || !isFinite(n)) return '—';
  d = d || 0;
  const p = Math.abs(n).toFixed(d).split('.');
  return (n < 0 && Math.abs(n) >= Math.pow(10, -d) / 2 ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : '');
}
function hccSgn(n, d) { return n == null ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '') + hccFmt(Math.abs(n), d); }
function hccDiv(a, b, m) { return a == null || b == null || !b ? null : (a / b) * (m == null ? 100 : m); }
function hccLnk(label, act) { return '<button type="button" class="stc-lnk" onclick="' + act + '">' + hccE(label) + '</button>'; }
function hccNote(html) { return '<div class="stc-note">' + HCC_ICON_INFO + '<div>' + html + '</div></div>'; }
function hccEmpty(title, text) { return '<div class="stc-empty">' + HCC_ICON_DB + '<b>' + hccE(title) + '</b><span style="font-size:12px;max-width:420px">' + hccE(text) + '</span></div>'; }
function hccJs(s) { return hccE(JSON.stringify(s)); }
let HCC_CITY = {};
function hccCityP(p) { if (p == null) return null; if (!HCC_CITY[p]) HCC_CITY[p] = hccCity(p); return HCC_CITY[p]; }
function hccNP() { const p = HCC_UI.period, pp = hccPrevPeriod(p); return { p: p, pp: pp, C: hccCityP(p), P: pp != null ? hccCityP(pp) : null }; }
function hccShortName(s) { return String(s).replace(/^(Phường|Xã|Sở) /, ''); }
function hccKindLabel(k) { return k === 'so' ? 'sở, ngành' : k === 'x' ? 'xã' : 'phường'; }

/* Chú thích khi rê chuột vào mũi tên tăng/giảm (thuộc tính title) — cùng quy ước với sgdDlTip. kind: 'rate' = điểm %,
   'abs' = chênh lệch số thường, 'rel' = % so với chính nó. better: 'high' / 'low' / 'none'. cmpTP: so với mức Thành phố. */
function hccDlTip(kind, better, now, prev, d, cmpTP) {
  const L = [];
  const fm = (x) => (kind === 'rate' ? hccFmt(x, 1) + '%' : hccFmt(x, kind === 'abs' ? d : Number.isInteger(x) ? 0 : 1));
  const was = cmpTP ? 'Mức Thành phố' : 'Kỳ trước', is = cmpTP ? 'đơn vị này' : 'kỳ này';
  if (kind === 'rate') L.push('Đơn vị "điểm %" (điểm phần trăm): lấy tỷ lệ ' + is + ' TRỪ thẳng ' + (cmpTP ? 'tỷ lệ của Thành phố' : 'tỷ lệ kỳ trước') + '.');
  else if (kind === 'abs') L.push('Chênh lệch trực tiếp: số ' + is + ' trừ ' + (cmpTP ? 'mức Thành phố' : 'số kỳ trước') + '.');
  else L.push('Tăng/giảm bao nhiêu % so với chính nó kỳ trước: (kỳ này ÷ kỳ trước − 1) × 100.');
  if (now != null && prev != null) {
    const v = kind === 'rel' ? (prev ? (now / prev - 1) * 100 : null) : now - prev;
    if (v != null) {
      const dd = kind === 'abs' ? d : 1, unit = kind === 'rate' ? ' điểm %' : kind === 'rel' ? '%' : '';
      const r = Math.round(v * Math.pow(10, dd)) / Math.pow(10, dd);
      L.push(was + ' ' + fm(prev) + ' → ' + is + ' ' + fm(now) + ': ' + (r === 0 ? 'không đổi' : (r > 0 ? (cmpTP ? 'cao hơn ' : 'tăng ') : (cmpTP ? 'thấp hơn ' : 'giảm ')) + hccFmt(Math.abs(v), dd) + unit) + '.');
    }
  }
  if (kind === 'rate') L.push('Ví dụ: 92,1% lên 92,9% là tăng 0,8 điểm %, không phải tăng 0,8%.');
  if (!cmpTP) L.push(better === 'low' ? 'Chỉ tiêu này giảm là tốt: tăng tô đỏ, giảm tô xanh.' : better === 'none' ? 'Tăng hay giảm không tự thân tốt/xấu nên tô màu trung tính.' : 'Chỉ tiêu này tăng là tốt: tăng tô xanh, giảm tô đỏ.');
  return L.join('\n');
}
/* Mũi tên tăng/giảm — cùng quy ước với form Sở GD&ĐT. o.rate: chênh lệch điểm %, o.abs: chênh lệch số thường,
   o.inv: giảm là tốt, o.neutral: màu trung tính. */
function hccDl(now, prev, o) {
  o = o || {};
  if (now == null || prev == null) return '';
  const v = o.rate || o.abs ? now - prev : (prev ? (now / prev - 1) * 100 : null);
  if (v == null) return '';
  const d = o.d != null ? o.d : 1;
  const r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d);
  let cls = r > 0 ? 'up' : r < 0 ? 'down' : 'flat';
  if (cls !== 'flat') { if (o.inv) cls += r > 0 ? ' bad' : ' good'; else if (o.neutral) cls += ' n'; }
  const txt = cls === 'flat' ? 'Không đổi' : hccFmt(Math.abs(v), d) + (o.abs ? '' : o.rate ? ' điểm %' : '%');
  const tip = hccDlTip(o.rate ? 'rate' : o.abs ? 'abs' : 'rel', o.inv ? 'low' : o.neutral ? 'none' : 'high', now, prev, d);
  return '<span class="stc-dl ' + cls + '" title="' + hccE(tip) + '" style="cursor:help">' + txt + (o.ref ? ' <span class="stc-ref">' + hccE(o.ref) + '</span>' : '') + '</span>';
}
function hccLegend(p, pp) {
  return '<div class="stc-lg"><span><i style="background:var(--s1)"></i>' + hccPeriodLabel(p) + '</span>' + (pp != null ? '<span><i style="background:var(--prev)"></i>' + hccPeriodLabel(pp) + '</span>' : '') + '</div>';
}
function hccBig(v, unit, dl) { return '<div class="stc-bigrow"><div class="stc-big">' + v + (unit ? '<small>' + hccE(unit) + '</small>' : '') + '</div>' + (dl || '') + '</div>'; }
function hccCmp(label, now, prev, mx, dl, first) {
  const w = (v) => (v > 0 ? Math.max(0.2, (v / (mx || 1)) * 100) : 0);
  return '<div class="stc-cmp"' + (first ? ' style="margin-top:8px"' : '') + '><div class="stc-nm">' + hccE(label) + '</div><div class="stc-bars">' +
    '<div class="stc-br"><div class="stc-tr"><div class="stc-b" style="width:' + w(now).toFixed(2) + '%"></div></div><div class="stc-val">' + hccFmt(now) + '</div></div>' +
    (prev != null ? '<div class="stc-br"><div class="stc-tr"><div class="stc-b p" style="width:' + w(prev).toFixed(2) + '%"></div></div><div class="stc-val p">' + hccFmt(prev) + '</div></div>' : '') +
    '</div>' + (dl || '<span class="stc-dl flat">—</span>') + '</div>';
}
function hccPg(label, small, pct, mark, color, d) {
  const w = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return '<div class="stc-pg"><div class="stc-row"><span class="stc-nm">' + hccE(label) + (small ? '<small>' + hccE(small) + '</small>' : '') + '</span><span class="stc-pv">' + (pct == null ? '—' : hccFmt(pct, d == null ? 1 : d) + '%') + '</span></div><div class="stc-trk"><div class="stc-fill" style="width:' + w.toFixed(2) + '%' + (color ? ';background:' + color : '') + '"></div>' + (mark != null ? '<i class="sgd-mark" style="left:' + Math.max(0, Math.min(100, mark)).toFixed(2) + '%"></i>' : '') + '</div></div>';
}
function hccDonut(items, total, center, unit, label) {
  const C = 2 * Math.PI * 54;
  let cum = 0, segs = '';
  items.forEach((it) => {
    if (!(it.v > 0) || !(total > 0)) return;
    const len = (it.v / total) * C;
    segs += '<circle class="stc-seg" cx="80" cy="80" r="54" stroke="' + it.c + '" stroke-dasharray="' + Math.max(0.6, len - 2.5).toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="' + (-cum).toFixed(1) + '"/>';
    cum += len;
  });
  const fs = center.length > 8 ? 14 : center.length > 6 ? 17 : 21;
  return '<svg viewBox="0 0 160 160" role="img" aria-label="' + hccE(label) + '"><circle class="stc-trk" cx="80" cy="80" r="54"/><g transform="rotate(-90 80 80)">' + segs + '</g><text class="stc-tv" x="80" y="80" text-anchor="middle" style="font-size:' + fs + 'px">' + hccE(center) + '</text><text class="stc-tu" x="80" y="96" text-anchor="middle">' + hccE(unit) + '</text></svg>';
}
function hccStack(items) { return '<div class="stc-stack" style="margin-top:14px">' + items.map((it) => '<i style="flex:' + Math.max(0, it.v) + ';background:' + it.c + '" title="' + hccE(it.l || '') + '"></i>').join('') + '</div>'; }
/* Biểu đồ cột theo 6 quý (cũ → mới), cột của kỳ đang chọn tô đậm. vals: số theo HCC_PERIODS (mới → cũ). */
function hccCols(vals, show, unitTxt) {
  const ids = HCC_PERIODS.map((p) => p.id).slice().reverse(), vs = vals.slice().reverse();
  const mx = Math.max.apply(null, vs.filter((v) => v != null).concat([1]));
  const cols = ids.map((id, i) => {
    const v = vs[i], on = id === HCC_UI.period;
    return '<div class="sgd-col"><span class="sgd-cv">' + (v == null ? '—' : show(v)) + '</span><div class="sgd-pair"><div class="' + (on ? 'sgd-b1' : 'sgd-b0') + ' hcc-cb" style="height:' + Math.round(((v || 0) / mx) * 150) + 'px" title="' + hccE(hccPeriodLabel(id) + ': ' + (v == null ? '—' : show(v))) + '"></div></div></div>';
  }).join('');
  return '<div class="sgd-cc">' + cols + '</div><div class="sgd-ccl">' + ids.map((id) => '<span' + (id === HCC_UI.period ? ' style="color:var(--ink);font-weight:700"' : '') + '>' + hccPeriodShort(id) + '</span>').join('') + '</div>' + (unitTxt ? '<div class="stc-hint" style="margin-top:8px">' + hccE(unitTxt) + '</div>' : '');
}
function hccSeries(f) { return HCC_PERIODS.map((p) => { const C = hccCityP(p.id); return C ? f(C) : null; }); }

/* ---------- Khung chung: đầu màn, thẻ, chân màn ---------- */
function hccDd(id, label, cur, opts, handler) {
  const open = HCC_UI.dd === id;
  const cv = opts.find((o) => String(o.v) === String(cur));
  const list = open ? '<div class="stc-ddl" role="listbox" aria-label="' + hccE(label) + '">' + opts.map((o) => {
    const on = String(o.v) === String(cur);
    return '<button type="button" role="option" aria-selected="' + on + '" class="stc-ddo' + (on ? ' on' : '') + '" onclick="' + handler + '(' + hccJs(o.v) + ')"><span>' + hccE(o.text) + '</span>' + (on ? '<i>✓</i>' : '') + '</button>';
  }).join('') + '</div>' : '';
  return '<div class="stc-dd' + (open ? ' open' : '') + '"><button type="button" class="stc-ddb" aria-haspopup="listbox" aria-expanded="' + open + '" onclick="hccDdToggle(\'' + id + '\')"><small>' + hccE(label) + '</small><b>' + hccE(cv ? cv.text : '—') + '</b><span class="stc-ddc"></span></button>' + list + '</div>';
}
function hccHeader(back) {
  const b = back === 'home' ? hccLnk('← Tổng quan', "hccGo('home')") : back && back.group ? hccLnk('← ' + back.label, "hccGo('group','" + back.group + "')") : '';
  const pOpts = HCC_PERIODS.map((p) => ({ v: p.id, text: hccPeriodLabel(p.id) }));
  return '<div class="stc-toolbar"><div class="stc-tl">' + b + '<span class="sgd-demo"><i></i>Số liệu giả lập · chưa có số liệu thật từ Trung tâm Phục vụ HCC</span></div>' +
    '<div class="stc-ctrls">' + hccDd('period', 'Kỳ báo cáo', HCC_UI.period, pOpts, 'hccSetPeriod') + (typeof indicatorEntryBtnHtml === 'function' ? indicatorEntryBtnHtml() : '') + '<button type="button" class="stc-btn primary" onclick="hccExport()">' + HCC_ICON_DL + 'Xuất Excel</button></div></div>';
}
function hccFoot() {
  return '<div class="stc-foot"><span>Kỳ báo cáo (quý) và cách tính một số chỉ tiêu đang theo giả định, chờ Trung tâm Phục vụ HCC xác nhận.</span><span>Số liệu giả lập · ' + hccPeriodLabel(HCC_UI.period) + '</span></div>';
}
/* Thẻ chỉ tiêu: tiêu đề bấm được → xem theo đơn vị (o.xa); "Chi tiết ›" → sơ đồ cây (o.tree) */
function hccCard(o) {
  const title = o.xa ? '<button type="button" class="sgd-ctl" onclick="hccXa(\'' + o.xa + '\')" title="Xem theo sở, ngành và 126 phường/xã">' + hccE(o.title) + '</button>' : '<h3 class="stc-ct">' + hccE(o.title) + '</h3>';
  const right = (o.tree ? hccLnk('Chi tiết ›', "hccDetail('" + o.tree + "')") : '') + (o.src && (HCC_SHOW_TECH || o.warn) ? '<span class="stc-bd' + (o.warn ? ' warn' : '') + '">' + hccE(o.src) + '</span>' : '');
  return '<div class="stc-card"><div class="stc-ch"><div>' + title + '<div class="stc-cs">' + hccE(o.sub || '') + '</div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">' + right + '</div></div>' + o.body + '</div>';
}
function hccSubP(unit) { const n = hccNP(); return hccPeriodLabel(n.p) + (n.pp != null ? ' so với ' + hccPeriodLabel(n.pp) : '') + (unit ? ' · ' + unit : ''); }

/* ---------- Số tổng hợp dùng chung (trang chủ, băng tổng quan) ---------- */

        '<div class="stc-hint" style="margin-top:10px">Xếp theo số ngày trễ, nhiều nhất trước. Tên người nộp đã che bớt; mã hồ sơ, tên thủ tục và ngày tháng là số liệu mẫu.</div>'
        : hccEmpty('Không có hồ sơ trễ hạn', 'Đơn vị không có hồ sơ trễ hạn trong kỳ này.'));
  }
  return h + '</div>';
}

    ['tthc_truc_tuyen_detail', 'formalitiesCode, formalitiesName, unit_id', 'Danh mục thủ tục theo đơn vị'],

  let h = hccHeader('home');

    '<table class="stc-tbl sgd-tbl-l"><thead><tr><th>Endpoint</th><th>Trường dữ liệu chính</th><th>Dùng cho chỉ tiêu</th><th>Trạng thái</th></tr></thead><tbody>' +
    eps.map((e) => '<tr><td class="sgd-mono">' + hccE(e[0]) + '</td><td class="sgd-mono">' + hccE(e[1]) + '</td><td>' + hccE(e[2]) + '</td><td><span class="stc-bd warn">Chỉ có schema</span></td></tr>').join('') + '</tbody></table></div>';

    ['Không có tab: trang chủ có 5 thẻ nhóm, mỗi nhóm một màn; thêm màn Chi tiết theo cấp bậc và màn Theo đơn vị.', 'Sơ đồ cây thẻ số cho chỉ tiêu cộng được; chỉ tiêu 3 cấp (trước/đúng/trễ hạn → khối) mọc thêm hàng thẻ.', 'Cầu nối tăng giảm so kỳ này với kỳ trước (quý liền trước).', 'Tỷ lệ (đúng hạn, số hóa, hài lòng) không cộng lại; mức Thành phố luôn là bình quân gia quyền (tổng tử ÷ tổng mẫu).', 'Trễ hạn, tồn, chưa trực tuyến, không hài lòng tăng là đỏ; số hồ sơ tiếp nhận, đánh giá để màu trung tính.', 'Số thủ tục cấp Thành phố lấy ở nút gốc, không cộng các đơn vị.', 'Không nội suy kỳ thiếu số; không tự đặt số mục tiêu khi chưa có chỉ tiêu kế hoạch.'].map((t) => '<li>' + hccE(t) + '</li>').join('') + '</ol></div></div>';
  h += '<div class="stc-mt">' + hccNote('<b>Cần xin Trung tâm Phục vụ HCC:</b> (1) bản ghi thật của 9 endpoint cho ít nhất hai kỳ; (2) tham số kỳ (từ ngày – đến ngày, tháng hay quý, có lũy kế không); (3) cây đơn vị: level nào là Thành phố / khối / đơn vị, đã theo 126 phường/xã mới chưa; (4) department_code của ttgqhs ghép với id/code của cây đơn vị thế nào; (5) ý nghĩa totalKyTruoc, totalHT, total_Other và mã status của ttgqhs_detail; (6) thong_ke_tai_khoan là lũy kế hay trong kỳ.') + '</div>';
