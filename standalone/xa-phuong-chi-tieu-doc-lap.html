/* ============================== KHAI BÁO GỌN: ctmMake ==============================
   Dùng cho đa số đơn vị (số ước tính theo quy mô): mỗi chỉ tiêu một dòng, phần màn nhóm và bảng xã/phường tự dựng.
   ctmMake({
     id, role, name, org, short, per: 'nam' (5 năm 2021–2025) | 'quy' (6 quý 1/2025–2/2026),
     m: {
       khóa: [nhãn, đơn vị, số lẻ, SỐ KỲ MỚI NHẤT, mức đổi mỗi kỳ, 'cờ', nhãn ngắn],   // mức đổi: % (đơn vị '%' thì là điểm %);
                                                                                 // cờ: i = giảm là tốt, n = trung tính
       khóa: [nhãn, đơn vị, số lẻ, [số từng kỳ, mới nhất trước], 0, 'cờ', nhãn ngắn],   // số thật / số đã chốt từng kỳ
       khóa: { l, u, d, sum: [khóa…] } | { l, u, d, f: (D) => số }                    // tính từ chỉ tiêu khác
     },
     kpis: [khóa | [khóa, 'dòng phụ' | (D, P) => chuỗi]],   // tự trỏ tới nhóm có chỉ tiêu đó
     groups: [{ id, label, note, lines: [khóa…], parts: [tổng, [phần…], tiêu đề], table: [tổng|null, [dòng…], tiêu đề, cột đầu],
                rates: [[khóa %…], tiêu đề], cols: khóa, cols2: khóa, top: chỉ tiêu xã, hint }],
     xa: [{ id, l, u, d, better, from: khóa (chia số Thành phố), k: hệ số phần thuộc cấp xã, w: 'pop'|'xa'|'pho'|'ho'|'dt' }
          | { id, …, per: [chỉ tiêu xã, 'ds'|'ho', nhân] } | { id, …, pct: [tử, mẫu] } | { id, …, rate: khóa %, spread: điểm }],
     card, note, xaNote
   }) */
const CTM_PER = {
  nam: ['2025', '2024', '2023', '2022', '2021'].map((y) => ({ id: y, label: 'Năm ' + y, short: y })),
  quy: [['2026', 2], ['2026', 1], ['2025', 4], ['2025', 3], ['2025', 2], ['2025', 1]].map((x) => ({ id: x[0] + 'Q' + x[1], label: 'Quý ' + x[1] + '/' + x[0], short: 'Q' + x[1] + '/' + x[0].slice(2) }))
};
function ctmRound(v, d) { if (v == null || !isFinite(v)) return null; const p = Math.pow(10, d || 0); return Math.round(v * p) / p; }
/* Chuỗi số các kỳ (mới nhất trước) từ số kỳ mới nhất và mức đổi mỗi kỳ, nhiễu nhỏ cố định theo hạt giống. */
function ctmSeries(seed, now, g, n, d, isPct) {
  const out = [now];
  for (let i = 1; i < n; i++) {
    const r = ctmRng(seed + '|' + i)() - 0.5;
    let v = isPct ? now - g * i + r * Math.max(0.3, Math.abs(g)) * 0.8 : now / Math.pow(1 + g / 100, i) * (1 + r * 0.03);
    if (isPct) v = Math.max(0, Math.min(100, v));
    out.push(ctmRound(v, d));
  }
  return out;
}
function ctmXaW(u, w) {
  if (w === 'xa') return u.ds * (u.k === 'X' ? 1.4 : 0.75);
  if (w === 'pho') return u.ds * (u.k === 'P' ? 1.4 : 0.75);
  if (w === 'ho') return u.ho;
  if (w === 'dt') return u.dt;
  if (w === 'const') return 1;
  return u.ds;
}
function ctmMake(def) {
  const periods = def.periods || CTM_PER[def.per || 'nam'], N = periods.length;
  const metrics = {}, base = {}, comp = [];
  Object.keys(def.m).forEach((k) => {
    const x = def.m[k];
    if (Array.isArray(x)) {
      const fl = x[5] || '';
      metrics[k] = { l: x[0], u: x[1], d: x[2] || 0, short: x[6], inv: fl.indexOf('i') >= 0, neutral: fl.indexOf('n') >= 0, ck: fl.indexOf('k') >= 0, td: fl.indexOf('t') >= 0, plan: fl.indexOf('p') >= 0 };
      base[k] = Array.isArray(x[3]) ? x[3] : ctmSeries(def.id + '|' + k, x[3], x[4] || 0, N, x[2] || 0, x[1] === '%');
    } else {
      metrics[k] = { l: x.l, u: x.u, d: x.d || 0, short: x.short, inv: !!x.inv, neutral: !!x.neutral, ck: !!x.ck, td: !!x.td, plan: !!x.plan };
      comp.push([k, x]);
    }
  });
  const data = (pid) => {
    const i = periods.findIndex((p) => p.id === pid);
    if (i < 0) return null;
    const D = {};
    Object.keys(base).forEach((k) => { D[k] = base[k][i] == null ? null : base[k][i]; });
    comp.forEach(([k, x]) => {
      let v = null;
      try { v = x.sum ? x.sum.reduce((s, p) => (s == null || D[p] == null ? null : s + D[p]), 0) : x.f(D, i); } catch (e) { v = null; }
      D[k] = ctmRound(v, x.d || 0);
    });
    return D;
  };
  const grpOf = (k) => (def.groups || []).find((g) => (g.lines || []).indexOf(k) >= 0);
  const xaOf = (k) => (def.xa || []).find((I) => I.from === k);
  const kpis = (def.kpis || []).map((k) => {
    const o = Array.isArray(k) ? { m: k[0], sub: k[1] } : typeof k === 'string' ? { m: k } : Object.assign({}, k);
    if (typeof o.sub === 'string') { const s = o.sub; o.sub = () => s; }
    if (!o.target) { const g = grpOf(o.m), I = xaOf(o.m); o.target = g ? 'g:' + g.id : I ? 'xa:' + I.id : ''; }
    return o;
  });
  let xa = null;
  if (def.xa && def.xa.length) {
    const inds = def.xa.map((I) => {
      const o = Object.assign({ d: 0, better: 'high' }, I);
      o.v = (r) => r[I.id];
      if (I.from) o.tot = true;
      if (I.rate) o.tp = (D) => D[I.rate];
      if (I.per) o.tp = (D, rows) => { const a = rows.reduce((s, r) => s + (r[I.per[0]] || 0), 0), b = rows.reduce((s, r) => s + r.u[I.per[1]], 0); return b ? a / b * I.per[2] : null; };
      if (I.pct) o.tp = (D, rows) => { const a = rows.reduce((s, r) => s + (r[I.pct[0]] || 0), 0), b = rows.reduce((s, r) => s + (r[I.pct[1]] || 0), 0); return b ? a / b * 100 : null; };
      return o;
    });
    xa = {
      label: def.xaLabel || 'Theo 126 xã, phường', inds: inds, note: def.xaNote || 'Tên, loại (phường hay xã), dân số và diện tích của 126 xã, phường là số thật theo phương án sắp xếp đơn vị hành chính cấp xã năm 2025; số chỉ tiêu của từng nơi được chia từ số toàn Thành phố theo quy mô dân số.',
      rows: (pid) => {
        const D = data(pid);
        if (!D) return [];
        const rows = CTM_XA.map((u) => ({ u: u }));
        def.xa.forEach((I) => {
          if (I.from) {
            const tot = D[I.from] == null ? null : D[I.from] * (I.k == null ? 1 : I.k);
            if (tot == null) { rows.forEach((r) => { r[I.id] = null; }); return; }
            const w = rows.map((r) => ctmXaW(r.u, I.w) * (0.7 + 0.6 * ctmRng(def.id + '|' + I.id + '|' + r.u.name)()) * (0.95 + 0.1 * ctmRng(def.id + '|' + I.id + '|' + r.u.name + '|' + pid)()));
            const v = (I.d || 0) === 0 ? ctmShareInt(Math.round(tot), w) : ctmShare(tot, w);
            rows.forEach((r, i) => { r[I.id] = v[i]; });
          } else if (I.rate) {
            rows.forEach((r) => { const x = D[I.rate]; r[I.id] = x == null ? null : Math.max(0, Math.min(100, x + (ctmRng(def.id + '|' + I.id + '|' + r.u.name)() - 0.5) * (I.spread || 6) + (ctmRng(def.id + '|' + I.id + '|' + r.u.name + '|' + pid)() - 0.5) * 1.5)); });
            /* chỉnh để 126 xã gộp lại theo dân số đúng bằng tỷ lệ Thành phố (quy tắc H20) */
            const x = D[I.rate];
            if (x != null) {
              for (let it = 0; it < 3; it++) {
                let a = 0, b = 0;
                rows.forEach((r) => { if (r[I.id] != null) { a += r[I.id] * r.u.ds; b += r.u.ds; } });
                const sh = b ? x - a / b : 0;
                if (Math.abs(sh) < 1e-6) break;
                rows.forEach((r) => { if (r[I.id] != null) r[I.id] = Math.max(0, Math.min(100, r[I.id] + sh)); });
              }
            }
          } else if (I.per) {
            rows.forEach((r) => { const a = r[I.per[0]]; r[I.id] = a == null ? null : a / r.u[I.per[1]] * I.per[2]; });
          } else if (I.pct) {
            rows.forEach((r) => { const a = r[I.pct[0]], b = r[I.pct[1]]; r[I.id] = a == null || !b ? null : a / b * 100; });
          }
        });
        return rows;
      }
    };
  }
  return ctmRegister({
    id: def.id, role: def.role, level: def.level || 'city', name: def.name, org: def.org, short: def.short,
    periods: periods, kind: def.per === 'quy' ? 'quý' : 'năm', cmpRef: def.per === 'quy' ? 'quý trước' : 'năm trước',
    data: data, metrics: metrics, kpis: kpis, groups: def.groups || [], xa: xa, card: def.card, cardL: def.cardL, note: def.note, foot: def.foot
  });
}

/* Loại "Theo dõi nhiệm vụ" (VPTU, HĐND, MTTQ): số nhiệm vụ theo 6 trạng thái của hệ thống theo dõi nhiệm vụ, theo khối.
   khoi: [{ id, label, now: [mới tạo, chờ phê duyệt, xin gia hạn, hoàn thành, kết thúc, thu hồi] }] — số kỳ mới nhất (Quý 2/2026). */
const CTM_TASK_ST = [['moi', 'Mới tạo'], ['cho', 'Chờ phê duyệt'], ['gh', 'Xin gia hạn'], ['ht', 'Hoàn thành'], ['kt', 'Kết thúc'], ['th', 'Thu hồi']];
function ctmTaskSpec(def) {
  const m = {}, multi = def.khoi.length > 1, groups = [];
  def.khoi.forEach((K, ki) => {
    const p = K.id + '_';

  }

  const kpis = multi
    ? [['all_tong', 'nhiệm vụ đang theo dõi'], ['all_xong', 'hoàn thành, kết thúc'], ['all_htR', 'trên tổng nhiệm vụ'], ['all_cho', 'chờ phê duyệt'], ['all_gh', 'xin gia hạn'], ['all_th', 'nhiệm vụ bị thu hồi']].concat(def.khoi.slice(0, 2).map((K) => [K.id + '_tong', K.label]))

  return ctmTd(ctmMake({ id: def.id, role: def.role, name: def.name, org: def.org, short: def.short, per: 'quy', m: m, kpis: kpis, groups: groups,
    card: multi ? ['all_tong', 'all_xong', 'all_htR', 'all_cho'] : [P + 'tong', P + 'xong', P + 'htR', P + 'cho'],
    note: 'kỳ báo cáo là quý, số nhiệm vụ lũy kế đến cuối quý theo hệ thống theo dõi nhiệm vụ (số tại thời điểm), so với quý liền trước. Số nhiệm vụ mới, chờ, gia hạn tăng hay giảm để màu trung tính; thu hồi tăng là màu đỏ.' }));
}

   Khai báo cho bộ khung ctm-engine.js: màn ngoài của trục MTTQ cấp Thành phố và phần chi tiết từng ban, đơn vị.
   SỐ LIỆU: số công bố công khai được giữ đúng (ghi "số công bố" ở chú thích từng dòng); số còn lại là số ước tính, đặt theo

/* ---------- Ban Tuyên giáo và Công tác Xã hội: Quỹ “Vì người nghèo”, nhà Đại đoàn kết, chăm lo Tết, Quỹ “Vì biển, đảo” ---------- */
const MTQ_QUY_BASE = {

     lễ phát động Quỹ "Vì biển, đảo Việt Nam" 2025 tiếp nhận hơn 40 tỷ đồng (số công bố). */
  2025: { thu: 214.6, chi: 203.3, tp: 121.8, xa: 92.8, ct: 93, xmN: 612, scN: 268, xmBq: 55.1, scBq: 25.0, cn: 9570, cn0: 43, suatTP: 5280, suatNCT: 300, suatAll: 152600, bd: 52.7, bdLe: 40, tet: 'Tết Bính Ngọ 2026' },
  /* 2024: 9.928 hộ cận nghèo theo kết quả rà soát cuối năm 2024 (số công bố). 2024 + 9 tháng 2025: xây mới 1.034, sửa chữa 476 nhà, 69,8 tỷ đồng (số công bố) */

const MTQ_QUY_TON_DAU_2021 = 19.8;
/* Cơ cấu phần chi ngoài nhà Đại đoàn kết (Tết, an sinh khác, sinh kế, học tập, khám chữa bệnh) */
const MTQ_QUY_CHI_CC = [['cTet', 0.4766], ['cAs', 0.2712], ['cSk', 0.1132], ['cHt', 0.0790], ['cKcb', 0.0600]];
/* Cơ cấu người ủng hộ Quỹ "Vì biển, đảo Việt Nam" */
const MTQ_BD_CC = [['bdCq', 0.406], ['bdMt', 0.353], ['bdDn', 0.186], ['bdCn', 0.055]];
const MTQ_QUY_PERIODS = ['2025', '2024', '2023', '2022', '2021'].map((y) => ({ id: y, label: 'Năm ' + y, short: y }));

function mtqQuyData(pid) {
  const B = MTQ_QUY_BASE[pid];
  if (!B) return null;
  const D = Object.assign({}, B);
  /* tồn quỹ nối tiếp các năm: tồn đầu năm = tồn cuối năm trước */
  let ton = MTQ_QUY_TON_DAU_2021;
  for (const y of ['2021', '2022', '2023', '2024', '2025']) { const b = MTQ_QUY_BASE[y]; if (y === pid) { D.tonDau = ton; } ton = Math.round((ton + b.thu - b.chi) * 10) / 10; if (y === pid) { D.ton = ton; break; } }
  D.cxm = Math.round(B.xmN * B.xmBq / 100) / 10;
  D.csc = Math.round(B.scN * B.scBq / 100) / 10;
  const rest = Math.round((B.chi - D.cxm - D.csc) * 10) / 10;
  let used = 0;
  MTQ_QUY_CHI_CC.forEach((c, i) => { const v = i === MTQ_QUY_CHI_CC.length - 1 ? Math.round((rest - used) * 10) / 10 : Math.round(rest * c[1] * 10) / 10; D[c[0]] = v; used += v; });
  D.nhaN = B.xmN + B.scN;
  D.nhaKp = Math.round((D.cxm + D.csc) * 10) / 10;
  D.kpTP = (B.suatTP * 1 + B.suatNCT * 0.5) / 1000;
  D.kpAll = D.cTet;
  D.kpXa = Math.round((D.kpAll - D.kpTP) * 100) / 100;
  let bu = 0;
  MTQ_BD_CC.forEach((c, i) => { const v = i === MTQ_BD_CC.length - 1 ? Math.round((B.bd - bu) * 10) / 10 : Math.round(B.bd * c[1] * 10) / 10; D[c[0]] = v; bu += v; });
  return D;
}
/* 126 xã, phường: quỹ vận động tại cơ sở, hộ cận nghèo, nhà Đại đoàn kết — chia từ tổng Thành phố theo dân số thật. */
function mtqQuyXaRows(pid) {
  const D = mtqQuyData(pid);
  if (!D) return [];
  const seeds = CTM_XA.map((u) => { const g = ctmRng('mttq-quy|' + u.name); return { u: u, a: g(), b: g(), c: g(), y: ctmRng('mttq-quy|' + u.name + '|' + pid)() }; });
  const q = ctmShare(D.xa * 1000, seeds.map((s) => s.u.ds * (s.u.k === 'P' ? 1.35 : 0.85) * (0.75 + 0.5 * s.a) * (0.94 + 0.12 * s.y)));
  let cn = null;
  if (D.cn != null) {
    const zero = {};
    CTM_XA.slice().sort((x, y) => y.den - x.den).slice(0, D.cn0 || 0).forEach((u) => { zero[u.name] = 1; });
    cn = ctmShareInt(D.cn, seeds.map((s) => (zero[s.u.name] ? 0 : s.u.ho * (s.u.k === 'X' ? 1 : 0.35) * (0.4 + 1.2 * s.b) / Math.sqrt(s.u.den / 1000))));
  }
  const nha = ctmShareInt(D.nhaN, seeds.map((s, i) => (cn ? cn[i] : s.u.ho * 0.004) + (s.u.ds / 20000) * (0.5 + s.c)));
  return seeds.map((s, i) => ({ u: s.u, q: q[i], qpc: q[i] * 1000 / s.u.ds, cn: cn ? cn[i] : null, cnR: cn ? cn[i] / s.u.ho * 100 : null, nha: nha[i] }));
}

       quỹ "Vì người nghèo", hộ cận nghèo, nhà Đại đoàn kết — Ban Tuyên giáo và CTXH; hội viên — các đoàn thể) nên hai nơi khớp nhau;
     · còn lại tính theo dân số, diện tích thật của xã, phường (ctm-xa.js), phân biệt phường / xã, nhiễu cố định theo tên.
   Kỳ báo cáo: 4 quý từ Quý 3/2025 (chính quyền địa phương hai cấp vận hành từ 01/7/2025).
   Đặt CTM_XA_ALL_TAB = false để bỏ tab "Tất cả" của tài khoản xã, phường (indicators.js, login.js, sidebar-org.js). */
const CTM_XA_ALL_TAB = true;
const CTM_PER_XA = [['2026', 2], ['2026', 1], ['2025', 4], ['2025', 3]].map((x) => ({ id: x[0] + 'Q' + x[1], label: 'Quý ' + x[1] + '/' + x[0], short: 'Q' + x[1] + '/' + x[0].slice(2) }));

/* Xã, phường đang xem (currentXaId là số thứ tự trong wardNames(), login.js) */
function ctmCurrentXaUnit() {
  if (typeof currentXaId === 'undefined' || currentXaId == null) return null;
  const names = typeof wardNames === 'function' ? wardNames() : null;
  const nm = names ? names[Number(currentXaId)] : null;
  return nm ? ctmXaByName(nm) : null;
}
function ctmXaWord(ctx) { return ctx && ctx.xa && ctx.xa.k === 'X' ? 'xã' : 'phường'; }
/* Tên đơn vị trong danh mục ghi "phường" cho mọi nơi — đổi thành "xã" khi đang xem một xã */
function ctmXaLoc(s, ctx) { const w = ctmXaWord(ctx); return String(s == null ? '' : s).replace(/phường/g, w).replace(/Phường/g, w === 'xã' ? 'Xã' : 'Phường'); }
function ctmXaOf(u) { return (u.k === 'P' ? 'phường ' : 'xã ') + u.short; }

/* ---------- Bộ sinh số ---------- */
function ctmXr(id, k, u, pid) { return ctmRng(id + '|' + k + '|' + u.name + (pid ? '|' + pid : ''))(); }
const CX = {
  /* số theo xã, phường của một đơn vị cấp Thành phố (bảng "Theo 126 xã, phường" của đơn vị đó), cùng kỳ */
  city: (specId, ind, fixPid) => (u, pid) => {
    const s = CTM_SPECS[specId];
    if (!s) return null;
    const r = ctmXaRows(s, fixPid || pid, { xa: null }).find((x) => x.u.name === u.name);
    return r ? r[ind] : null;
  },
  /* theo quy mô: base mỗi kỳ trên 1.000 dân (by 'ds'), trên 1.000 hộ ('ho'), trên km² ('dt') hoặc mỗi đơn vị ('const');
     o.kx = [hệ số phường, hệ số xã]; o.s = độ lệch giữa các nơi; o.g = % tăng mỗi kỳ; o.q = hệ số mùa theo quý {1..4} */
  per: (base, o) => (u, pid, i, id, k) => {
    o = o || {};
    const by = o.by || 'ds', basis = by === 'const' ? 1 : by === 'dt' ? u.dt : (by === 'ho' ? u.ho : u.ds) / 1000;
    const kx = o.kx ? (u.k === 'P' ? o.kx[0] : o.kx[1]) : 1, s = o.s == null ? 0.25 : o.s, q = o.q ? o.q[pid.slice(-1)] || 1 : 1;
    return base * basis * kx * q * (1 + (ctmXr(id, k, u) - 0.5) * 2 * s) / Math.pow(1 + (o.g || 0) / 100, i) * (1 + (ctmXr(id, k, u, pid) - 0.5) * 0.06);
  },
  /* tỷ lệ %: base ± o.s điểm giữa các nơi, o.kx = [cộng thêm ở phường, ở xã], o.g = điểm tăng mỗi kỳ */
  rate: (base, o) => (u, pid, i, id, k) => {
    o = o || {};
    const kx = o.kx ? (u.k === 'P' ? o.kx[0] : o.kx[1]) : 0;
    const v = base + kx + (ctmXr(id, k, u) - 0.5) * 2 * (o.s == null ? 3 : o.s) - (o.g || 0) * i + (ctmXr(id, k, u, pid) - 0.5) * 0.6;
    return Math.max(o.min || 0, Math.min(o.max || 100, v));
  },
  /* số của Trung tâm Phục vụ HCC cho đúng xã, phường (hcc-data.js: hccUnits, cùng mã kỳ '2026Q2'…); chưa nạp HCC thì dùng `fb` */
  hcc: (f, fb) => (u, pid, i, id, k) => {
    if (typeof hccUnits === 'function') {
      const r = hccUnits().find((x) => x.name === u.name), o = r && r.v[pid];
      if (o) { const v = f(o); if (v != null && isFinite(v)) return v; }
    }
    return fb ? fb(u, pid, i, id, k) : null;
  },
  fix: (arr) => (u, pid, i) => arr[i],
  /* tỷ lệ % theo số từng xã, phường của Sở Y tế (syt-config.js: SYT_UNITS, theo tháng năm 2026) — nguồn chính đã chốt 12/10/2026:
     quý 2026 lấy tháng cuối quý (Quý 1 → tháng 3, Quý 2 → tháng 6); quý 2025 chưa có số tháng nên suy theo xu hướng tháng 1–6/2026 của chính xã đó */
  syt: (field) => (u, pid) => {
    if (typeof SYT_UNITS === 'undefined') return null;
    const s = SYT_UNITS.find((x) => x.ten === u.name);
    if (!s || !s.dan || !s[field]) return null;
    const r = (m) => s[field][m] / s.dan * 100, sl = (r(5) - r(0)) / 5;
    return { '2026Q2': r(5), '2026Q1': r(2), '2025Q4': r(0) - sl, '2025Q3': r(0) - 4 * sl }[pid];
  }
};

/* ---------- Khai báo một đơn vị cấp xã ----------
   ctmXaUnit({ id, role, name, org, m: { khóa: [nhãn, đơn vị, số lẻ, bộ sinh số, 'cờ', nhãn ngắn] | { l, u, d, f: (D, u, pid, i) => số } },
               kpis, groups (như ctmMake), cmp: [khóa | { m, tot, better, l }] — chỉ tiêu so với 126 xã, phường, card, note }) */
function ctmXaUnit(def) {
  const periods = def.periods || CTM_PER_XA, metrics = {}, gens = {}, comp = [];
  Object.keys(def.m).forEach((k) => {
    const x = def.m[k];
    if (Array.isArray(x)) {
      const fl = x[4] || '';
      metrics[k] = { l: x[0], u: x[1], d: x[2] || 0, short: x[5], inv: fl.indexOf('i') >= 0, neutral: fl.indexOf('n') >= 0, ck: fl.indexOf('k') >= 0, td: fl.indexOf('t') >= 0, plan: fl.indexOf('p') >= 0 };
      gens[k] = x[3];
    } else {
      metrics[k] = { l: x.l, u: x.u, d: x.d || 0, short: x.short, inv: !!x.inv, neutral: !!x.neutral, ck: !!x.ck, td: !!x.td, plan: !!x.plan };
      comp.push([k, x]);
    }
  });
  const data = (pid, ctx) => {
    const u = ctx && ctx.xa, i = periods.findIndex((p) => p.id === pid);
    if (!u || i < 0) return null;
    const D = {};
    Object.keys(gens).forEach((k) => {
      const g = gens[k];
      let v = null;
      try { v = typeof g === 'function' ? g(u, pid, i, def.id, k) : Array.isArray(g) ? g[i] : g; } catch (e) { v = null; }
      D[k] = v == null || !isFinite(v) ? null : ctmRound(v, metrics[k].d);
    });
    comp.forEach(([k, x]) => {
      let v = null;
      try { v = x.sum ? x.sum.reduce((s, p) => (s == null || D[p] == null ? null : s + D[p]), 0) : x.f(D, u, pid, i); } catch (e) { v = null; }
      D[k] = v == null || !isFinite(v) ? null : ctmRound(v, x.d || 0);
    });
    return D;
  };
  const grpOf = (k) => (def.groups || []).find((g) => (g.lines || []).indexOf(k) >= 0);
  const cmp = (def.cmp || []).map((c) => (typeof c === 'string' ? { m: c } : c));
  const kpis = (def.kpis || []).map((k) => {
    const o = Array.isArray(k) ? { m: k[0], sub: k[1] } : typeof k === 'string' ? { m: k } : Object.assign({}, k);
    if (typeof o.sub === 'string') { const s = o.sub; o.sub = () => s; }
    if (!o.target) { const g = grpOf(o.m); o.target = g ? 'g:' + g.id : cmp.some((c) => c.m === o.m) ? 'xa:' + o.m : ''; }
    return o;
  });
  const spec = {
    id: def.id, role: def.role, level: 'xa',
    name: (ctx) => ctmXaLoc(def.name, ctx),
    org: (ctx) => (ctx && ctx.xa ? ctmXaLoc(def.org, ctx) + ' ' + ctmXaOf(ctx.xa) : ''),
    periods: periods, kind: 'quý', cmpRef: 'quý trước', data: data, metrics: metrics, kpis: kpis, groups: def.groups || [], card: def.card,
    note: def.note || 'kỳ báo cáo là quý; số phát sinh, số lũy kế so cùng kỳ năm trước, số tại thời điểm so quý liền trước. Chính quyền địa phương hai cấp vận hành từ 01/7/2025 nên có số từ Quý 3/2025 và chưa có số cùng kỳ năm trước. Bấm "So với 126 xã, phường" để xem vị trí của đơn vị trong toàn Thành phố.'
  };
  if (cmp.length) {
    spec.xa = {
      label: 'So với 126 xã, phường',
      cardRows: ['Vị trí của đơn vị trong 126 xã, phường theo từng chỉ tiêu', 'Mức chung Thành phố, nơi cao nhất, thấp nhất', 'Hồ sơ từng xã, phường: dân số, diện tích, các chỉ tiêu và hạng', 'Lọc phường / xã, tìm theo tên'],
      inds: cmp.map((c) => {
        const m = metrics[c.m] || {};
        return { id: c.m, l: c.l || m.l, u: m.u, d: m.d, better: c.better || (m.inv ? 'low' : m.neutral ? 'none' : 'high'), tot: !!c.tot, w: c.w, minW: c.minW, rank: c.rank, v: (r) => r[c.m] };
      }),
      rows: (pid) => CTM_XA.map((u) => Object.assign({ u: u }, ctmD(spec, pid, { xa: u }) || {})),
      note: def.xaNote || 'Tên, loại (phường hay xã), dân số và diện tích của 126 xã, phường là số thật theo phương án sắp xếp đơn vị hành chính cấp xã năm 2025. Mỗi xã, phường tính cùng một cách nên so sánh được với nhau.'
    };
  }
  return ctmRegister(spec);
}

/* Loại "Theo dõi nhiệm vụ" của xã, phường: 6 trạng thái, số lũy kế theo quy mô dân số. base = số của một xã, phường cỡ trung bình (70.000 dân) ở Quý 2/2026 */
function ctmXaTask(def) {
  const m = {};
  CTM_TASK_ST.forEach((s, si) => {
    const g = si === 3 || si === 4 ? 22 : si === 5 ? 10 : 6;
    m[s[0]] = [s[1], 'nhiệm vụ', 0, (u, pid, i, id, k) => def.base[si] * Math.sqrt(u.ds / 70000) * (0.75 + 0.5 * ctmXr(id, k, u)) / Math.pow(1 + g / 100, i), si === 5 ? 'i' : 'n', s[1]];
  });
  m.tong = { l: 'Tổng nhiệm vụ đang theo dõi', short: 'Tổng nhiệm vụ', u: 'nhiệm vụ', sum: CTM_TASK_ST.map((s) => s[0]) };
  m.xong = { l: 'Đã hoàn thành, kết thúc', short: 'Hoàn thành, kết thúc', u: 'nhiệm vụ', sum: ['ht', 'kt'] };
  m.dang = { l: 'Đang xử lý (mới tạo, chờ phê duyệt, xin gia hạn)', short: 'Đang xử lý', u: 'nhiệm vụ', neutral: true, sum: ['moi', 'cho', 'gh'] };
  m.htR = { l: 'Tỷ lệ hoàn thành', short: 'Tỷ lệ hoàn thành, kết thúc', u: '%', d: 1, f: (D) => (D.tong ? (D.ht + D.kt) / D.tong * 100 : null) };
  m.thR = { l: 'Tỷ lệ thu hồi', u: '%', d: 1, inv: true, f: (D) => (D.tong ? D.th / D.tong * 100 : null) };
  return ctmTd(ctmXaUnit({
    id: def.id, role: def.role, name: def.name, org: def.org, m: m,
    kpis: [['tong', 'nhiệm vụ đang theo dõi'], ['xong', 'hoàn thành, kết thúc'], ['htR', 'trên tổng nhiệm vụ'], ['moi', 'mới tạo'], ['cho', 'chờ phê duyệt'], ['gh', 'xin gia hạn'], ['th', 'nhiệm vụ bị thu hồi'], ['thR', 'trên tổng nhiệm vụ']],
    card: ['tong', 'xong', 'htR', 'cho'],
    groups: [{ id: 'nv', label: 'Nhiệm vụ', note: 'Nhiệm vụ theo 6 trạng thái của hệ thống theo dõi nhiệm vụ', lines: ['tong', 'xong', 'dang', 'th'], parts: ['tong', CTM_TASK_ST.map((s) => s[0]), 'Nhiệm vụ theo trạng thái'], rates: [['htR', 'thR'], 'Tỷ lệ hoàn thành, thu hồi'] }],
    cmp: [{ m: 'htR', w: 'tong' }, { m: 'tong', tot: true }],
    note: 'kỳ báo cáo là quý, số nhiệm vụ lũy kế đến cuối quý theo hệ thống theo dõi nhiệm vụ (số tại thời điểm), so với quý liền trước.'
  }));
}
