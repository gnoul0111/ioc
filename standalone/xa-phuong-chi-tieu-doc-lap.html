    m[p + 'thR'] = { l: 'Tỷ lệ thu hồi', u: '%', d: 1, inv: true, f: (D) => (D[p + 'tong'] ? D[p + 'th'] / D[p + 'tong'] * 100 : null) };
    groups.push({ id: K.id, label: K.label, note: 'Nhiệm vụ theo 6 trạng thái của hệ thống theo dõi nhiệm vụ', lines: [p + 'tong', p + 'xong', p + 'dang', p + 'th'],
      parts: [p + 'tong', CTM_TASK_ST.map((s) => p + s[0]), 'Nhiệm vụ theo trạng thái'], rates: [[p + 'htR', p + 'thR'], 'Tỷ lệ hoàn thành, thu hồi'] });
  });
  if (multi) {
    CTM_TASK_ST.forEach((s) => { m['all_' + s[0]] = { l: s[1], short: s[1], u: 'nhiệm vụ', inv: s[0] === 'th', neutral: s[0] !== 'th', sum: def.khoi.map((K) => K.id + '_' + s[0]) }; });
    m.all_tong = { l: 'Tổng nhiệm vụ đang theo dõi', short: 'Tổng nhiệm vụ', u: 'nhiệm vụ', sum: CTM_TASK_ST.map((s) => 'all_' + s[0]) };
    m.all_xong = { l: 'Đã hoàn thành, kết thúc', u: 'nhiệm vụ', sum: ['all_ht', 'all_kt'] };
    m.all_htR = { l: 'Tỷ lệ hoàn thành', u: '%', d: 1, f: (D) => (D.all_tong ? (D.all_ht + D.all_kt) / D.all_tong * 100 : null) };
    groups.unshift({ id: 'all', label: 'Tổng hợp các khối', note: 'Cộng ' + def.khoi.length + ' khối', lines: ['all_tong', 'all_xong', 'all_cho', 'all_th'],
      parts: ['all_tong', def.khoi.map((K) => K.id + '_tong'), 'Nhiệm vụ theo khối'], table: ['all_tong', CTM_TASK_ST.map((s) => 'all_' + s[0]), 'Nhiệm vụ theo trạng thái', 'Trạng thái'] });
  }
  const P = multi ? 'all_' : def.khoi[0].id + '_';
  const kpis = multi
    ? [['all_tong', 'nhiệm vụ đang theo dõi'], ['all_xong', 'hoàn thành, kết thúc'], ['all_htR', 'trên tổng nhiệm vụ'], ['all_cho', 'chờ phê duyệt'], ['all_gh', 'xin gia hạn'], ['all_th', 'nhiệm vụ bị thu hồi']].concat(def.khoi.slice(0, 2).map((K) => [K.id + '_tong', K.label]))
    : [[P + 'tong', 'nhiệm vụ đang theo dõi'], [P + 'xong', 'hoàn thành, kết thúc'], [P + 'htR', 'trên tổng nhiệm vụ'], [P + 'moi', 'mới tạo'], [P + 'cho', 'chờ phê duyệt'], [P + 'gh', 'xin gia hạn'], [P + 'th', 'nhiệm vụ bị thu hồi'], [P + 'thR', 'trên tổng nhiệm vụ']];

  return ctmTd(ctmMake({ id: def.id, role: def.role, name: def.name, org: def.org, short: def.short, per: 'quy', m: m, kpis: kpis, groups: groups,
    card: multi ? ['all_tong', 'all_xong', 'all_htR', 'all_cho'] : [P + 'tong', P + 'xong', P + 'htR', P + 'cho'],
    note: 'kỳ báo cáo là quý, số nhiệm vụ lũy kế đến cuối quý theo hệ thống theo dõi nhiệm vụ (số tại thời điểm), so với quý liền trước. Số nhiệm vụ mới, chờ, gia hạn tăng hay giảm để màu trung tính; thu hồi tăng là màu đỏ.' }));

   Đặt CTM_XA_ALL_TAB = false để bỏ tab "Tất cả" của tài khoản xã, phường (indicators.js, login.js, sidebar-org.js). */

function ctmXaWord(ctx) { return ctx && ctx.xa && ctx.xa.k === 'X' ? 'xã' : 'phường'; }
/* Tên đơn vị trong danh mục ghi "phường" cho mọi nơi — đổi thành "xã" khi đang xem một xã */

/* ============================== ĐỌC GIÁ TRỊ THEO KHUNG EFORM ============================== */
/* Mã chuẩn như tools/xa_eform_schema.py: bỏ ký tự ẩn, bỏ dấu, đ → d (mã "hạn_xử_lý", "chitieuh​oi"… trong file eform) */
function xaEfNorm(s) { return String(s == null ? '' : s).replace(/[​-‏⁠﻿]/g, '').trim().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D'); }
/* Tên hiển thị dùng chung khi một eform để trống tên của mã (Kỳ báo cáo, Quý của Văn hóa, Nội vụ, Kinh tế xã hội) */
const XA_EF_DM_CHUNG = {};
XA_EFORM.forEach((ef) => ef.fields.forEach((f) => (f.dm || []).forEach((o) => { if (o.l && !XA_EF_DM_CHUNG[f.c + '|' + o.v]) XA_EF_DM_CHUNG[f.c + '|' + o.v] = o.l; })));
/* Tên hiển thị của một mã danh mục; null = mã không có trong danh mục của trường */
function xaEfLb(f, v) {
  if (v == null || v === '') return '';
  if (!f || f.t !== 'dm' || !f.dm.length) return String(v);
  const o = f.dm.find((x) => x.v === v);
  return o ? (o.l || XA_EF_DM_CHUNG[f.c + '|' + v] || '') : null;
}
function xaEfIsNum(v) { return typeof v === 'number' && isFinite(v); }
/* Ngày: 'YYYY-MM-DD' hoặc số sê-ri Excel → 'dd/mm/yyyy' */
function xaEfDate(v) {
  if (typeof v === 'number' && isFinite(v)) { const d = new Date(Date.UTC(1899, 11, 30) + v * 864e5); return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear(); }
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
}

function xaEfCell(f, v) {
  if (v == null || v === '') return '';
  if (f.t === 'dm') { const l = xaEfLb(f, v); return l === null ? String(v) : l; }
  if (f.t === 'so') { if (!xaEfIsNum(v)) return String(v); const s = String(v), d = s.indexOf('.') >= 0 ? Math.min(3, s.split('.')[1].length) : 0; return f.c === 'nam' ? s : ctmF(v, d); }
  if (f.t === 'ngay') return xaEfDate(v) || String(v);
  return String(v);
}
/* Đơn vị đọc từ tên trường hoặc tên đơn vị tính (dùng chung với bản ghi mẫu): "Tỷ đồng" → "tỷ đồng", "Học sinh" → "học sinh" */

  kpis: kpis.map((m) => ({ ef: cfg.ef, m: m })), card: (card || kpis.slice(0, 3)).map((m) => cfg.ef + '_' + m)

xaDonVi('hdndxa-eform', 'HDND', 'Hội đồng nhân dân phường', 'HĐND', XA_EF_HDND, ['gs', 'kh', 'tx', 'dong']);

xaDonVi('ubndxa-qlvb', 'UBND', 'Quản lý văn bản', 'UBND', XA_EF_QLVB, ['den', 'di', 'chuaXl', 'dangXl', 'hoanTat']);
xaDonVi('ubndxa-gpmb', 'UBND', 'Giải phóng mặt bằng', 'UBND', XA_EF_GPMB, ['da', 'phai', 'dt', 'tlTh', 'ho', 'bg', 'tlBg', 'kpCt'], ['dt', 'tlTh', 'bg']);
xaDonVi('ubndxa-gd', 'UBND', 'Giáo dục', 'UBND', XA_EF_GD, ['hs', 'dong']);
xaDonVi('ubndxa-yte', 'UBND', 'Y tế', 'UBND', XA_EF_YTE, ['dong']);
xaDonVi('ubndxa-vh', 'UBND', 'Văn hóa', 'UBND', XA_EF_VH, ['ng', 'kp', 'dong']);
xaDonVi('ubndxa-nv', 'UBND', 'Nội vụ', 'UBND', XA_EF_NV, ['dong', 'tlTh', 'tlTra', 'phien', 'luot']);
xaDonVi('ubndxa-ktxh', 'UBND', 'Kinh tế xã hội', 'UBND', XA_EF_KTXH, ['n']);
xaDonVi('mttqxa-eform', 'MTTQ', 'Mặt trận Tổ quốc phường', 'Ủy ban MTTQ', XA_EF_MTTQ, ['doanvien', 'giamsat', 'phanbien', 'hienmau', 'mohinh', 'tongthu', 'tongchi', 'tonquy']);

/* ============================== MÀN NGOÀI TÀI KHOẢN XÃ, PHƯỜNG (bản đọc, câu CHUNG-3) ============================== */
const CTM_XA_SHORT = {
  'dangxa-eform': 'Đảng ủy', 'hdndxa-eform': 'HĐND', 'mttqxa-eform': 'Ủy ban MTTQ',
  'ubndxa-hcc': 'Hành chính công', 'ubndxa-tcns': 'Tài chính - Ngân sách', 'ubndxa-qlvb': 'Quản lý văn bản', 'ubndxa-gpmb': 'GPMB',
  'ubndxa-gd': 'Giáo dục', 'ubndxa-yte': 'Y tế', 'ubndxa-vh': 'Văn hóa', 'ubndxa-nv': 'Nội vụ', 'ubndxa-ktxh': 'Kinh tế xã hội'
};
const CTM_XA_EYE = (ctx) => 'Tổng quan · ' + (ctx && ctx.xa ? ctx.xa.name : 'xã, phường');
const CTM_XA_HINT = (ctx) => (ctx && ctx.xa ? 'Số liệu lấy từ 12 eform của ' + ctx.xa.name + (XA_EF_LA_MAU ? ' (đang là bản ghi mẫu)' : '') + ' · bấm ô để xem các bản ghi tạo ra số' : '');
const CTM_XA_AXES = [{ id: 'DANG', label: 'Đảng ủy phường', ax: 'Đảng ủy' }, { id: 'HDND', label: 'HĐND phường', ax: 'HĐND' }, { id: 'UBND', label: 'UBND phường', ax: 'UBND' }, { id: 'MTTQ', label: 'Ủy ban MTTQ phường', ax: 'MTTQ' }];
const XA_EF_OF = { 'dangxa-eform': 'xa_dang', 'hdndxa-eform': 'xa_hdnd', 'mttqxa-eform': 'xa_mttq', 'ubndxa-hcc': 'xa_hcc', 'ubndxa-tcns': 'xa_tcns', 'ubndxa-qlvb': 'xa_qlvb', 'ubndxa-gpmb': 'xa_gpmb',
  'ubndxa-gd': 'xa_gd', 'ubndxa-yte': 'xa_yte', 'ubndxa-vh': 'xa_vh', 'ubndxa-nv': 'xa_nv', 'ubndxa-ktxh': 'xa_ktxh' };
const xaOvK = (cat, m, l) => ({ cat: cat, m: XA_EF_OF[cat] + '_' + m, target: 'rec:' + efKeyM(XA_EF_OF[cat], m), l: l });
/* Ô số màn ngoài: đúng danh sách câu CHUNG-3 của bản đọc (duyệt 30/10/2026), không thêm, không bớt */
const XA_OV = {
  DANG: [xaOvK('dangxa-eform', 'dong', 'Đảng ủy · dòng số liệu đã nhập')],
  HDND: [xaOvK('hdndxa-eform', 'dong', 'HĐND · dòng số liệu đã nhập')],
  UBND: [xaOvK('ubndxa-hcc', 'tuyen'), xaOvK('ubndxa-hcc', 'dh'), xaOvK('ubndxa-hcc', 'dqh'), xaOvK('ubndxa-qlvb', 'den'), xaOvK('ubndxa-qlvb', 'di'),
    xaOvK('ubndxa-gpmb', 'dt'), xaOvK('ubndxa-gpmb', 'bg'), xaOvK('ubndxa-tcns', 'thu', 'Tổng thu NSNN (lũy kế)'), xaOvK('ubndxa-tcns', 'chi', 'Tổng chi NSNN (lũy kế)'),
    xaOvK('ubndxa-gd', 'dong', 'Giáo dục · dòng số liệu đã nhập'), xaOvK('ubndxa-yte', 'dong', 'Y tế · dòng số liệu đã nhập'), xaOvK('ubndxa-vh', 'dong', 'Văn hóa · dòng số liệu đã nhập'),
    xaOvK('ubndxa-nv', 'dong', 'Nội vụ · dòng số liệu đã nhập'), xaOvK('ubndxa-ktxh', 'n', 'Kinh tế xã hội · dòng số liệu đã nhập')],
  MTTQ: [xaOvK('mttqxa-eform', 'doanvien', 'Đoàn viên · Mặt trận Tổ quốc')]
};
ctmRegisterOverview({
  id: 'xa-4truc', roles: ['DANG', 'HDND', 'UBND', 'MTTQ'], level: 'xa', unitWord: 'eform', rename: ctmXaLoc, short: CTM_XA_SHORT,
  eyebrow: CTM_XA_EYE, hint: CTM_XA_HINT,
  title: (n) => 'Số liệu then chốt của 4 trục, ' + n + ' eform',
  groupTitle: 'Bốn trục · bấm một trục để lọc danh sách eform bên dưới',
  kpis: XA_OV.UBND.concat(XA_OV.MTTQ, XA_OV.DANG, XA_OV.HDND),
  groups: CTM_XA_AXES.map((a) => ({ id: a.id, label: a.label, role: a.id, ax: a.ax }))
});
/* Từng tab trục của tài khoản xã, phường: cùng màn ngoài, không chia nhóm */
CTM_XA_AXES.forEach((A) => {
  ctmRegisterOverview({
    id: 'xa-' + A.id, roles: [A.id], level: 'xa', unitWord: 'eform', rename: ctmXaLoc, short: CTM_XA_SHORT, ax: A.ax,
    eyebrow: (ctx) => CTM_XA_EYE(ctx) + ' · ' + ctmXaLoc(A.label, ctx), hint: CTM_XA_HINT,
    title: (n) => 'Số liệu then chốt của ' + n + ' eform',
    kpis: XA_OV[A.id], groups: []
  });
});
